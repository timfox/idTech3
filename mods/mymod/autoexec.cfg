// ENGINE DEMONSTRATION CONFIG
// Show that the enhanced engine is working

// Renderer settings
set r_renderer "opengl"  // Use OpenGL renderer (Vulkan has issues)

// Display settings
set r_mode "6"           // 800x600
set r_fullscreen "0"     // Windowed
set r_colorbits "32"     // 32-bit color

// Basic modern features
set r_fbo "1"            // Framebuffer objects
set r_vbo "1"            // Vertex buffer objects

// Disable advanced features for stability
set r_pbr "0"
set r_hdr "0"
set r_ssao "0"
set r_bloom "0"

// Font quality settings
set r_fontQuality "2"    // High quality fonts
set r_fontSDF "1"        // Enable Signed Distance Field for smooth text

// Enhanced debugging
set developer "2"        // Maximum debug output
set r_speeds "2"         // Detailed rendering stats
set com_speeds "1"       // Performance stats

// Show engine features
echo "^2=== ENHANCED ENGINE LOADED ==="
echo "^3Advanced Systems Status:"
echo "^5✓ Crash Handler Active"
echo "^5✓ Performance Monitoring Ready"
echo "^5✓ Lua Scripting Engine Loaded"
echo "^5✓ Modern Filesystem Active"
echo "^5✓ Vulkan/OpenGL Renderer Initialized"
echo "^2================================"