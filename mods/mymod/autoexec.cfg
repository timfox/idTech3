//
// BASIC RENDERER SETTINGS - TROUBLESHOOTING MODE
// Force OpenGL with minimal features to ensure rendering works
//

// AGGRESSIVELY FORCE OpenGL renderer (not Vulkan)
set r_renderer "opengl"
set vid_renderer "opengl"
set cl_renderer "opengl"

// Disable Vulkan completely
set r_vulkan "0"
set vk_validate "0"

// Force software rendering if needed
set r_allowSoftwareGL "1"

// Basic resolution and window settings
set r_mode "6"       // 800x600 for testing
set r_fullscreen "0" // Windowed mode
set r_colorbits "32"
set r_depthbits "24"

// Disable all advanced features that might cause issues
set r_pbr "0"        // Disable PBR
set r_fbo "0"        // Disable FBO
set r_vbo "0"        // Disable VBO
set r_cubeMapping "0" // Disable reflections
set r_hdr "0"        // Disable HDR
set r_ssao "0"       // Disable SSAO
set r_bloom "0"      // Disable bloom

// FORCE bitmap fonts (disable TrueType completely)
set r_fontQuality "0"    // Use basic bitmap fonts only
set ui_scale "1.0"       // Normal UI scale

// Disable all font enhancements that might cause issues
set r_fontHinting "0"
set r_fontSubpixel "0"
set r_fontAtlasSize "0"  // Use default atlas

// Debug settings
set developer "1"        // Enable developer mode
set r_speeds "1"         // Show rendering stats
set com_speeds "1"       // Show performance stats

echo "Basic OpenGL mode activated - advanced features disabled for troubleshooting"