// Enhanced Font Configuration File for mymod
// Demonstrates advanced font rendering features

// =============================================================================
// PRIMARY FONT CONFIGURATION
// =============================================================================

// Main UI font with enhanced rendering (with fallbacks)
font "fonts/FX300.ttf" 16

// Small text font (lists, subtitles, tooltips)
smallFont "fonts/FX300.ttf" 12

// Headers and titles (high impact)
bigFont "fonts/FX300.ttf" 24

// CRITICAL: Add fallbacks to base game fonts
fontFallback "fonts/FX300.ttf" 16 "menu/art/font1_prop.tga" "menu/art/font2_prop.tga"

// =============================================================================
// ADVANCED FONT FEATURES (Requires r_fontQuality 2)
// =============================================================================

// Font quality settings (0=fast, 1=normal, 2=high)
fontQuality 2

// Hinting modes (0=none, 1=light, 2=normal, 3=strong)
fontHinting 2

// Subpixel rendering (RGB LCD optimization)
fontSubpixel 1

// =============================================================================
// FONT FALLBACK CHAIN (Unicode Support)
// =============================================================================

// Primary font with fallbacks for missing characters
fontFallback "fonts/FX300.ttf" 16 "fonts/roboto-regular.ttf" "fonts/FX300.ttf"

// CJK and extended Unicode support
fontFallbackCJK "fonts/FX300.ttf" 16 "fonts/roboto-regular.ttf"

// =============================================================================
// SPECIALIZED FONTS (Demonstration)
// =============================================================================

// Decorative header font
decorativeFont "fonts/F5000.ttf" 28

// Monospace/technical font
monoFont "fonts/roboto-regular.ttf" 14

// Game-style font
gameFont "fonts/WO3.ttf" 18

// =============================================================================
// FONT EFFECTS (Requires UI Enhancement Features)
// =============================================================================

// Glow effects for important text
fontGlow "fonts/FX300.ttf" 16 0.5 1.0 1.0 1.0  // Red glow

// Outline effects
fontOutline "fonts/FX300.ttf" 16 1.0 1.0 1.0 2.0  // White outline

// Shadow effects
fontShadow "fonts/FX300.ttf" 16 0.0 0.0 0.0 2.0  // Black shadow

// =============================================================================
// DYNAMIC FONT LOADING
// =============================================================================

// Load additional fonts on demand
loadFont "header" "fonts/2197 Heavy.ttf" 32
loadFont "decorative" "fonts/Fusion.ttf" 24
loadFont "technical" "fonts/roboto-regular.ttf" 12

// =============================================================================
// FONT CACHING & PERFORMANCE
// =============================================================================

// Font atlas size (larger = better quality, more memory)
fontAtlasSize 2048

// Font cache settings
fontCacheSize 1024  // KB of font cache

// =============================================================================
// LOCALIZATION SUPPORT
// =============================================================================

// Font sets for different languages
fontSet "english" "fonts/FX300.ttf"
fontSet "french" "fonts/FX300.ttf"
fontSet "german" "fonts/FX300.ttf"
fontSet "spanish" "fonts/FX300.ttf"
fontSet "japanese" "fonts/FX300.ttf"
fontSet "chinese" "fonts/FX300.ttf"
fontSet "korean" "fonts/FX300.ttf"
fontSet "russian" "fonts/FX300.ttf"

// =============================================================================
// DEBUGGING & MONITORING
// =============================================================================

// Font debugging (shows font loading, glyph rendering)
fontDebug 0  // Set to 1 to enable debug output

// Font metrics display
fontMetrics 0  // Set to 1 to show font metrics overlay

// =============================================================================
// COMPATIBILITY NOTES
// =============================================================================

// Engine Requirements:
// - FreeType 2.x support enabled
// - r_fontQuality >= 1 for enhanced features
// - UI enhancement cvars enabled for effects

// Available Fonts:
// - FX300.ttf (primary UI, clean and readable)
// - Roboto fonts (system-style, excellent Unicode)
// - 2197 series (bold, decorative headers)
// - F5000 series (stylized, game-like)
// - WO3.ttf (retro game font)
// - Fusion.ttf (modern, technical look)

// Fallback Behavior:
// 1. Try primary font
// 2. Try fallback fonts in order
// 3. Fall back to bitmap fonts if all else fails
// 4. Use system fonts as last resort

