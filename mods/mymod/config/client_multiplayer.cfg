// Enhanced Multiplayer Client Configuration
// Optimized for competitive and casual multiplayer gaming

// =============================================================================
// CONNECTION SETTINGS
// =============================================================================

// Network optimization for multiplayer
set cl_maxpackets "100"       // Max packets per second
set cl_packetdup "1"         // Packet duplication
set rate "25000"             // Connection rate limit
set snaps "40"               // Snapshot rate

// Connection quality settings
set cl_timenudge "0"         // Time nudge for prediction
set cl_showTimeDelta "0"     // Show time delta (debug)
set cl_showNet "0"           // Show network info

// =============================================================================
// GAMEPLAY ENHANCEMENT
// =============================================================================

// Enhanced visual settings for competitive play
set cg_draw2D "1"            // Enable 2D HUD
set cg_draw3dIcons "1"       // 3D item icons
set cg_drawIcons "1"         // Draw weapon/item icons
set cg_drawAmmoWarning "1"   // Ammo warning
set cg_drawCrosshair "1"     // Crosshair
set cg_drawCrosshairNames "1" // Names at crosshair
set cg_drawRewards "1"       // Reward messages

// Sound settings
set s_volume "0.8"          // Master volume
set s_musicvolume "0.3"     // Music volume
set s_doppler "1"           // Doppler effect

// =============================================================================
// PERFORMANCE OPTIMIZATION
// =============================================================================

// Client performance settings
set r_fastsky "0"           // High quality sky
set r_drawSun "1"           // Draw sun
set r_dynamiclight "1"      // Dynamic lighting
set r_dlightBacks "1"       // Dynamic light backs

// Texture quality for online play
set r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
set r_detailtextures "1"    // Detail textures
set r_ext_texture_filter_anisotropic "1"  // Anisotropic filtering

// =============================================================================
// ENHANCED FEATURES
// =============================================================================

// Enable enhanced mod features in multiplayer
set r_pbr "1"               // PBR rendering
set perf_monitor_enable "0" // Disable performance monitoring in MP
set com_memoryStats "0"     // Disable memory stats in MP

// Lua scripting for enhanced gameplay
set lua_enabled "1"         // Enable Lua features

// Power-up effects
set cg_drawPowerups "1"     // Show power-up icons
set cg_powerupBlink "1"     // Power-up blinking

// =============================================================================
// HUD CUSTOMIZATION
// =============================================================================

// Enhanced HUD settings
set cg_drawStatus "1"       // Status bar
set cg_drawSnapshot "0"     // Snapshot counter
set cg_drawFPS "1"          // FPS counter
set cg_drawTimer "1"        // Round timer
set cg_drawAttacker "1"     // Last attacker
set cg_drawSpeed "1"        // Speedometer
set cg_drawRankings "1"     // Scoreboard

// Crosshair settings
set cg_crosshairSize "24"   // Crosshair size
set cg_crosshairHealth "1"  // Health-based crosshair color
set cg_crosshairX "0"       // X offset
set cg_crosshairY "0"       // Y offset

// =============================================================================
// CHAT AND COMMUNICATION
// =============================================================================

// Chat settings
set cg_teamChatsOnly "0"    // Show all chat
set cg_noVoiceChats "0"     // Enable voice chat
set cg_noVoiceText "0"      // Enable voice text

// Kill/death messages
set cg_obituary "1"         // Death messages
set cg_teamChatHeight "8"   // Team chat height
set cg_chatHeight "8"       // Chat height

// =============================================================================
// VISUAL EFFECTS
// =============================================================================

// Particle effects
set cg_marks "1"            // Bullet marks
set cg_brassTime "2500"     // Brass ejection time
set cg_gibs "1"             // Gibs
set cg_showmiss "0"         // Show misses

// Screen effects
set cg_damageDraw "1"       // Damage screen effect
set cg_damageKick "1"       // Damage kick
set cg_bobroll "0.002"      // View bobbing
set cg_bobpitch "0.002"     // Pitch bobbing
set cg_bobup "0.005"        // Up bobbing

// =============================================================================
// CONTROLS & INPUT
// =============================================================================

// Mouse settings
set sensitivity "5"         // Mouse sensitivity
set cl_mouseAccel "0"       // Mouse acceleration
set m_pitch "0.022"         // Pitch sensitivity
set m_yaw "0.022"           // Yaw sensitivity

// Key bindings for multiplayer
bind TAB "+scores"          // Scoreboard
bind CAPSLOCK "+voiprecord" // Voice chat
bind F1 "vote yes"          // Vote yes
bind F2 "vote no"           // Vote no

// =============================================================================
// MULTIPLAYER FEATURES
// =============================================================================

// Server browser settings
set cg_blood "1"            // Blood effects
set cg_corpses "1"          // Corpses
set cg_forceModel "0"       // Force player model

// Spectator settings
set cg_spectatorChat "1"    // Spectator chat
set cg_followKiller "1"     // Follow killer

// Demo recording
set cg_autoRecord "0"       // Auto record demos
set cg_recordSPDemo "0"     // Record single player demos

// =============================================================================
// ANTI-CHEAT COMPLIANCE
// =============================================================================

// Pure client settings
set cl_pure "1"             // Pure client
set cg_autoScreenshot "0"   // Disable auto screenshots

// Demo settings (for verification)
set cg_demoLook "1"         // Demo camera controls
set cg_demoDraw "1"         // Demo HUD

// =============================================================================
// PERFORMANCE MONITORING (LIGHT)
// =============================================================================

// Minimal performance monitoring for MP
set com_speeds "0"          // Disable general speeds
set r_speeds "0"            // Disable render speeds
set cg_lagometer "1"        // Enable lagometer

// =============================================================================
// SERVER BROWSER INTEGRATION
// =============================================================================

// Server browser settings
set cl_master "dpmaster.deathmask.net"  // Master server
set cl_motd "1"            // Show MOTD

// Auto-download settings
set cl_allowDownload "1"   // Allow downloads

// =============================================================================
// FINAL CLIENT MESSAGE
// =============================================================================

echo "^2Enhanced Multiplayer Client Configuration Loaded"
echo "^3Optimized for competitive and casual multiplayer gaming"
echo "^5Enhanced features: PBR rendering, advanced HUD, improved controls"
