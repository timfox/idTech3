// Enhanced Dedicated Server Configuration
// Professional server setup for multiplayer gaming

// =============================================================================
// SERVER IDENTIFICATION & BRANDING
// =============================================================================

// Server information
set sv_hostname "Enhanced idTech3 Server"
set g_motd "Welcome to the Enhanced Engine Experience!"
set sv_joinmessage "Enhanced gameplay with modern features"

// Server admin contact
set sv_admin "admin@enhanced-server.com"
set sv_email "support@enhanced-server.com"

// Server location and specs
set sv_location "Global"
set sv_specs "AMD Ryzen 9 5900X, 32GB RAM, RTX 3080"

// =============================================================================
// NETWORK CONFIGURATION
// =============================================================================

// Network settings optimized for modern connections
set net_ip ""                    // Bind to all interfaces
set net_port "27960"            // Standard Quake 3 port
set sv_maxclients "16"          // Maximum players
set sv_privateclients "2"       // Reserved slots
set sv_privatepassword "enhanced2024"

// Rate limiting for DDoS protection
set sv_maxRate "25000"          // Max bytes/second per client
set sv_minRate "0"             // Minimum rate (0 = no minimum)
set sv_maxPing "400"           // Maximum ping allowed
set sv_minPing "0"             // Minimum ping allowed

// Download settings
set sv_allowDownload "1"       // Allow downloading missing files
set sv_wwwDownload "1"         // Enable HTTP downloads
set sv_wwwBaseURL "http://your-server.com/dl/"
set sv_wwwFallbackURL ""

// =============================================================================
// GAMEPLAY CONFIGURATION
// =============================================================================

// Enhanced gameplay settings
set g_gametype "0"             // Free for all
set timelimit "15"            // 15 minute rounds
set fraglimit "25"            // First to 25 frags
set capturelimit "8"          // For CTF modes

// Enhanced weapon balance
set g_weaponrespawn "3"       // 3 second weapon respawn
set g_inactivity "300"        // 5 minute inactivity timeout
set g_forcerespawn "20"       // Force respawn after 20 seconds

// Anti-camp settings
set g_timeouttospec "70"      // Move to spectator after timeout

// =============================================================================
// MOD FEATURES ENHANCEMENT
// =============================================================================

// Enable enhanced features
set r_pbr "1"                 // PBR rendering for all players
set perf_monitor_enable "1"   // Server performance monitoring
set com_memoryStats "1"       // Memory usage tracking

// Lua scripting for enhanced gameplay
set lua_enabled "1"           // Enable Lua scripting
set lua_allow_client "0"      // Server-side only for security

// Enhanced power-up system
set powerup_spawn_rate "1.0"  // Normal spawn rate
set powerup_duration "1.0"    // Normal duration

// =============================================================================
// SECURITY & ANTI-CHEAT
// =============================================================================

// Basic anti-cheat measures
set sv_pure "1"               // Pure server - no modified assets
set sv_cheats "0"             // Disable cheats
set g_password ""             // No global password

// Rate limiting for spam protection
set sv_floodProtect "1"       // Enable flood protection
set sv_maxRatePerSec "1000"   // Max commands per second

// Demo recording
set g_allowVote "1"           // Allow voting
set g_voteFlags "0"           // No vote restrictions
set g_listEntity "0"          // Disable entity listing

// =============================================================================
// LOGGING & MONITORING
// =============================================================================

// Enhanced logging
set logfilename "enhanced_server.log"
set g_logfile "2"             // Sync logging
set g_logfileSync "1"         // Synchronous writes

// Performance monitoring
set com_speeds "1"            // Show server performance
set r_speeds "1"              // Show rendering performance
set sv_showloss "1"           // Show packet loss statistics

// =============================================================================
// CUSTOM SERVER FEATURES
// =============================================================================

// Welcome message with enhanced features
set sv_welcome "^2Welcome to Enhanced idTech3 Server!"
set sv_welcome2 "^3Features: PBR Graphics, Lua Scripting, Advanced Weapons"
set sv_welcome3 "^5Server Specs: High-performance dedicated hardware"

// Automatic server restart
set sv_autorestart "1"        // Auto restart on crash
set sv_autorestart_delay "30" // 30 second delay

// Server statistics
set sv_stats_interval "300"   // Log stats every 5 minutes
set sv_stats_file "server_stats.log"

// =============================================================================
// ADMINISTRATION COMMANDS
// =============================================================================

// RCON settings
set rconpassword "your_secure_rcon_password_here"
set sv_rcon "1"               // Enable RCON

// Admin features
set sv_adminlog "1"           // Log admin actions
set sv_adminnotify "1"        // Notify admins of issues

// Emergency shutdown
set sv_emergency_shutdown "0" // Emergency shutdown flag

// =============================================================================
// MAP ROTATION
// =============================================================================

// Map rotation settings
set g_maprotation "1"         // Enable map rotation
set sv_maplist "q3dm1 q3dm7 q3dm17 q3tourney1"  // Map list
set sv_randommap "1"          // Random map selection

// =============================================================================
// CUSTOM GAME MODES
// =============================================================================

// Enhanced gameplay modes
set g_enhanced_weapons "1"    // Enable enhanced weapon system
set g_powerup_system "1"      // Enable advanced power-ups
set g_environmental_effects "1" // Enable dynamic environments

// Lua-powered custom modes
set g_lua_gamemode "enhanced" // Custom game mode via Lua

// =============================================================================
// PERFORMANCE OPTIMIZATION
// =============================================================================

// Server performance tuning
set sv_fps "40"               // Server tick rate
set sv_timeout "120"          // Connection timeout
set sv_zombietime "2"         // Zombie connection time

// Memory management
set com_hunkMegs "256"        // Memory allocation
set com_zoneMegs "24"         // Zone memory

// Network optimization
set sv_snapshotrate "40"      // Snapshot rate
set sv_packetloss "0"         // Simulated packet loss for testing

// =============================================================================
// BACKUP & MAINTENANCE
// =============================================================================

// Automatic backups
set sv_backup_interval "3600"  // Hourly backups
set sv_backup_dir "backups/"   // Backup directory

// Maintenance mode
set sv_maintenance "0"         // Maintenance mode flag
set sv_maintenance_msg "Server under maintenance - please try again later"

// =============================================================================
// MONITORING & ALERTS
// =============================================================================

// Performance alerts
set sv_cpu_alert "80"          // CPU usage alert threshold
set sv_memory_alert "90"       // Memory usage alert threshold
set sv_ping_alert "200"        // High ping alert

// Connection monitoring
set sv_connection_log "1"      // Log all connections
set sv_disconnect_log "1"      // Log disconnections

// =============================================================================
// FINAL SERVER MESSAGE
// =============================================================================

echo "^2Enhanced idTech3 Dedicated Server Configuration Loaded"
echo "^3Server ready for multiplayer gaming with advanced features!"
echo "^5Connect using: /connect your-server-ip:27960"
