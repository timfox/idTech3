// MyMod Configuration File - Hardened with Safety Gates
// Advanced features are gated behind cvars for stability

// =============================================================================
// RENDERER SAFETY SETTINGS (Conservative defaults for stability)
// =============================================================================

// Basic renderer features (safe defaults)
set r_fbo "1"                    // Framebuffer objects - required for modern rendering
set r_vbo "1"                    // Vertex buffer objects - performance optimization
set r_mergeLightmaps "1"         // Lightmap merging - safe optimization
set r_ext_texture_filter_anisotropic "1"  // Anisotropic filtering - quality improvement

// PBR Rendering (gated for stability - can be disabled if issues arise)
set r_pbr "1"                    // Physically based rendering
set r_pbr_safe "1"               // Enable PBR safety checks and fallbacks

// HDR and advanced rendering (gated for stability)
set r_hdr "0"                    // HDR rendering (disabled by default for compatibility)
set r_cubeMapping "0"            // Environment reflections (disabled by default)
set r_raytracing "0"             // Ray tracing (experimental, disabled by default)

// PBR Material Settings (safe defaults)
set r_baseNormalX "1.0"
set r_baseNormalY "1.0"
set r_baseParallax "0.04"        // Reduced from 0.05 for stability
set r_baseSpecular "0.04"

// Flare effects (can impact performance)
set r_flares "1"                 // Basic flares enabled
set r_flaresEnhanced "0"         // Enhanced flares disabled by default

// =============================================================================
// ADVANCED VISUAL EFFECTS (Performance Impact: Medium-High)
// =============================================================================

// Post-processing effects
set r_postprocess_compute "1"    // Enable compute shader post-processing
set r_bloom "1"                  // Bloom effect for bright areas
set r_bloom_intensity "0.5"      // Bloom intensity (0.0-2.0)
set r_bloom_threshold "0.7"      // Bloom threshold (0.0-1.0)

// Tone mapping (HDR to LDR conversion)
set r_tonemapMode "1"            // Tone mapping mode (0=off, 1=ACES, 2=Reinhard)
set r_tonemapExposure "1.0"      // Exposure adjustment (0.1-10.0)

// Advanced rendering features
set r_ssao "0"                   // Screen space ambient occlusion (expensive)
set r_ssao_intensity "1.0"       // SSAO intensity
set r_ssao_radius "0.5"          // SSAO radius

// Depth of field (focus effects)
set r_dof "0"                    // Depth of field effect
set r_dof_focus "512"            // Focus distance
set r_dof_range "1024"           // Focus range

// Motion blur
set r_motionBlur "0"             // Motion blur effect
set r_motionBlur_intensity "0.5" // Motion blur intensity

// Color grading and correction
set r_colorCorrection "0"        // Color correction LUT
set r_gammaCorrection "1.0"      // Gamma correction (0.5-2.5)
set r_brightness "0.0"           // Brightness adjustment (-1.0 to 1.0)
set r_contrast "1.0"             // Contrast adjustment (0.5-2.0)
set r_saturation "1.0"           // Saturation adjustment (0.0-2.0)

// Vignette effect
set r_vignette "0"               // Vignette effect
set r_vignette_intensity "0.3"   // Vignette intensity
set r_vignette_radius "1.2"      // Vignette radius

// =============================================================================
// UI & FONT ENHANCEMENTS (Performance Impact: Low)
// =============================================================================

// Font rendering quality
set r_fontQuality "2"            // Font quality (0=fast, 1=normal, 2=high)
set r_fontHinting "1"            // Font hinting (0=off, 1=normal, 2=light, 3=full)
set r_fontSubpixel "1"           // Subpixel rendering (0=off, 1=on)

// UI rendering enhancements
set ui_scale "1.0"               // UI scale factor (0.5-2.0)
set ui_animationSpeed "1.0"      // UI animation speed multiplier
set ui_blur "0"                  // UI background blur effect
set ui_blurRadius "2"            // UI blur radius

// Main menu enhancements
set ui_mainMenuGlow "1"          // Main menu glow effects
set ui_mainMenuParticles "0"     // Main menu particle effects
set ui_mainMenuScanlines "0"     // Retro scanline effects

// HUD enhancements
set cg_hudScale "1.0"            // HUD scale factor
set cg_hudBlur "0"               // HUD background blur
set cg_hudGlow "1"               // HUD glow effects

// Crosshair enhancements
set cg_crosshairScale "1.0"      // Crosshair scale
set cg_crosshairGlow "0"         // Crosshair glow effect
set cg_crosshairPulse "0"        // Crosshair pulse animation

// Screen effects
set cg_screenDamage "1"          // Screen damage effects
set cg_screenFlash "1"           // Screen flash effects
set cg_screenBlur "0"            // Screen blur effects (motion/concussion)

// =============================================================================
// VULKAN ADVANCED FEATURES (Conservative gating)
// =============================================================================

// Vulkan-specific features (safe defaults)
set r_meshShaders "0"            // Mesh shaders (experimental, disabled)
set r_dlss "0"                   // DLSS upscaling (NVIDIA only, disabled)
set r_asyncCompile "1"           // Async shader compilation (safe performance boost)
set r_bindless "1"               // Bindless textures (safe performance boost)

// Vulkan safety features
set r_vulkan_validation "0"      // Vulkan validation layers (debug only)
set r_vulkan_debug "0"           // Vulkan debug markers (development only)

// =============================================================================
// MEMORY & PERFORMANCE SAFETY
// =============================================================================

// Memory management (conservative settings)
set com_jobThreads "4"           // Limit job threads for stability (0=auto-detect)
set com_memoryStats "0"          // Memory statistics (disabled by default)
set com_preciseTime "1"          // Precise timing (safe)

// File system safety
set fs_debug "0"                 // File system debugging (disabled)
set fs_pure "1"                  // Pure server mode (security)

// =============================================================================
// VM & MODULE SAFETY
// =============================================================================

// Native module loading (modern C modules)
set vm_game "0"                  // Use native game module
set vm_cgame "0"                 // Use native cgame module
set vm_ui "0"                    // Use native UI module

// VM safety features
set vm_hotReload "1"             // Hot reload for development
set vm_hotReloadInterval "1000"  // Check every 1 second (not too frequent)
set vm_hotReloadVerbose "0"      // Verbose logging disabled

// =============================================================================
// DEBUG & DEVELOPMENT FEATURES (Safely disabled by default)
// =============================================================================

// Debug features (all disabled by default for performance)
set cl_debugMove "0"             // Movement debugging
set cl_debuggraph "0"            // Debug graph
set r_showShaders "0"            // Shader debugging
set r_showMaterials "0"          // Material debugging
set r_showTextures "0"           // Texture debugging
set com_speeds "0"               // Performance counters (disabled by default)

// Development UI (ImGui debug panels)
set cl_imgui_debug_performance "0"
set cl_imgui_debug_memory "0"
set cl_imgui_debug_network "0"
set cl_imgui_debug_renderer "0"
set cl_imgui_debug_cvars "0"
set cl_imgui_debug_console "0"
set cl_imgui_debug_events "0"
set cl_imgui_debug_profiler "0"
set cl_imgui_debug_mainmenu "1"  // Keep main menu debug enabled for development

// =============================================================================
// AUDIO SAFETY
// =============================================================================

// Audio features (conservative settings)
set s_doppler "1"                // Doppler effect (safe)
set s_occlusion "0"              // Sound occlusion (disabled for performance)
set s_reverb "0"                 // Reverb (disabled for performance)
set s_compression "1"            // Audio compression (safe)

// =============================================================================
// NETWORK SAFETY
// =============================================================================

// Network debugging (disabled by default)
set cl_shownet "0"               // Network packet display
set sv_showloss "0"              // Packet loss display
set net_profile "0"              // Network profiling

// =============================================================================
// CONVENIENCE ALIASES
// =============================================================================

// Quick commands for testing advanced features safely
// bind F10 "toggle r_pbr; play sound/misc/menu1.wav"
// bind F11 "toggle r_hdr; play sound/misc/menu1.wav"
// bind F12 "toggle r_cubeMapping; play sound/misc/menu1.wav"

// Load this config automatically when mod is loaded
// To load manually: exec config/mymod.cfg

