// FLUX.2 Image Generation Example Configuration
// Save this as flux_example.cfg in your base directory and run with:
// /exec flux_example.cfg

// Enable FLUX
set cl_flux_enable 1

// Generation mode: 0=synchronous (blocking), 1=asynchronous (background)
set cl_flux_async 0

// External generation: 1=use external flux_cli to avoid crashes (recommended)
set cl_flux_external 1

// Compute device: auto (best), cpu (force CPU), gpu (force GPU), gpu:N (specific GPU)
set cl_flux_device "auto"

// Configure model variant (flux1-schnell = fast, flux1-dev = balanced, flux2-dev = high quality)
set cl_flux_model "flux1-schnell"

// Basic settings for fast generation (2 steps = ~15-30 seconds)
set cl_flux_width 256
set cl_flux_height 256
set cl_flux_steps 2
set cl_flux_seed -1

echo "^2FLUX.2 integration ready!"
echo "^3Commands:"
echo "^7  flux_generate \"your prompt here\"  - Generate image (auto-reloads!)"
echo "^7  flux_view filename.png             - Complete view workflow"
echo "^7  flux_reload filename.png           - Manual texture reload"
echo "^7  flux_show filename.png             - Register as shader only"
echo "^7Example prompts:"

// Some example generations (uncomment to use)
echo "flux_generate \"a majestic mountain landscape at sunset\""
echo "flux_generate \"a futuristic city with flying cars\""
echo "flux_generate \"a fantasy castle in the clouds\""
echo "flux_generate \"a serene lake with reflections\""
echo "flux_generate \"a steampunk airship over Victorian London\""

// High quality settings (slower)
// set cl_flux_width 512
// set cl_flux_height 512
// set cl_flux_steps 8

// Reproducible generation (same seed = same result)
// set cl_flux_seed 12345

// Disable FLUX
// set cl_flux_enable 0