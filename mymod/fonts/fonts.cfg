// Font Configuration File for mymod
// This file configures fonts used in menus and HUD

// Main menu font (used for most UI elements)
font "fonts/roboto-regular.ttf" 16

// Small font (used for lists, small text)
smallFont "fonts/roboto-regular.ttf" 12

// Big font (used for titles, headers)
bigFont "fonts/roboto-bold.ttf" 24

// Font fallback chain (used when primary font doesn't have a character)
// Format: primaryFont pointSize fallback1 fallback2 fallback3
// Example:
// fontFallback "fonts/roboto-regular.ttf" 16 "fonts/noto-sans.ttf" "fonts/dejavu-sans.ttf"

// CJK-capable fallback to improve non-Latin coverage
fontFallback "fonts/roboto-regular.ttf" 16 "fonts/noto/NotoSansCJK-Regular.ttc"

// Note: To use these fonts, you need to:
// 1. Place the font files in the fonts/ directory
// 2. Ensure FreeType support is enabled in the engine
// 3. The fonts will be automatically loaded when menus are initialized

// If font files are not found, the engine will fall back to bitmap fonts
// (menu/art/font1_prop.tga, font2_prop.tga)

