// MyMod Configuration File
// PBR Renderer Settings
// These settings enable Physically Based Rendering features

// Enable PBR rendering (requires r_fbo 1)
set r_pbr "1"

// Enable framebuffer objects (REQUIRED for PBR)
set r_fbo "1"

// Enable vertex buffer objects (recommended for static geometry)
set r_vbo "1"

// Enable cube mapping for environment reflections
set r_cubeMapping "1"

// Enable HDR rendering for better color accuracy
set r_hdr "1"

// PBR Material Settings
set r_baseNormalX "1.0"
set r_baseNormalY "1.0"
set r_baseParallax "0.05"
set r_baseSpecular "0.04"

// Additional Visual Enhancements
set r_mergeLightmaps "1"
set r_flares "1"
set r_ext_texture_filter_anisotropic "1"

// Native Module Loading (use modern C instead of QVM)
// Set to 0 for native libraries, 1 for bytecode, 2 for compiled QVM
set vm_game "0"
set vm_cgame "0"
set vm_ui "0"

// Load this config automatically when mod is loaded
// To load manually: exec config/mymod.cfg

