apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.idtech3"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}

signingConfigs {
    release {
        def keystorePath = null
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            keystorePath = project.property("RELEASE_STORE_FILE")
        } else if (System.getenv("RELEASE_STORE_FILE") != null) {
            keystorePath = System.getenv("RELEASE_STORE_FILE")
        }
        if (keystorePath != null) {
            storeFile file(keystorePath)
            def storePassword = null
            if (project.hasProperty("RELEASE_STORE_PASSWORD")) {
                storePassword = project.property("RELEASE_STORE_PASSWORD")
            } else if (System.getenv("RELEASE_STORE_PASSWORD") != null) {
                storePassword = System.getenv("RELEASE_STORE_PASSWORD")
            }
            def keyAlias = null
            if (project.hasProperty("RELEASE_KEY_ALIAS")) {
                keyAlias = project.property("RELEASE_KEY_ALIAS")
            } else if (System.getenv("RELEASE_KEY_ALIAS") != null) {
                keyAlias = System.getenv("RELEASE_KEY_ALIAS")
            }
            def keyPassword = null
            if (project.hasProperty("RELEASE_KEY_PASSWORD")) {
                keyPassword = project.property("RELEASE_KEY_PASSWORD")
            } else if (System.getenv("RELEASE_KEY_PASSWORD") != null) {
                keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
            }
            if (storePassword != null) {
                storePassword storePassword
            }
            if (keyAlias != null) {
                keyAlias keyAlias
            }
            if (keyPassword != null) {
                keyPassword keyPassword
            }
        } else {
            throw new GradleException("Release keystore not configured. Set RELEASE_STORE_FILE or RELEASE_STORE_FILE env var.")
        }
    }
}

buildTypes {
    release {
        signingConfig signingConfigs.release
        minifyEnabled false
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
}
