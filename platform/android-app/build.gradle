buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // CRITICAL: Android Gradle Plugin 3.6.4 is deprecated and unmaintained
        // TODO: Upgrade to AGP 8.x when Java 17+ is available in build environment
        // Current constraint: Build environment only has Java 8, AGP 8.x requires Java 11+
        // This violates project constitution modern compiler requirements
        classpath "com.android.tools.build:gradle:3.6.4"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.idtech3"
        minSdkVersion 24  // Android 7.0 - required for Vulkan support
        targetSdkVersion 33
        versionCode 1
        versionName "0.1"
        // Use explicit NDK version to avoid ANDROID_NDK_HOME deprecation warning
        ndkVersion "21.4.7075529"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -std=c++17"
                arguments "-DANDROID=ON",
                          "-DUSE_VULKAN=ON",
                          "-DUSE_RENDERER_DLOPEN=ON",
                          "-DRENDERER_DEFAULT=vulkan",
                          "-DUSE_ANDROID=ON"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            // Use the main project CMakeLists.txt which builds the full engine
            // Path is relative to the android-app directory (go up 3 levels to project root)
            // Use file() to ensure proper path resolution
            path file("../../CMakeLists.txt")
        }
    }
    
    // Source sets for assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            // Optionally include baseq3 if it exists
            if (file("../../../baseq3").exists()) {
                assets.srcDirs += '../../../baseq3'
            }
            // Native libraries are automatically packaged by Gradle from CMake build outputs
            // No need to specify jniLibs.srcDirs - Gradle handles this automatically
        }
    }
    
    // Ensure native libraries are packaged correctly (AGP 3.x syntax)
    packagingOptions {
        doNotStrip "*/armeabi-v7a/*.so"
        doNotStrip "*/arm64-v8a/*.so"
        doNotStrip "*/x86/*.so"
        doNotStrip "*/x86_64/*.so"
    }
    
    signingConfigs {
        release {
            def keystorePath = null
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                keystorePath = project.property("RELEASE_STORE_FILE")
            } else if (System.getenv("RELEASE_STORE_FILE") != null) {
                keystorePath = System.getenv("RELEASE_STORE_FILE")
            }
            if (keystorePath != null) {
                storeFile file(keystorePath)
                def storePassword = null
                if (project.hasProperty("RELEASE_STORE_PASSWORD")) {
                    storePassword = project.property("RELEASE_STORE_PASSWORD")
                } else if (System.getenv("RELEASE_STORE_PASSWORD") != null) {
                    storePassword = System.getenv("RELEASE_STORE_PASSWORD")
                }
                def keyAlias = null
                if (project.hasProperty("RELEASE_KEY_ALIAS")) {
                    keyAlias = project.property("RELEASE_KEY_ALIAS")
                } else if (System.getenv("RELEASE_KEY_ALIAS") != null) {
                    keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                }
                def keyPassword = null
                if (project.hasProperty("RELEASE_KEY_PASSWORD")) {
                    keyPassword = project.property("RELEASE_KEY_PASSWORD")
                } else if (System.getenv("RELEASE_KEY_PASSWORD") != null) {
                    keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
                }
                if (storePassword != null) {
                    storePassword storePassword
                }
                if (keyAlias != null) {
                    keyAlias keyAlias
                }
                if (keyPassword != null) {
                    keyPassword keyPassword
                }
            }
            // Don't throw error if keystore not configured - allow debug builds
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "com.google.android.material:material:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.1"
}

// Gradle automatically packages native libraries from CMake build outputs
// Libraries built by externalNativeBuild are automatically included in the APK
// No manual copying needed - Gradle handles this via the build system
