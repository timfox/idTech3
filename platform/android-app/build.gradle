buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Modern Android Gradle Plugin 8.x - latest stable version
        // Requires Java 17+ and Gradle 8.4+
        // Compliant with project constitution modern compiler requirements
        classpath "com.android.tools.build:gradle:8.6.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.idtech3"
        minSdkVersion 24  // Android 7.0 - required for Vulkan support
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        // Use latest stable NDK version compatible with AGP 8.x
        ndkVersion "27.0.12077973"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -std=c++17"
                arguments "-DANDROID=ON",
                          "-DUSE_VULKAN=ON",
                          "-DUSE_RENDERER_DLOPEN=ON",
                          "-DRENDERER_DEFAULT=vulkan",
                          "-DUSE_ANDROID=ON"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            // Use the main project CMakeLists.txt which builds the full engine
            // Path is relative to the android-app directory (go up 3 levels to project root)
            // Use file() to ensure proper path resolution
            path file("../../CMakeLists.txt")
        }
    }
    
    // Source sets for assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            // Optionally include baseq3 if it exists
            if (file("../../../baseq3").exists()) {
                assets.srcDirs += '../../../baseq3'
            }
            // Native libraries are automatically packaged by Gradle from CMake build outputs
            // No need to specify jniLibs.srcDirs - Gradle handles this automatically
        }
    }
    
    // Ensure native libraries are packaged correctly (AGP 8.x syntax)
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    
    signingConfigs {
        release {
            def keystorePath = null
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                keystorePath = project.property("RELEASE_STORE_FILE")
            } else if (System.getenv("RELEASE_STORE_FILE") != null) {
                keystorePath = System.getenv("RELEASE_STORE_FILE")
            }
            if (keystorePath != null) {
                storeFile file(keystorePath)
                def storePassword = null
                if (project.hasProperty("RELEASE_STORE_PASSWORD")) {
                    storePassword = project.property("RELEASE_STORE_PASSWORD")
                } else if (System.getenv("RELEASE_STORE_PASSWORD") != null) {
                    storePassword = System.getenv("RELEASE_STORE_PASSWORD")
                }
                def keyAlias = null
                if (project.hasProperty("RELEASE_KEY_ALIAS")) {
                    keyAlias = project.property("RELEASE_KEY_ALIAS")
                } else if (System.getenv("RELEASE_KEY_ALIAS") != null) {
                    keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                }
                def keyPassword = null
                if (project.hasProperty("RELEASE_KEY_PASSWORD")) {
                    keyPassword = project.property("RELEASE_KEY_PASSWORD")
                } else if (System.getenv("RELEASE_KEY_PASSWORD") != null) {
                    keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
                }
                if (storePassword != null) {
                    storePassword storePassword
                }
                if (keyAlias != null) {
                    keyAlias keyAlias
                }
                if (keyPassword != null) {
                    keyPassword keyPassword
                }
            }
            // Don't throw error if keystore not configured - allow debug builds
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "com.google.android.material:material:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.1"
}

// Gradle automatically packages native libraries from CMake build outputs
// Libraries built by externalNativeBuild are automatically included in the APK
// No manual copying needed - Gradle handles this via the build system
