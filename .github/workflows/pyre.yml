name: Pyre

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pyre:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Detect Pyre config
        id: detect
        shell: bash
        run: |
          if [[ -f .pyre_configuration || -f .pyre_configuration.local ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pyre
        if: steps.detect.outputs.configured == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyre-check
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Pyre
        if: steps.detect.outputs.configured == 'true'
        shell: bash
        run: pyre check

      - name: Skip when Pyre is not configured
        if: steps.detect.outputs.configured != 'true'
        shell: bash
        run: |
          echo "No .pyre_configuration found at repository root."
          echo "Skipping Pyre until the repo adds an explicit Pyre configuration."
