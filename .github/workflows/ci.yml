name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-engine-linux:
    name: Build Engine (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        renderer: [opengl, vulkan]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev
      
      - name: Set up ${{ matrix.compiler }}
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=${{ matrix.renderer == 'vulkan' && 'ON' || 'OFF' }} \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_SERVER=ON
      
      - name: Build
        run: |
          cd build
          make -j$(nproc)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-${{ matrix.compiler }}-${{ matrix.renderer }}
          path: |
            build/idtech3.x86_64
            build/idtech3.server.x86_64
            build/idtech3_*.so
            build/libimgui_shared.so

  build-engine-windows:
    name: Build Engine (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        renderer: [opengl, vulkan]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      
      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=${{ matrix.renderer == 'vulkan' && 'ON' || 'OFF' }} \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_SERVER=ON
      
      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build . --config Release -j
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-${{ matrix.renderer }}
          path: |
            build/Release/idtech3.x64.exe
            build/Release/idtech3.server.x64.exe
            build/Release/idtech3_*.dll
            build/Release/libimgui_shared.dll

  build-engine-macos:
    name: Build Engine (macOS)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install cmake sdl2 curl openssl jpeg vorbis ogg freetype sqlite lua@5.4 libwebsockets zstd openal theora libvpx dav1d openexr assimp bullet
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_SERVER=ON
      
      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-macos-${{ matrix.arch }}
          path: |
            build/idtech3.*
            build/idtech3.server.*
            build/idtech3_*.dylib
            build/libimgui_shared.dylib

  build-game-modes:
    name: Build Game Modes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: [mymod, blacksun]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev
      
      - name: Build engine (required for game mode headers)
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON
          make -j$(nproc) || true  # May fail, but we just need headers
      
      - name: Build ${{ matrix.mod }} game modules
        run: |
          cd ${{ matrix.mod }}/gamesrc
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)
      
      - name: Check for compiled modules
        run: |
          if [ -d "${{ matrix.mod }}/vm" ]; then
            echo "Found compiled modules:"
            ls -lh ${{ matrix.mod }}/vm/*.so 2>/dev/null || echo "No .so files found"
          else
            echo "Warning: vm directory not found"
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-modules
          path: |
            ${{ matrix.mod }}/vm/*.so
            ${{ matrix.mod }}/vm/*.dll

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck
      
      - name: Run clang-tidy
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC_ANALYSIS=ON
          # Run clang-tidy on a subset of files
          find ../src -name "*.c" -type f | head -20 | xargs clang-tidy -p build || true
      
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --suppress=unusedFunction src/ 2>&1 | tee cppcheck.log || true

  test-build:
    name: Test Build
    runs-on: ubuntu-latest
    needs: [build-engine-linux, build-game-modes]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: engine-linux-*
          merge-multiple: true
      
      - name: Download game mode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: *-modules
          merge-multiple: true
      
      - name: Verify binaries
        run: |
          find . -name "idtech3.x86_64" -type f -executable
          find . -name "*.so" -type f | head -10
