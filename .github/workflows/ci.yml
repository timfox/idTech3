name: CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly safety net
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  CMAKE_COMMON_FLAGS: -DUSE_VULKAN=ON -DUSE_RENDERER_DLOPEN=ON -DBUILD_SERVER=ON

jobs:
  validate-assets:
    name: Validate Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python3 --version
      - name: Validate assets (if mods exist)
        run: |
          if [ -d "mymod" ]; then
            python3 tools/validate_assets.py mymod --check-manifest --json || true
          else
            echo "No mod directory found, skipping asset validation"
          fi
        continue-on-error: true

  configure:
    name: Configure (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev
      - name: Verify SDL2 via pkg-config
        run: |
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          pkg-config --modversion sdl2
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
      - name: Generate build files
        run: |
          cmake -S . -B build-config \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            ${{ env.CMAKE_COMMON_FLAGS }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

  build:
    name: Build ${{ matrix.name }}
    needs: configure
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            runner: ubuntu-24.04
            os: linux
            compiler: gcc
          - name: linux-clang
            runner: ubuntu-24.04
            os: linux
            compiler: clang
          - name: windows-msvc
            runner: windows-2022
            os: windows
            arch: x64
          - name: macos-universal
            runner: macos-13
            os: macos
            arch: "x86_64;arm64"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake python3 \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang lld
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install cmake sdl2 curl openssl jpeg libvorbis libogg freetype sqlite lua@5.4 libwebsockets zstd openal theora libvpx dav1d openexr assimp bullet

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Use vcpkg to provide SDL2 (CMake config package)
          $ErrorActionPreference = "Stop"
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install sdl2:x64-windows
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (CMake)
        shell: bash
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.os }}" = "windows" ]; then
            cmake .. \
              -G "Visual Studio 17 2022" \
              -A ${{ matrix.arch }} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              ${{ env.CMAKE_COMMON_FLAGS }}
          elif [ "${{ matrix.os }}" = "macos" ]; then
            cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
              ${{ env.CMAKE_COMMON_FLAGS }}
          else
            cmake .. \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              ${{ env.CMAKE_COMMON_FLAGS }}
          fi

      - name: Build
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.os }}" = "windows" ]; then
            cmake --build . --config ${{ env.BUILD_TYPE }} -j
          elif [ "${{ matrix.os }}" = "macos" ]; then
            cmake --build . -- -j$(sysctl -n hw.ncpu)
          else
            cmake --build . -- -j$(nproc)
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: |
            build/idtech3.*
            build/idtech3.server.*
            build/idtech3_*.so
            build/idtech3_*.dylib
            build/idtech3_*.dll
            build/libimgui_shared.*
          if-no-files-found: warn
          retention-days: 7

  game-modules:
    name: Build game modules (Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Build engine headers
        run: |
          cmake -S . -B build-mods \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON
          cmake --build build-mods --target qcommon -- -j$(nproc) || true

      - name: Build game modules
        run: |
          for mod in mymod blacksun; do
            if [ -d "$mod/gamesrc" ]; then
              cmake -S "$mod/gamesrc" -B "$mod/gamesrc/build"
              cmake --build "$mod/gamesrc/build" -- -j$(nproc)
            else
              echo "Skipping $mod (no gamesrc directory)"
            fi
          done

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules-linux
          path: |
            mymod/vm/*.so
            blacksun/vm/*.so
          if-no-files-found: warn
          retention-days: 7

  fuzz:
    name: Fuzz Testing (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 cmake pkg-config python3 \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev
          echo "CC=clang-18" >> $GITHUB_ENV
          echo "CXX=clang++-18" >> $GITHUB_ENV

      - name: Check libFuzzer availability
        run: |
          echo "Checking libFuzzer availability..."
          clang-18 -fsanitize=fuzzer -c -o /dev/null - <<< "int main() { return 0; }" 2>/dev/null && echo "libFuzzer available" || echo "libFuzzer not available"
          # Install libFuzzer if not available
          if ! clang-18 -fsanitize=fuzzer -c -o /dev/null - <<< "int main() { return 0; }" 2>/dev/null; then
            echo "Attempting to install libFuzzer..."
            sudo apt-get install -y libc++-18-dev || echo "libFuzzer installation failed, fuzzing will be skipped"
          fi

      - name: Build with fuzzing enabled
        run: |
          mkdir -p build-fuzz
          cd build-fuzz
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_TESTS=ON
          # Try to build fuzz target, skip if libFuzzer not available
          make -j$(nproc) fuzz_network || echo "Fuzz target build failed, likely due to missing libFuzzer"

      - name: Run fuzzing tests
        run: |
          cd build-fuzz
          if [ -f "fuzz_network" ]; then
            echo "Running fuzzing tests..."
            # Run fuzzing for a short time (10 seconds per target)
            timeout 10s ./fuzz_network -max_total_time=10 || true
            # Check for crashes
            if [ -d crash-* ] || [ -d leak-* ]; then
              echo "Fuzzing found issues!"
              find . -name "crash-*" -o -name "leak-*" | head -5
              exit 1
            else
              echo "Fuzzing completed without issues"
            fi
          else
            echo "Fuzz target not built, skipping fuzzing tests"
          fi

  smoke:
    name: Smoke test (Linux)
    needs: [build, game-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux engine artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: engine-linux-*
          merge-multiple: true
          path: artifacts

      - name: Run unit tests
        run: |
          cd build
          # Run available unit tests
          if [ -f "test_qmath" ]; then ./test_qmath; fi
          if [ -f "test_network_enet" ]; then ./test_network_enet; fi
          if [ -f "test_geometry" ]; then ./test_geometry; fi
          if [ -f "test_security" ]; then ./test_security; fi

      - name: Run performance benchmarks
        id: perf_check
        run: |
          cd build
          mkdir -p perf_results

          # Run our performance benchmark if available
          if [ -f "benchmark_performance" ]; then
            echo "Running performance benchmarks..."
            ./benchmark_performance > perf_results/current.txt 2>&1 || true

            # Extract key metrics for regression checking
            BUILD_TIME=$(grep "Build time" perf_results/current.txt | awk '{print $3}' || echo "0")

            echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

            # Basic regression check (very simple - could be enhanced)
            if [ "$BUILD_TIME" -gt 1000 ] 2>/dev/null; then
              echo "Performance regression detected: build time ${BUILD_TIME}ms > 1000ms threshold"
              exit 1
            fi
          fi

      - name: Run smoke tests
        env:
          ENGINE_BIN: artifacts/build/idtech3.x86_64
        run: |
          set -euo pipefail
          if [ ! -x "${ENGINE_BIN}" ]; then
            ALT_BIN=$(find artifacts -name "idtech3.x86_64" -type f | head -n1 || true)
            if [ -n "${ALT_BIN}" ]; then
              ENGINE_BIN="${ALT_BIN}"
              chmod +x "${ENGINE_BIN}"
            fi
          fi
          if [ ! -x "${ENGINE_BIN}" ]; then
            echo "Engine binary not found for smoke test"
            exit 1
          fi
          ENGINE_BIN="${ENGINE_BIN}" MOD_LIST="mymod blacksun" tools/ci_smoke.sh
