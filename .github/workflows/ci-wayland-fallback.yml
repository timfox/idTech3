name: CI - Vulkan Wayland fallback

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wayland-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xvfb libx11-dev
      - name: Build Vulkan
        run: bash tools/compile_engine.sh vulkan Release
      - name: Run Wayland fallback test
        run: bash scripts/ci_wayland_fallback.sh
        env:
          WAYLAND_DISPLAY: wayland-1
      - name: Upload VK metrics artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: vk-metrics
          path: vk_metrics.txt

