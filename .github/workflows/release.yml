name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-release:
    name: Build Release ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            suffix: x86_64
          - os: windows-latest
            arch: x64
            suffix: x64
          - os: macos-latest
            arch: universal
            suffix: macos
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake sdl2 curl openssl jpeg vorbis ogg freetype sqlite lua@5.4 libwebsockets zstd openal theora libvpx dav1d openexr assimp bullet
      
      - name: Build engine
        run: |
          mkdir -p build
          cd build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake .. \
              -G "Visual Studio 17 2022" \
              -A ${{ matrix.arch }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_VULKAN=ON \
              -DUSE_RENDERER_DLOPEN=ON \
              -DBUILD_SERVER=ON
            cmake --build . --config Release -j
          elif [ "${{ runner.os }}" == "macOS" ]; then
            if [ "${{ matrix.arch }}" == "universal" ]; then
              ARCH_FLAGS="-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
            else
              ARCH_FLAGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"
            fi
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              $ARCH_FLAGS \
              -DUSE_VULKAN=ON \
              -DUSE_RENDERER_DLOPEN=ON \
              -DBUILD_SERVER=ON
            make -j$(sysctl -n hw.ncpu)
          else
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_VULKAN=ON \
              -DUSE_RENDERER_DLOPEN=ON \
              -DBUILD_SERVER=ON
            make -j$(nproc)
          fi
      
      - name: Build game modes
        run: |
          for mod in mymod blacksun; do
            if [ -d "$mod/gamesrc" ]; then
              echo "Building $mod..."
              cd $mod/gamesrc
              mkdir -p build
              cd build
              if [ "${{ runner.os }}" == "Windows" ]; then
                cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.arch }}
                cmake --build . --config Release
              else
                cmake ..
                make -j$(nproc)
              fi
              cd ../../..
            fi
          done
      
      - name: Package release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PLATFORM="${{ matrix.suffix }}"
          
          mkdir -p release/idtech3-$VERSION-$PLATFORM
          
          # Copy engine binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp build/Release/idtech3.x64.exe release/idtech3-$VERSION-$PLATFORM/
            cp build/Release/idtech3.server.x64.exe release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/Release/idtech3_*.dll release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/Release/libimgui_shared.dll release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp build/idtech3.* release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/idtech3.server.* release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/idtech3_*.dylib release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/libimgui_shared.dylib release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
          else
            cp build/idtech3.x86_64 release/idtech3-$VERSION-$PLATFORM/
            cp build/idtech3.server.x86_64 release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/idtech3_*.so release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
            cp build/libimgui_shared.so release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
          fi
          
          # Copy game modes
          for mod in mymod blacksun; do
            if [ -d "$mod" ]; then
              mkdir -p release/idtech3-$VERSION-$PLATFORM/$mod
              # Copy mod assets (excluding source and build artifacts)
              rsync -a --exclude='gamesrc' --exclude='build' --exclude='*.o' \
                $mod/ release/idtech3-$VERSION-$PLATFORM/$mod/ || cp -r $mod/* release/idtech3-$VERSION-$PLATFORM/$mod/ 2>/dev/null || true
              
              # Copy compiled modules
              if [ -d "$mod/vm" ]; then
                mkdir -p release/idtech3-$VERSION-$PLATFORM/$mod/vm
                cp $mod/vm/*.so $mod/vm/*.dll release/idtech3-$VERSION-$PLATFORM/$mod/vm/ 2>/dev/null || true
              fi
            fi
          done
          
          # Copy documentation
          cp README.md LICENSE.md release/idtech3-$VERSION-$PLATFORM/ 2>/dev/null || true
          
          # Create archive
          cd release
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Use PowerShell on Windows
            Compress-Archive -Path "idtech3-$VERSION-$PLATFORM" -DestinationPath "idtech3-$VERSION-$PLATFORM.zip"
          else
            tar czf idtech3-$VERSION-$PLATFORM.tar.gz idtech3-$VERSION-$PLATFORM
          fi
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: release/idtech3-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.*
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Release v${{ steps.version.outputs.VERSION }}
            
            ### Downloads
            - Linux x86_64: `idtech3-${{ steps.version.outputs.VERSION }}-x86_64.tar.gz`
            - Windows x64: `idtech3-${{ steps.version.outputs.VERSION }}-x64.zip`
            - macOS: `idtech3-${{ steps.version.outputs.VERSION }}-macos.tar.gz`
            
            ### Included Game Modes
            - mymod
            - blacksun
            
            ### Build Information
            - Built with CMake
            - Vulkan renderer enabled
            - Includes OpenGL fallback renderer
          files: |
            artifacts/release-*/*
          draft: false
          prerelease: false