name: build

# CI matrix: Windows (MSYS/MSVC), Ubuntu (x86_64/ARM), macOS, Android

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE*'
      - '**/.gitignore'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE*'
      - '**/.gitignore'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows-msys:
    name: ${{ matrix.btype }} Windows-${{ matrix.cc }} ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # removed 32-bit x86
        arch: [x86_64]
        cc: [gcc]
        btype: [Release, Debug]
        include:
          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          install: >-
            base-devel
            coreutils
            file
            git
            ${{ matrix.prefix }}-binutils
            ${{ matrix.prefix }}-make
            ${{ matrix.prefix }}-${{ matrix.cc }}
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
          msystem: ${{ matrix.msystem }}
          path-type: minimal
          release: false
          update: true
          cache: true

      - name: Install MSYS2 deps (retry on slow mirrors)
        shell: msys2 {0}
        run: |
          set -e
          pkgs="${{ matrix.prefix }}-SDL2 ${{ matrix.prefix }}-openal ${{ matrix.prefix }}-freetype ${{ matrix.prefix }}-lua ${{ matrix.prefix }}-openssl ${{ matrix.prefix }}-curl ${{ matrix.prefix }}-bullet ${{ matrix.prefix }}-glslang"
          for attempt in 1 2 3 4 5; do
            # Refresh db + avoid spurious timeouts on congested mirrors (curl stack under pacman).
            pacman -Sy --noconfirm || true
            pacman -S --needed --noconfirm --disable-download-timeout $pkgs && exit 0
            echo "pacman attempt $attempt failed, retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          exit 1

      - uses: actions/checkout@v4

      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(nproc)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true
          bash ./scripts/stage_mingw_runtime_dlls.sh bin

      - name: Bundle OpenAL Soft DLLs (Win64; no separate OpenAL install)
        if: ${{ matrix.arch == 'x86_64' && (github.event_name != 'release' || matrix.btype != 'Debug') }}
        shell: pwsh
        run: ./scripts/stage_openal_windows_dlls.ps1 -BinDir bin -Arch x64

      - name: Verify PE architecture (native compat)
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        shell: pwsh
        run: ./scripts/windows_native_compat_check.ps1 -BinDir bin

      - name: Verify PE exports (optional game DLLs; CMake disables dlopen renderer on Windows)
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        shell: pwsh
        run: ./scripts/windows_pe_exports_check.ps1 -BinDir bin -SkipRendererDlls

      - name: Smoke test
        if: ${{ github.event_name != 'release' && matrix.btype != 'Debug' }}
        run: |
          mkdir -p release
          cp -f bin/idtech3* release/ || true
          chmod +x scripts/stage_ci_release.sh scripts/smoke_test.sh scripts/q3_openarena_compat_check.sh
          cp -f bin/*.dll release/ 2>/dev/null || true
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh release

      - name: Renderer regression check (Tier A)
        if: ${{ github.event_name != 'release' && matrix.btype != 'Debug' && matrix.cc == 'gcc' }}
        run: |
          chmod +x scripts/renderer_regression_check.sh
          ./scripts/renderer_regression_check.sh

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: windows-${{ matrix.cc }}-${{ matrix.arch }}
          path: bin
          if-no-files-found: warn
          retention-days: 5

  windows-msvc:
    name: ${{ matrix.btype }} Windows-MSVC ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # vcxproj TargetName differs Debug vs Release; never pass /p:TargetName on msbuild (breaks zlib via ProjectReference).
          - arch: arm64
            platform: ARM64
            suffix: .arm64
            pkg_suffix: arm64
            btype: Release
            msvc_out_ded: idtech3_server.exe
            msvc_out_cli: idtech3.exe
          - arch: arm64
            platform: ARM64
            suffix: .arm64
            pkg_suffix: arm64
            btype: Debug
            msvc_out_ded: idtech3_server-debug.exe
            msvc_out_cli: idtech3-debug.exe
          - arch: x64
            platform: x64
            suffix: .x64
            pkg_suffix: x86_64
            btype: Release
            msvc_out_ded: idtech3_server.exe
            msvc_out_cli: idtech3.exe
          - arch: x64
            platform: x64
            suffix: .x64
            pkg_suffix: x86_64
            btype: Debug
            msvc_out_ded: idtech3_server-debug.exe
            msvc_out_cli: idtech3-debug.exe

    steps:
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4

      - name: Init required submodules
        shell: bash
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Install OpenSSL (Win64) for DTLS
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            choco install openssl -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "choco attempt $i failed (exit $LASTEXITCODE), retrying in $($i * 20)s..."
            Start-Sleep -Seconds ($i * 20)
          }
          if (-not $ok) { throw "choco install openssl failed after retries" }
          # GITHUB_ENV must not be written with unquoted paths containing spaces (cmd "echo a=b>>file" breaks at the first space).
          $roots = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL'
          )
          $found = $null
          foreach ($r in $roots) {
            $evp = Join-Path $r 'include\openssl\evp.h'
            if (Test-Path -LiteralPath $evp) {
              $found = $r
              break
            }
          }
          if (-not $found) {
            $dirs = Get-ChildItem -Path 'C:\Program Files' -Directory -Filter 'OpenSSL*' -ErrorAction SilentlyContinue
            foreach ($d in $dirs) {
              $evp = Join-Path $d.FullName 'include\openssl\evp.h'
              if (Test-Path -LiteralPath $evp) { $found = $d.FullName; break }
            }
          }
          if (-not $found) {
            throw "OpenSSL install did not expose include/openssl/evp.h under Program Files (DTLS MSVC build needs headers)."
          }
          Write-Host "OPENSSL_ROOT_DIR=$found"
          "OPENSSL_ROOT_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Layout forwarding symlinks
        shell: bash
        run: ./scripts/layout_forwarding_symlinks.sh

      - name: Build
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        shell: cmd
        run: |
          if not exist bin mkdir bin

          if "%OPENSSL_ROOT_DIR%"=="" (
            echo ERROR: OPENSSL_ROOT_DIR is not set - OpenSSL install/discovery step failed.
            exit /b 1
          )
          if not exist "%OPENSSL_ROOT_DIR%\include\openssl\evp.h" (
            echo ERROR: OpenSSL headers not found at "%OPENSSL_ROOT_DIR%\include\openssl\evp.h"
            exit /b 1
          )

          set MSVC_ROOT=engine\platform\win32\msvc2017
          set MSBUILD_COMMON=/m ^
            /p:Configuration=${{ matrix.btype }} ^
            /p:Platform=${{ matrix.platform }} ^
            /p:PlatformToolset=v143 ^
            /p:TreatWarningsAsErrors=false

          rem --- Dedicated server (TargetName is idtech3_server in vcxproj; do not pass /p:TargetName - it poisons ProjectReference builds like zlib) ---
          msbuild %MSVC_ROOT%\quake3e-ded.vcxproj ^
            %MSBUILD_COMMON%
          if errorlevel 1 exit /b 1
          if not exist %MSVC_ROOT%\output\${{ matrix.msvc_out_ded }} (
            echo ERROR: missing output\${{ matrix.msvc_out_ded }} after ded build
            dir /b %MSVC_ROOT%\output 2>nul
            exit /b 1
          )
          copy /Y %MSVC_ROOT%\output\${{ matrix.msvc_out_ded }} bin\idtech3_server${{ matrix.suffix }}.exe
          if errorlevel 1 exit /b 1
          msbuild %MSVC_ROOT%\quake3e-ded.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean

          rem --- Vulkan renderer + client (shipping backend; OpenGL/opengl.vcxproj removed) ---
          msbuild %MSVC_ROOT%\vulkan.vcxproj ^
            %MSBUILD_COMMON%
          if errorlevel 1 exit /b 1
          msbuild %MSVC_ROOT%\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /p:UseWasapi=0
          if errorlevel 1 exit /b 1
          if not exist %MSVC_ROOT%\output\${{ matrix.msvc_out_cli }} (
            echo ERROR: missing output\${{ matrix.msvc_out_cli }} after Vulkan client build
            dir /b %MSVC_ROOT%\output 2>nul
            exit /b 1
          )
          copy /Y %MSVC_ROOT%\output\${{ matrix.msvc_out_cli }} bin\idtech3${{ matrix.suffix }}.exe
          if errorlevel 1 exit /b 1
          copy /Y %MSVC_ROOT%\output\${{ matrix.msvc_out_cli }} bin\idtech3-vulkan${{ matrix.suffix }}.exe
          if errorlevel 1 exit /b 1
          msbuild %MSVC_ROOT%\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean ^
            /p:UseWasapi=0
          msbuild %MSVC_ROOT%\vulkan.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean

          dir /b bin

      - name: Bundle OpenAL Soft DLLs (MSVC x64 only; MinGW job bundles separately)
        if: ${{ (github.event_name != 'release' || matrix.btype != 'Debug') && matrix.arch == 'x64' }}
        shell: pwsh
        run: ./scripts/stage_openal_windows_dlls.ps1 -BinDir bin -Arch x64

      - name: Verify MSVC staging (Release artifact prep)
        if: ${{ matrix.btype == 'Release' }}
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $bin = Join-Path $root 'bin'
          $out = Join-Path $root 'engine/platform/win32/msvc2017/output'
          $sfx = '${{ matrix.suffix }}'

          Write-Host "PWD: $(Get-Location)"
          Write-Host "`n--- bin ---"
          if (Test-Path -LiteralPath $bin) { Get-ChildItem -LiteralPath $bin -File | ForEach-Object { $_.Name } } else { Write-Host '(missing)' }
          Write-Host "`n--- msvc2017/output ---"
          if (Test-Path -LiteralPath $out) {
            Get-ChildItem -LiteralPath $out -File -Filter '*.exe' -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          } else { Write-Host '(missing)' }

          $need = @(
            "idtech3_server$sfx.exe",
            "idtech3$sfx.exe",
            "idtech3-vulkan$sfx.exe"
          )
          $missing = @()
          foreach ($n in $need) {
            $p = Join-Path $bin $n
            if (-not (Test-Path -LiteralPath $p)) { $missing += $n }
          }

          if ($missing.Count -gt 0) {
            Write-Host "`nAttempting fallback copy from output\ ..."
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            $ded = Join-Path $out '${{ matrix.msvc_out_ded }}'
            $cli = Join-Path $out '${{ matrix.msvc_out_cli }}'
            if (Test-Path -LiteralPath $ded) {
              Copy-Item -LiteralPath $ded -Destination (Join-Path $bin "idtech3_server$sfx.exe") -Force
            }
            if (Test-Path -LiteralPath $cli) {
              Copy-Item -LiteralPath $cli -Destination (Join-Path $bin "idtech3$sfx.exe") -Force
              Copy-Item -LiteralPath $cli -Destination (Join-Path $bin "idtech3-vulkan$sfx.exe") -Force
            }
            $missing = @()
            foreach ($n in $need) {
              if (-not (Test-Path -LiteralPath (Join-Path $bin $n))) { $missing += $n }
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "`nSearch idtech3*.exe under msvc2017:"
            Get-ChildItem -Path (Join-Path $root 'engine/platform/win32/msvc2017') -Recurse -File -Filter 'idtech3*.exe' -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
            throw "Staging incomplete; missing in bin: $($missing -join ', ')"
          }
          Write-Host "`nStaging OK for artifact upload."

      - name: Verify PE architecture (native compat)
        if: ${{ matrix.btype == 'Release' }}
        shell: pwsh
        run: ./scripts/windows_native_compat_check.ps1 -BinDir bin

      - name: Verify PE exports (static renderer - no plugin DLLs)
        if: ${{ matrix.btype == 'Release' }}
        shell: pwsh
        run: ./scripts/windows_pe_exports_check.ps1 -BinDir bin -SkipRendererDlls

      - name: Install Vulkan SDK (glslangValidator for Tier A)
        if: ${{ github.event_name != 'release' && matrix.btype == 'Release' }}
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Renderer regression check (Tier A, MSVC Release)
        if: ${{ github.event_name != 'release' && matrix.btype == 'Release' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          chmod +x scripts/renderer_regression_check.sh
          ./scripts/renderer_regression_check.sh

      - name: Smoke test (MSVC Release x64 only)
        if: ${{ github.event_name != 'release' && matrix.btype == 'Release' && matrix.arch == 'x64' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p release
          sfx='${{ matrix.suffix }}'
          cp -f "bin/idtech3_server${sfx}.exe" release/idtech3_server.exe
          cp -f "bin/idtech3${sfx}.exe" release/idtech3.exe
          cp -f bin/*.dll release/ 2>/dev/null || true
          chmod +x scripts/stage_ci_release.sh scripts/smoke_test.sh scripts/q3_openarena_compat_check.sh
          ./scripts/stage_ci_release.sh release bin
          ./scripts/smoke_test.sh release

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.btype == 'Release' }}
        with:
          name: windows-msvc-${{ matrix.pkg_suffix }}
          path: bin
          if-no-files-found: warn
          retention-days: 5

  ubuntu-x86_64:
    name: ${{ matrix.btype }} Ubuntu x86_64 ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        btype: [Release, Debug]
        exclude:
          # Clang Debug: covered by asan job
          - cc: clang
            btype: Debug

    steps:
      - name: Install tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev clang ccache
          sudo apt-get -o Acquire::Retries=5 -y install libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep

      - uses: actions/checkout@v4

      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Avoid github.sha in key (new blob every commit); hash build roots + workflow when they change.
          key: ccache-ubuntu-x64-${{ matrix.cc }}-${{ matrix.btype }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-ubuntu-x64-${{ matrix.cc }}-${{ matrix.btype }}-

      - name: Verify shader compilation
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        run: ./scripts/compile_shaders.sh

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          CMAKE_EXTRA=""
          if [ "${{ matrix.cc }}" = "clang" ]; then
            CMAKE_EXTRA="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          fi
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} $CMAKE_EXTRA \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=${{ (matrix.cc == 'gcc' && matrix.btype == 'Release') && 'ON' || 'OFF' }} \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=ON \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -DIDTECH3_PROFILE=full \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(nproc)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true

      - name: Smoke test
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        run: |
          mkdir -p release
          cp -f bin/idtech3* release/ || true
          chmod +x scripts/stage_ci_release.sh scripts/smoke_test.sh scripts/q3_openarena_compat_check.sh
          ./scripts/stage_ci_release.sh release bin
          ./scripts/smoke_test.sh release

      - name: CTest (make test)
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        run: |
          cd build-vk-${{ matrix.btype }} && ctest -C ${{ matrix.btype }} --output-on-failure -V

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: linux-x86_64
          path: bin
          if-no-files-found: error
          retention-days: 5

  linux-core:
    name: Profile core (Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep
      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd
      - name: Build core profile
        run: |
          ./scripts/compile_engine.sh vulkan core Release skipshaders
          mkdir -p release
          cp -f build-vk-Release/idtech3* release/
      - name: Smoke + compat
        run: |
          chmod +x scripts/smoke_test.sh scripts/q3_openarena_compat_check.sh scripts/ci/audit_unconditional_sources.sh
          ./scripts/smoke_test.sh release
          ./scripts/q3_openarena_compat_check.sh release
          ./scripts/ci/audit_unconditional_sources.sh
      - name: Layout + legacy wiring
        run: |
          ./scripts/layout_forwarding_symlinks.sh
          cd build-vk-Release
          ctest -R 'test_legacy_intact|test_repository_layout_2026|test_build_profiles|test_no_aux_core|test_msvc_layout_bridge|test_msvc_manifest_drift|test_msvc_vcxproj_paths_resolve|test_msvc_solution|test_src_shim_audit' --output-on-failure
      - name: Core unit tests
        run: |
          cd build-vk-Release && ctest -R '^unit_(macros|qmath|msg)$' --output-on-failure || ctest -R 'unit_' --output-on-failure -N | head -20

  linux-game:
    name: Profile game (Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep
      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd
      - name: Build game profile
        run: ./scripts/compile_engine.sh vulkan game Release skipshaders
      - name: Game profile tests
        run: |
          cd build-vk-Release
          ctest -R 'test_build_profiles|test_engine_module_manifest|test_cpp20_sources|test_msvc_manifest_drift|test_msvc_vcxproj_paths_resolve|test_msvc_solution|test_src_shim_audit' --output-on-failure
          ctest -L sector_stream --output-on-failure

  linux-full:
    name: Profile full (Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep
      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd
      - name: Build full profile
        run: ./scripts/compile_engine.sh vulkan full Release skipshaders
      - name: Full ctest
        run: |
          cd build-vk-Release && ctest --output-on-failure

  ubuntu-asan:
    name: Ubuntu x86_64 ASAN (Debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep

      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Build Vulkan (ASAN)
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-vk-asan
          cmake -S . -B build-vk-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=ON \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -Wno-dev
          cmake --build build-vk-asan -j$(nproc)

      - name: Smoke test (ASAN)
        run: |
          mkdir -p release
          cp -f build-vk-asan/idtech3* release/ || true
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh release

  asan:
    name: AddressSanitizer (Debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep

      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Build with ASAN
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          ./scripts/compile_shaders.sh
          mkdir -p build-asan
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=ON \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -Wno-dev
          cmake --build build-asan -j$(nproc)

      - name: Smoke test (ASAN)
        run: |
          mkdir -p release
          cp -f build-asan/idtech3* release/ || true
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh release

  static-analysis:
    name: Static analysis (clang-tidy, cppcheck)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -qq update
          sudo apt-get -o Acquire::Retries=5 -y install cmake ninja-build g++ libstdc++-14-dev clang-tidy cppcheck ccache
          sudo apt-get -o Acquire::Retries=5 -y install libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools python3 ripgrep

      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-static-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-static-

      - name: Build (compile_commands.json)
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-static
          cmake -S . -B build-static -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -Wno-dev
          cmake --build build-static -j$(nproc)

      - name: Run cppcheck
        run: |
          ./scripts/run_cppcheck.sh 2>&1 | tee cppcheck.log | tail -80

      - name: Run clang-tidy
        env:
          BUILD_DIR: ${{ github.workspace }}/build-static
        run: |
          ./scripts/run_clang_tidy.sh 2>&1 | tee clang-tidy.log | tail -80

  ubuntu-arm:
    name: ${{ matrix.btype }} Ubuntu [ARM] ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
        cc: [gcc]
        btype: [Release, Debug]
        include:
          - btype: Release
            rule: install
          - btype: Debug
            rule: debug

    steps:
      - uses: actions/checkout@v4
      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Build ${{ matrix.arch }}
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          shell: /bin/sh
          run: |
            set -eux

            export CFLAGS=""
            export CXXFLAGS=""
            export LDFLAGS=""
            if [ "${{ matrix.arch }}" = "armv7" ]; then
              export CFLAGS="-mfpu=neon -mfloat-abi=hard"
              export CXXFLAGS="-mfpu=neon -mfloat-abi=hard"
              export LDFLAGS="-mfpu=neon -mfloat-abi=hard"
            fi

            apt-get -o Acquire::Retries=5 -qq update
            apt-get -o Acquire::Retries=5 install -y make gcc g++ cmake ninja-build libstdc++-14-dev
            apt-get -o Acquire::Retries=5 -y install libcurl4-openssl-dev libssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev libbullet-dev pkg-config glslang-tools ripgrep

            OUTDIR="${GITHUB_WORKSPACE}/bin"
            mkdir -p "$OUTDIR"

            mkdir -p build-vk-${{ matrix.btype }}
            cmake -S . -B build-vk-${{ matrix.btype }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
              -DCI_BUILD=OFF \
              -DUSE_STB_TRUETYPE=ON \
              -DBUILD_FREETYPE=ON \
              -DENABLE_FORTIFY_SOURCE=OFF \
              -DENABLE_ASAN=OFF \
              -DBUILD_SERVER=ON \
              -DUSE_VULKAN=ON \
              -DRENDERER_DEFAULT=vulkan \
              -DSKIP_IDPAK_CHECK=ON \
              -DSKIP_SHADER_REGEN=ON \
              -Wno-dev
            cmake --build build-vk-${{ matrix.btype }} -j"$(nproc)"

            find "build-vk-${{ matrix.btype }}" -maxdepth 2 -type f -name 'idtech3*' -print -exec cp -f {} "$OUTDIR/" \;

            test -n "$(ls -A "$OUTDIR")"
            ls -al "$OUTDIR"

            mkdir -p release
            cp -f "$OUTDIR"/idtech3* release/ || true
            chmod +x scripts/smoke_test.sh
            ./scripts/smoke_test.sh release

            chmod +x scripts/renderer_regression_check.sh
            ./scripts/renderer_regression_check.sh

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: linux-${{ matrix.arch }}
          path: bin
          if-no-files-found: warn
          retention-days: 5

  macos:
    name: ${{ matrix.btype }} macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only
        arch: [aarch64]
        cc: [clang]
        btype: [Release, Debug]

    steps:
      - name: Install tools
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if brew install coreutils sdl2 openal-soft cmake ninja freetype lua molten-vk bullet pkgconf glslang; then
              exit 0
            fi
            echo "brew install attempt $attempt failed, retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          exit 1

      - uses: actions/checkout@v4

      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
          LIBRARY_PATH: "/opt/homebrew/lib"
          CMAKE_PREFIX_PATH: "/opt/homebrew"
        run: |
          SDL2_PREFIX=$(brew --prefix sdl2)
          OPENAL_PREFIX=$(brew --prefix openal-soft)
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL2_PATH="${SDL2_PREFIX}" \
            -DSDL2_INCLUDE_DIR="${SDL2_PREFIX}/include" \
            -DSDL2_LIBRARY="${SDL2_PREFIX}/lib/libSDL2.dylib" \
            -DOPENAL_INCLUDE_DIR="${OPENAL_PREFIX}/include" \
            -DOPENAL_LIBRARY="${OPENAL_PREFIX}/lib/libopenal.dylib" \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DSKIP_SHADER_REGEN=ON \
            -DCMAKE_INCLUDE_PATH="${OPENAL_PREFIX}/include" \
            -DCMAKE_LIBRARY_PATH="${OPENAL_PREFIX}/lib" \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(sysctl -n hw.logicalcpu)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true
          # Bundle .app trees are directories; copy the actual Mach-O binaries for smoke_test / artifacts.
          for app in build-vk-${{ matrix.btype }}/idtech3*.app; do
            [ -d "$app" ] || continue
            ex="$app/Contents/MacOS/$(basename "$app" .app)"
            [ -f "$ex" ] && cp -f "$ex" bin/ || true
          done

      - name: Smoke test
        if: ${{ github.event_name != 'release' && matrix.btype != 'Debug' }}
        run: |
          mkdir -p release
          cp -f bin/idtech3* release/ || true
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh release

      - name: Renderer regression check (Tier A)
        if: ${{ github.event_name != 'release' && matrix.btype != 'Debug' }}
        run: |
          chmod +x scripts/renderer_regression_check.sh
          ./scripts/renderer_regression_check.sh

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'clang' && matrix.btype == 'Release'
        with:
          name: macos-${{ matrix.arch }}
          path: bin
          if-no-files-found: warn
          retention-days: 5

  android:
    name: ${{ matrix.btype }} Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        btype: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            if sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Cache Android third-party downloads (Lua, FetchContent)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-android-deps
          key: android-deps-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'android/**', '.github/workflows/build.yml', 'scripts/renderer_regression_check.sh', 'scripts/renderer_regression_maps.sh') }}
          restore-keys: |
            android-deps-${{ matrix.abi }}-

      - name: Build ${{ matrix.btype }} (${{ matrix.abi }})
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        working-directory: android
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends make git perl glslang-tools
          # Use direct CMake cross-compile instead of Gradle to avoid
          # wrapper/SDK bootstrapping complexity in CI.
          NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/27.0.12077973}"
          TOOLCHAIN="$NDK_HOME/build/cmake/android.toolchain.cmake"

          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ANDROID_ABI="arm64-v8a"
          else
            ANDROID_ABI="armeabi-v7a"
          fi

          mkdir -p build-android-${{ matrix.btype }}-${{ matrix.abi }}
          mkdir -p "${GITHUB_WORKSPACE}/.ci-android-deps"
          for attempt in 1 2 3; do
            if cmake -S .. -B build-android-${{ matrix.btype }}-${{ matrix.abi }} \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DANDROID_ABI="$ANDROID_ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_shared \
              -DANDROID_DEPS_CACHE="${GITHUB_WORKSPACE}/.ci-android-deps" \
              -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
              -DBUILD_SERVER=OFF \
              -DUSE_VULKAN=ON \
              -DUSE_RENDERER_DLOPEN=OFF \
              -DRENDERER_DEFAULT=vulkan \
              -DSKIP_IDPAK_CHECK=ON \
              -DSKIP_SHADER_REGEN=ON \
              -DUSE_SDL=OFF \
              -DUSE_OPENAL=OFF \
              -DUSE_CURL=ON \
              -DUSE_LUA=ON \
              -DUSE_DUKTAPE=ON \
              -DUSE_FFMPEG=ON \
              -DUSE_DAV1D=ON \
              -DUSE_VPX=ON \
              -DUSE_THEORA=ON \
              -DUSE_FLUX=ON \
              -DUSE_RECAST_NAV=ON \
              -DUSE_BULLET_PHYSICS=ON \
              -DBUILD_FREETYPE=ON \
              -DUSE_DTLS=ON \
              -DENABLE_FORTIFY_SOURCE=OFF \
              -DENABLE_ASAN=OFF \
              -DCI_BUILD=OFF \
              -Wno-dev; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "cmake configure failed after 3 attempts"
              exit 1
            fi
            echo "cmake configure attempt $attempt failed, cleaning build dir and retrying in $((attempt * 20))s..."
            rm -rf "build-android-${{ matrix.btype }}-${{ matrix.abi }}"
            mkdir -p "build-android-${{ matrix.btype }}-${{ matrix.abi }}"
            sleep $((attempt * 20))
          done
          for attempt in 1 2 3; do
            if cmake --build build-android-${{ matrix.btype }}-${{ matrix.abi }} -j$(nproc); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "cmake --build failed after 3 attempts"
              exit 1
            fi
            echo "cmake --build attempt $attempt failed, retrying in $((attempt * 25))s..."
            sleep $((attempt * 25))
          done

          mkdir -p ../bin
          find build-android-${{ matrix.btype }}-${{ matrix.abi }} -maxdepth 2 \
            \( -name 'libidtech3*' -o -name 'idtech3*' \) -type f \
            -exec cp -f {} ../bin/ \;
          ls -la ../bin/

      - name: Renderer regression check (Tier A)
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        run: |
          chmod +x scripts/renderer_regression_check.sh
          ./scripts/renderer_regression_check.sh

      - uses: actions/upload-artifact@v4
        if: matrix.btype == 'Release'
        with:
          name: android-${{ matrix.abi }}
          path: bin
          if-no-files-found: warn
          retention-days: 5

  # One universal debug APK (arm64-v8a + armeabi-v7a). Separated from per-ABI CMake matrix to avoid duplicate Gradle/OpenSSL builds.
  android-apk:
    name: Android debug APK (Gradle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        run: ./scripts/init_optional_submodules.sh --freeusd

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake (match app/build.gradle), SDK platform 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            if sdkmanager --install "ndk;27.0.12077973" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Cache Android third-party downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-android-deps
          key: android-apk-deps-${{ hashFiles('CMakeLists.txt', 'android/app/build.gradle', '.github/workflows/build.yml', 'scripts/renderer_regression_check.sh', 'scripts/renderer_regression_maps.sh') }}
          restore-keys: |
            android-apk-deps-

      - name: Assemble debug APK
        if: ${{ github.event_name != 'release' }}
        working-directory: android
        env:
          ANDROID_DEPS_CACHE: ${{ github.workspace }}/.ci-android-deps
          GIT_TERMINAL_PROMPT: 0
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends make git perl glslang-tools
          chmod +x ./gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon -PandroidDepsCache="${ANDROID_DEPS_CACHE}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "gradlew assembleDebug failed after 3 attempts"
              exit 1
            fi
            echo "gradlew attempt $attempt failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          ls -la app/build/outputs/apk/debug/

      - name: Renderer regression check (Tier A)
        if: ${{ github.event_name != 'release' }}
        run: |
          chmod +x scripts/renderer_regression_check.sh
          ./scripts/renderer_regression_check.sh

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'release' }}
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 5

  release-attach:
    name: Attach artifacts to release
    if: always() && !cancelled() && github.event_name == 'release' && github.event.action == 'published'
    needs: [windows-msys, windows-msvc, ubuntu-x86_64, ubuntu-arm, macos, android, android-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        id: archive
        run: |
          mkdir -p dist
          tag="${{ github.event.release.tag_name }}"
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            zip -r "dist/idtech3-${tag}-${name}.zip" "$dir"
          done
          ls -la dist/
          echo "count=$(ls dist/*.zip 2>/dev/null | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Attach binaries to release
        if: steps.archive.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
