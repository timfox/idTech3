name: build

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/.gitignore'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/.gitignore'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows-msys:
    name: ${{ matrix.btype }} Windows-${{ matrix.cc }} ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # removed 32-bit x86
        arch: [x86_64]
        cc: [gcc]
        btype: [Release, Debug]
        include:
          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          install: >-
            base-devel
            ${{ matrix.prefix }}-binutils
            ${{ matrix.prefix }}-make
            ${{ matrix.prefix }}-${{ matrix.cc }}
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-SDL2
            ${{ matrix.prefix }}-openal
            ${{ matrix.prefix }}-freetype
            ${{ matrix.prefix }}-lua
          msystem: ${{ matrix.msystem }}
          path-type: minimal
          release: false
          update: false
          cache: false

      - uses: actions/checkout@v4

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=OFF \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(nproc)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true

      - name: Build OpenGL
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-gl-${{ matrix.btype }}
          cmake -S . -B build-gl-${{ matrix.btype }} -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=OFF \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=opengl \
            -DSKIP_IDPAK_CHECK=ON \
            -Wno-dev
          cmake --build build-gl-${{ matrix.btype }} -j$(nproc)
          cp -f build-gl-${{ matrix.btype }}/idtech3* bin/ || true

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: windows-${{ matrix.cc }}-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          retention-days: 5

  windows-msvc:
    name: ${{ matrix.btype }} Windows-MSVC ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        btype: [Release, Debug]
        include:
          - arch: arm64
            platform: ARM64
            suffix: .arm64
            pkg_suffix: arm64

          - arch: x64
            platform: x64
            suffix: .x64
            pkg_suffix: x86_64

    steps:
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4

      - name: Build
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        shell: cmd
        run: |
          if not exist bin mkdir bin

          set MSBUILD_COMMON=/m ^
            /p:Configuration=${{ matrix.btype }} ^
            /p:Platform=${{ matrix.platform }} ^
            /p:PlatformToolset=v143 ^
            /p:TreatWarningsAsErrors=false ^
            /p:WarningLevel=3

          rem --- Dedicated server ---
          msbuild src\platform\win32\msvc2017\quake3e-ded.vcxproj ^
            %MSBUILD_COMMON% ^
            /p:TargetName=idtech3_server
          if exist src\platform\win32\msvc2017\output\idtech3_server.exe copy /Y src\platform\win32\msvc2017\output\idtech3_server.exe bin\idtech3_server${{ matrix.suffix }}.exe
          msbuild src\platform\win32\msvc2017\quake3e-ded.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean ^
            /p:TargetName=idtech3_server

          rem --- OpenGL renderer + client ---
          msbuild src\platform\win32\msvc2017\renderer.vcxproj ^
            %MSBUILD_COMMON%
          msbuild src\platform\win32\msvc2017\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /p:TargetName=idtech3 ^
            /p:UseWasapi=0
          if exist src\platform\win32\msvc2017\output\idtech3.exe copy /Y src\platform\win32\msvc2017\output\idtech3.exe bin\idtech3${{ matrix.suffix }}.exe
          msbuild src\platform\win32\msvc2017\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean ^
            /p:TargetName=idtech3 ^
            /p:UseWasapi=0
          msbuild src\platform\win32\msvc2017\renderer.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean

          rem --- Vulkan renderer + client ---
          msbuild src\platform\win32\msvc2017\renderervk.vcxproj ^
            %MSBUILD_COMMON%
          msbuild src\platform\win32\msvc2017\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /p:TargetName=idtech3 ^
            /p:UseWasapi=0
          if exist src\platform\win32\msvc2017\output\idtech3.exe copy /Y src\platform\win32\msvc2017\output\idtech3.exe bin\idtech3-vulkan${{ matrix.suffix }}.exe
          msbuild src\platform\win32\msvc2017\quake3e.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean ^
            /p:TargetName=idtech3 ^
            /p:UseWasapi=0
          msbuild src\platform\win32\msvc2017\renderervk.vcxproj ^
            %MSBUILD_COMMON% ^
            /t:Clean

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.btype == 'Release' }}
        with:
          name: windows-msvc-${{ matrix.pkg_suffix }}
          path: bin
          if-no-files-found: error
          retention-days: 5

  ubuntu-x86_64:
    name: ${{ matrix.btype }} Ubuntu x86_64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc]
        btype: [Release, Debug]

    steps:
      - name: Install tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -qq update
          sudo apt-get -y install cmake ninja-build g++ libstdc++-14-dev libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev glslang-tools

      - uses: actions/checkout@v4

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(nproc)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true

      - name: Build OpenGL
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          mkdir -p build-gl-${{ matrix.btype }}
          cmake -S . -B build-gl-${{ matrix.btype }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=ON \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=opengl \
            -DSKIP_IDPAK_CHECK=ON \
            -Wno-dev
          cmake --build build-gl-${{ matrix.btype }} -j$(nproc)
          cp -f build-gl-${{ matrix.btype }}/idtech3* bin/ || true

      - name: Smoke test
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        run: |
          mkdir -p release
          cp -f bin/idtech3* release/ || true
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh release

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: linux-x86_64
          path: bin
          if-no-files-found: error
          retention-days: 5

  ubuntu-arm:
    name: ${{ matrix.btype }} Ubuntu [ARM] ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
        cc: [gcc]
        btype: [Release, Debug]
        include:
          - btype: Release
            rule: install
          - btype: Debug
            rule: debug

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }}
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          shell: /bin/sh
          run: |
            set -eux

            export CFLAGS=""
            export CXXFLAGS=""
            export LDFLAGS=""
            if [ "${{ matrix.arch }}" = "armv7" ]; then
              export CFLAGS="-mfpu=neon -mfloat-abi=hard"
              export CXXFLAGS="-mfpu=neon -mfloat-abi=hard"
              export LDFLAGS="-mfpu=neon -mfloat-abi=hard"
            fi

            apt-get -qq update
            apt-get install -y make gcc g++ cmake ninja-build libstdc++-14-dev
            apt-get -y install libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev libopenal-dev libfreetype6-dev lua5.4 liblua5.4-dev glslang-tools

            OUTDIR="${GITHUB_WORKSPACE}/bin"
            mkdir -p "$OUTDIR"

            mkdir -p build-vk-${{ matrix.btype }}
            cmake -S . -B build-vk-${{ matrix.btype }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
              -DCI_BUILD=OFF \
              -DUSE_STB_TRUETYPE=ON \
              -DBUILD_FREETYPE=ON \
              -DENABLE_FORTIFY_SOURCE=OFF \
              -DENABLE_ASAN=OFF \
              -DBUILD_SERVER=OFF \
              -DUSE_VULKAN=ON \
              -DRENDERER_DEFAULT=vulkan \
              -DSKIP_IDPAK_CHECK=ON \
              -DSKIP_SHADER_REGEN=ON \
              -Wno-dev
            cmake --build build-vk-${{ matrix.btype }} -j"$(nproc)"

            find "build-vk-${{ matrix.btype }}" -maxdepth 2 -type f -name 'idtech3*' -print -exec cp -f {} "$OUTDIR/" \;

            mkdir -p build-gl-${{ matrix.btype }}
            cmake -S . -B build-gl-${{ matrix.btype }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
              -DCI_BUILD=OFF \
              -DUSE_STB_TRUETYPE=ON \
              -DBUILD_FREETYPE=ON \
              -DENABLE_FORTIFY_SOURCE=OFF \
              -DENABLE_ASAN=OFF \
              -DBUILD_SERVER=OFF \
              -DUSE_VULKAN=ON \
              -DRENDERER_DEFAULT=opengl \
              -DSKIP_IDPAK_CHECK=ON \
              -DSKIP_SHADER_REGEN=ON \
              -Wno-dev
            cmake --build build-gl-${{ matrix.btype }} -j"$(nproc)"

            find "build-gl-${{ matrix.btype }}" -maxdepth 2 -type f -name 'idtech3*' -print -exec cp -f {} "$OUTDIR/" \;

            test -n "$(ls -A "$OUTDIR")"
            ls -al "$OUTDIR"

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.btype == 'Release'
        with:
          name: linux-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          retention-days: 5

  macos:
    name: ${{ matrix.btype }} macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only
        arch: [aarch64]
        cc: [clang]
        btype: [Release, Debug]

    steps:
      - name: Install tools
        run: brew install coreutils sdl2 openal-soft cmake ninja freetype lua

      - uses: actions/checkout@v4

      - name: Build Vulkan
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          SDL2_PREFIX=$(brew --prefix sdl2)
          OPENAL_PREFIX=$(brew --prefix openal-soft)
          mkdir -p build-vk-${{ matrix.btype }}
          cmake -S . -B build-vk-${{ matrix.btype }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL2_PATH="${SDL2_PREFIX}" \
            -DSDL2_INCLUDE_DIR="${SDL2_PREFIX}/include" \
            -DSDL2_LIBRARY="${SDL2_PREFIX}/lib/libSDL2.dylib" \
            -DOPENAL_INCLUDE_DIR="${OPENAL_PREFIX}/include" \
            -DOPENAL_LIBRARY="${OPENAL_PREFIX}/lib/libopenal.dylib" \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=OFF \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=vulkan \
            -DSKIP_IDPAK_CHECK=ON \
            -DCMAKE_INCLUDE_PATH="${OPENAL_PREFIX}/include" \
            -DCMAKE_LIBRARY_PATH="${OPENAL_PREFIX}/lib" \
            -Wno-dev
          cmake --build build-vk-${{ matrix.btype }} -j$(sysctl -n hw.logicalcpu)
          mkdir -p bin
          cp -f build-vk-${{ matrix.btype }}/idtech3* bin/ || true

      - name: Build OpenGL
        if: ${{ github.event_name != 'release' || matrix.btype != 'Debug' }}
        env:
          CFLAGS: "-DSKIP_IDPAK_CHECK=1"
          CXXFLAGS: "-DSKIP_IDPAK_CHECK=1"
        run: |
          SDL2_PREFIX=$(brew --prefix sdl2)
          OPENAL_PREFIX=$(brew --prefix openal-soft)
          mkdir -p build-gl-${{ matrix.btype }}
          cmake -S . -B build-gl-${{ matrix.btype }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.btype }} \
            -DCI_BUILD=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL2_PATH="${SDL2_PREFIX}" \
            -DSDL2_INCLUDE_DIR="${SDL2_PREFIX}/include" \
            -DSDL2_LIBRARY="${SDL2_PREFIX}/lib/libSDL2.dylib" \
            -DOPENAL_INCLUDE_DIR="${OPENAL_PREFIX}/include" \
            -DOPENAL_LIBRARY="${OPENAL_PREFIX}/lib/libopenal.dylib" \
            -DUSE_STB_TRUETYPE=ON \
            -DBUILD_FREETYPE=ON \
            -DENABLE_FORTIFY_SOURCE=OFF \
            -DENABLE_ASAN=OFF \
            -DBUILD_SERVER=OFF \
            -DUSE_VULKAN=ON \
            -DRENDERER_DEFAULT=opengl \
            -DSKIP_IDPAK_CHECK=ON \
            -DCMAKE_INCLUDE_PATH="${OPENAL_PREFIX}/include" \
            -DCMAKE_LIBRARY_PATH="${OPENAL_PREFIX}/lib" \
            -Wno-dev
          cmake --build build-gl-${{ matrix.btype }} -j$(sysctl -n hw.logicalcpu)
          cp -f build-gl-${{ matrix.btype }}/idtech3* bin/ || true

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'clang' && matrix.btype == 'Release'
        with:
          name: macos-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          retention-days: 5
