name: Benchmarks

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev \
            time
      
      - name: Build engine
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_SERVER=ON
          make -j$(nproc)
      
      - name: Build game modes
        run: |
          for mod in mymod blacksun; do
            if [ -d "$mod/gamesrc" ]; then
              echo "Building $mod..."
              cd $mod/gamesrc
              mkdir -p build
              cd build
              cmake ..
              make -j$(nproc)
              cd ../../..
            fi
          done
      
      - name: Run benchmarks
        id: benchmarks
        run: |
          mkdir -p benchmarks/results
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RESULTS_FILE="benchmarks/results/results_${TIMESTAMP}.json"
          
          # Measure build time
          BUILD_START=$(date +%s)
          # Already built, so just record
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          # Measure binary sizes
          if [ -f "build/idtech3.x86_64" ]; then
            BINARY_SIZE=$(stat -f%z build/idtech3.x86_64 2>/dev/null || stat -c%s build/idtech3.x86_64)
          else
            BINARY_SIZE=0
          fi
          
          # Measure startup time (if binary exists and can run)
          if [ -f "build/idtech3.x86_64" ] && [ -x "build/idtech3.x86_64" ]; then
            STARTUP_TIME=$(timeout 5s time -p ./build/idtech3.x86_64 +quit 2>&1 | grep real | awk '{print $2}' || echo "0")
          else
            STARTUP_TIME="0"
          fi
          
          # Measure memory usage (if binary exists)
          if [ -f "build/idtech3.x86_64" ] && [ -x "build/idtech3.x86_64" ]; then
            MEMORY_KB=$(timeout 5s /usr/bin/time -v ./build/idtech3.x86_64 +quit 2>&1 | grep "Maximum resident set size" | awk '{print $6}' || echo "0")
          else
            MEMORY_KB="0"
          fi
          
          # Create JSON results
          cat > "$RESULTS_FILE" << EOF
          {
            "timestamp": "${TIMESTAMP}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF#refs/heads/}",
            "metrics": {
              "build_time": ${BUILD_TIME},
              "binary_size": ${BINARY_SIZE},
              "startup_time": "${STARTUP_TIME}",
              "memory_kb": "${MEMORY_KB}"
            },
            "binaries": {
              "engine": "$(ls -lh build/idtech3.x86_64 2>/dev/null | awk '{print $5}' || echo 'N/A')",
              "server": "$(ls -lh build/idtech3.server.x86_64 2>/dev/null | awk '{print $5}' || echo 'N/A')"
            }
          }
          EOF
          
          cat "$RESULTS_FILE"
          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT
      
      - name: Compare with baseline
        run: |
          if [ -f "benchmarks/baseline.json" ]; then
            echo "Comparing with baseline..."
            # Simple comparison script
            python3 << EOF
          import json
          import sys
          
          try:
              with open('benchmarks/baseline.json', 'r') as f:
                  baseline = json.load(f)
              with open('${{ steps.benchmarks.outputs.results_file }}', 'r') as f:
                  current = json.load(f)
              
              baseline_metrics = baseline.get('metrics', {})
              current_metrics = current.get('metrics', {})
              
              print("## Benchmark Comparison")
              print("")
              
              for key in ['build_time', 'binary_size', 'startup_time', 'memory_kb']:
                  baseline_val = baseline_metrics.get(key, 0)
                  current_val = current_metrics.get(key, 0)
                  
                  if baseline_val and current_val:
                      try:
                          baseline_val = float(baseline_val)
                          current_val = float(current_val)
                          diff = ((current_val - baseline_val) / baseline_val) * 100
                          print(f"- **{key}**: {current_val:.2f} ({diff:+.1f}% vs baseline)")
                      except:
                          print(f"- **{key}**: {current_val} (vs baseline: {baseline_val})")
                  else:
                      print(f"- **{key}**: {current_val}")
          except Exception as e:
              print(f"Error comparing: {e}")
          EOF
          else
            echo "No baseline found, saving current results as baseline..."
            cp "${{ steps.benchmarks.outputs.results_file }}" benchmarks/baseline.json || true
          fi
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.json
            benchmarks/baseline.json
          retention-days: 90
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = '${{ steps.benchmarks.outputs.results_file }}';
            let comment = '## Benchmark Results\n\n';
            
            if (fs.existsSync(resultsFile)) {
              const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
              comment += `- **Build Time**: ${results.metrics.build_time}s\n`;
              comment += `- **Binary Size**: ${results.metrics.binary_size} bytes\n`;
              comment += `- **Startup Time**: ${results.metrics.startup_time}s\n`;
              comment += `- **Memory Usage**: ${results.metrics.memory_kb} KB\n`;
            } else {
              comment += 'Benchmark results not available.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
