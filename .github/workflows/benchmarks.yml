name: Benchmarks

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libcurl4-openssl-dev \
            libssl-dev libjpeg-dev \
            libvorbis-dev libogg-dev \
            libfreetype6-dev libsqlite3-dev \
            liblua5.4-dev libwebsockets-dev \
            libzstd-dev libopenal-dev \
            libvulkan-dev libtheora-dev \
            libvpx-dev libdav1d-dev \
            libopenexr-dev libassimp-dev \
            libbullet-dev \
            time
      
      - name: Build engine
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=ON \
            -DUSE_RENDERER_DLOPEN=ON \
            -DBUILD_SERVER=ON
          make -j$(nproc)
      
      - name: Build game modes
        run: |
          for mod in mymod blacksun; do
            if [ -d "$mod/gamesrc" ]; then
              echo "Building $mod..."
              cd $mod/gamesrc
              mkdir -p build
              cd build
              cmake ..
              make -j$(nproc)
              cd ../../..
            fi
          done
      
      - name: Run benchmarks
        id: benchmarks
        run: |
          mkdir -p benchmarks/results
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RESULTS_FILE="benchmarks/results/results_${TIMESTAMP}.json"

          # Measure build time
          BUILD_START=$(date +%s)
          # Already built, so just record
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))

          # Measure binary sizes
          if [ -f "build/idtech3.x86_64" ]; then
            BINARY_SIZE=$(stat -f%z build/idtech3.x86_64 2>/dev/null || stat -c%s build/idtech3.x86_64)
          else
            BINARY_SIZE=0
          fi

          # Measure startup time (if binary exists and can run)
          if [ -f "build/idtech3.x86_64" ] && [ -x "build/idtech3.x86_64" ]; then
            STARTUP_TIME=$(timeout 5s time -p ./build/idtech3.x86_64 +quit 2>&1 | grep real | awk '{print $2}' || echo "0")
          else
            STARTUP_TIME="0"
          fi

          # Measure memory usage (if binary exists)
          if [ -f "build/idtech3.x86_64" ] && [ -x "build/idtech3.x86_64" ]; then
            MEMORY_KB=$(timeout 5s /usr/bin/time -v ./build/idtech3.x86_64 +quit 2>&1 | grep "Maximum resident set size" | awk '{print $6}' || echo "0")
          else
            MEMORY_KB="0"
          fi

          # Run enhanced performance benchmarks
          echo "Running enhanced performance benchmarks..."
          if [ -f "build/benchmark_performance" ]; then
            ./build/benchmark_performance > benchmarks/enhanced_benchmarks.log 2>&1
            BENCHMARK_STATUS=$?
          else
            echo "Warning: benchmark_performance not found, skipping enhanced benchmarks"
            BENCHMARK_STATUS=1
          fi

          # Create JSON results
          cat > "$RESULTS_FILE" << EOF
          {
            "timestamp": "${TIMESTAMP}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF#refs/heads/}",
            "metrics": {
              "build_time": ${BUILD_TIME},
              "binary_size": ${BINARY_SIZE},
              "startup_time": "${STARTUP_TIME}",
              "memory_kb": "${MEMORY_KB}",
              "benchmark_status": ${BENCHMARK_STATUS}
            },
            "binaries": {
              "engine": "$(ls -lh build/idtech3.x86_64 2>/dev/null | awk '{print $5}' || echo 'N/A')",
              "server": "$(ls -lh build/idtech3.server.x86_64 2>/dev/null | awk '{print $5}' || echo 'N/A')"
            }
          }
          EOF

          cat "$RESULTS_FILE"
          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT
      
      - name: Compare with baseline and check regressions
        id: regression_check
        run: |
          REGRESSION_FOUND=0
          THRESHOLD_BUILD_TIME=10    # 10% build time increase allowed
          THRESHOLD_BINARY_SIZE=5    # 5% binary size increase allowed
          THRESHOLD_STARTUP_TIME=20  # 20% startup time increase allowed
          THRESHOLD_MEMORY_KB=15     # 15% memory increase allowed

          if [ -f "benchmarks/baseline.json" ]; then
            echo "Comparing with baseline..."
            # Regression detection script
            python3 << EOF
          import json
          import sys
          import os

          def check_regression(baseline_val, current_val, threshold_percent, metric_name):
              try:
                  baseline_val = float(baseline_val)
                  current_val = float(current_val)
                  if baseline_val == 0:
                      return False, 0.0
                  diff = ((current_val - baseline_val) / baseline_val) * 100
                  return diff > threshold_percent, diff
              except:
                  return False, 0.0

          try:
              with open('benchmarks/baseline.json', 'r') as f:
                  baseline = json.load(f)
              with open('${{ steps.benchmarks.outputs.results_file }}', 'r') as f:
                  current = json.load(f)

              baseline_metrics = baseline.get('metrics', {})
              current_metrics = current.get('metrics', {})

              print("## Benchmark Comparison")
              print("")

              regressions = []

              # Check each metric for regressions
              checks = [
                  ('build_time', $THRESHOLD_BUILD_TIME, 'Build Time'),
                  ('binary_size', $THRESHOLD_BINARY_SIZE, 'Binary Size'),
                  ('startup_time', $THRESHOLD_STARTUP_TIME, 'Startup Time'),
                  ('memory_kb', $THRESHOLD_MEMORY_KB, 'Memory Usage')
              ]

              for key, threshold, display_name in checks:
                  baseline_val = baseline_metrics.get(key, 0)
                  current_val = current_metrics.get(key, 0)

                  if baseline_val and current_val:
                      try:
                          baseline_val = float(baseline_val)
                          current_val = float(current_val)
                          diff = ((current_val - baseline_val) / baseline_val) * 100
                          is_regression, _ = check_regression(baseline_val, current_val, threshold, key)
                          if is_regression:
                              regressions.append(f"{display_name}: {diff:+.1f}% (threshold: {threshold}%)")
                          print(f"- **{display_name}**: {current_val:.2f} ({diff:+.1f}% vs baseline)")
                      except:
                          print(f"- **{display_name}**: {current_val} (vs baseline: {baseline_val})")
                  else:
                      print(f"- **{display_name}**: {current_val}")

              # Write regression status to file
              with open('regression_status.txt', 'w') as f:
                  f.write('1' if regressions else '0')
                  if regressions:
                      f.write('\n' + '\n'.join(regressions))

              if regressions:
                  print("")
                  print("## 🚨 Performance Regressions Detected!")
                  for regression in regressions:
                      print(f"- {regression}")
                  sys.exit(1)
              else:
                  print("")
                  print("✅ No performance regressions detected")

          except Exception as e:
              print(f"Error comparing: {e}")
              sys.exit(1)
          EOF

          # Read regression status and set output
          if [ -f "regression_status.txt" ]; then
            REGRESSION_FOUND=$(head -n1 regression_status.txt)
            if [ "$REGRESSION_FOUND" = "1" ]; then
              echo "Performance regressions detected!"
              tail -n+2 regression_status.txt
              exit 1
            fi
          fi
          else
            echo "No baseline found, saving current results as baseline..."
            cp "${{ steps.benchmarks.outputs.results_file }}" benchmarks/baseline.json || true
          fi

          echo "regression_found=$REGRESSION_FOUND" >> $GITHUB_OUTPUT

      - name: Analyze enhanced benchmark results
        id: benchmark_analysis
        run: |
          if [ -f "benchmark_timeseries.jsonl" ]; then
            echo "Analyzing enhanced benchmark results..."

            # Generate analysis reports
            python3 tools/bench_analyzer.py benchmark_timeseries.jsonl --output-dir benchmark_reports

            # Convert to CSV for external analysis
            python3 tools/bench_timeseries_to_csv.py benchmark_timeseries.jsonl --output-dir benchmark_csv

            # Check for performance regressions in detailed metrics
            if [ -f "benchmark_reports/performance_report.txt" ]; then
              # Look for any "degrading" trends in the report
              if grep -q "degrading" benchmark_reports/performance_report.txt; then
                echo "Performance degradation detected in detailed metrics"
                echo "detailed_regression=true" >> $GITHUB_OUTPUT
              else
                echo "No detailed performance regressions detected"
                echo "detailed_regression=false" >> $GITHUB_OUTPUT
              fi
            fi

            # Store analysis artifacts
            echo "analysis_complete=true" >> $GITHUB_OUTPUT
          else
            echo "No enhanced benchmark data found"
            echo "analysis_complete=false" >> $GITHUB_OUTPUT
            echo "detailed_regression=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.json
            benchmarks/baseline.json
            benchmark_reports/
            benchmark_csv/
            benchmark_*.json
            benchmark_timeseries.jsonl
            benchmark_summary.csv
          retention-days: 90
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = '${{ steps.benchmarks.outputs.results_file }}';
            let comment = '## 🚀 Enhanced Benchmark Results\n\n';

            if (fs.existsSync(resultsFile)) {
              const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
              comment += '### System Metrics\n';
              comment += `- **Build Time**: ${results.metrics.build_time}s\n`;
              comment += `- **Binary Size**: ${results.metrics.binary_size} bytes\n`;
              comment += `- **Startup Time**: ${results.metrics.startup_time}s\n`;
              comment += `- **Memory Usage**: ${results.metrics.memory_kb} KB\n\n`;

              // Check for enhanced benchmark results
              const analysisComplete = '${{ steps.benchmark_analysis.outputs.analysis_complete }}' === 'true';
              const detailedRegression = '${{ steps.benchmark_analysis.outputs.detailed_regression }}' === 'true';

              if (analysisComplete) {
                comment += '### Performance Analysis ✅\n';
                comment += 'Enhanced benchmarks completed with detailed per-iteration metrics.\n\n';

                if (fs.existsSync('benchmark_reports/performance_report.txt')) {
                  comment += '**Performance Report**: Available in artifacts\n';
                }

                if (detailedRegression) {
                  comment += '⚠️ **Performance regression detected** in detailed metrics\n';
                } else {
                  comment += '✅ No performance regressions detected\n';
                }

                comment += '\n**Analysis Artifacts**:\n';
                comment += '- 📊 Performance reports (`benchmark_reports/`)\n';
                comment += '- 📈 Time-series data (`benchmark_timeseries.jsonl`)\n';
                comment += '- 📋 CSV exports (`benchmark_csv/`)\n';
                comment += '- 📝 Detailed logs (`benchmarks/enhanced_benchmarks.log`)\n';
              } else {
                comment += '### Performance Analysis ⚠️\n';
                comment += 'Enhanced benchmark analysis not available.\n';
              }
            } else {
              comment += 'Benchmark results not available.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
