name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-build-

      - name: Build Debug APK
        run: |
          if [ -f "src/android-app/build.gradle" ]; then
            echo "Building Android app..."
            cd src/android-app
            ./gradlew assembleDebug
          else
            echo "No Android app found, skipping Android build"
          fi

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src/android-app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

