name: Android - Sign & Build Release (src)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-build-

      - name: Set up environment for signing
        run: echo "RELEASE_STORE_FILE=${{ secrets.RELEASE_STORE_FILE }}" >> $GITHUB_ENV

      - name: Build Release (signed via env vars)
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :src/android-app:assembleRelease

      - name: Upload Release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: src/android-app/build/outputs/apk/release/app-release.apk

