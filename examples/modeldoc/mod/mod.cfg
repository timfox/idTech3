-- ModelDoc mod configuration
-- This file is loaded when the mod is initialized

-- Mod metadata
mod.name = "ModelDoc"
mod.version = "1.0.0"
mod.description = "idTech3 Model Documentation System with WYSIWYG preview"
mod.author = "idTech3 Team"
mod.type = "tool"
mod.engineVersion = "2026.1"

-- Mod settings
mod.settings = {
    -- UI settings
    ui = {
        showWelcome = true,
        autoSave = true,
        savePath = "modeldoc_saves/"
    },
    
    -- Validation settings
    validation = {
        autoValidate = false,
        showPassing = true,
        showFailing = true,
        thresholds = {
            minTextureResolution = 256,
            maxPolygonCount = 100000,
            maxMaterialCount = 32
        }
    },
    
    -- Export settings
    export = {
        defaultFormat = "pdf",
        defaultPath = "modeldoc_exports/",
        includeImages = true,
        includeValidation = true,
        includeMetadata = true
    },
    
    -- Preview settings
    preview = {
        showWireframe = false,
        showBounds = false,
        showUVs = false,
        showNormals = false,
        showMaterials = true,
        showShadows = true,
        showReflections = true
    }
}

-- Register model extensions
mod.registeredExtensions = {
    "md3",
    "gltf",
    "glb",
    "iqm",
    "md5mesh",
    "usda",
    "usd"
}

-- Validation rules
mod.validationRules = {
    {
        name = "mesh_integrity",
        description = "Check mesh integrity and topology",
        severity = "high",
        enabled = true
    },
    {
        name = "texture_resolution",
        description = "Check texture resolution and format",
        severity = "medium",
        enabled = true
    },
    {
        name = "material_completeness",
        description = "Check material completeness and parameters",
        severity = "high",
        enabled = true
    },
    {
        name = "animation_validity",
        description = "Check animation validity and compatibility",
        severity = "medium",
        enabled = true
    },
    {
        name = "collision_bounds",
        description = "Check collision bounds and physics compatibility",
        severity = "high",
        enabled = true
    },
    {
        name = "shader_compatibility",
        description = "Check shader compatibility with Vulkan renderer",
        severity = "high",
        enabled = true
    }
}

-- Export formats
mod.exportFormats = {
    {
        name = "pdf",
        description = "PDF documentation with images",
        extension = "pdf",
        renderer = "pdf"
    },
    {
        name = "html",
        description = "HTML documentation with interactive elements",
        extension = "html",
        renderer = "html"
    },
    {
        name = "json",
        description = "JSON metadata for programmatic access",
        extension = "json",
        renderer = "json"
    },
    {
        name = "markdown",
        description = "Markdown documentation for GitHub/wiki",
        extension = "md",
        renderer = "markdown"
    }
}

-- Console commands
mod.consoleCommands = {
    "modeldoc_reload",
    "modeldoc_open",
    "modeldoc_validate",
    "modeldoc_export",
    "modeldoc_browser_refresh",
    "modeldoc_preview"
}

-- Lua API
mod.luaAPI = {
    "ModelDoc",
    "Scene",
    "GameObject",
    "Component",
    "ModelPreviewComponent",
    "ModelBrowserComponent",
    "ValidationComponent",
    "ExportComponent"
}