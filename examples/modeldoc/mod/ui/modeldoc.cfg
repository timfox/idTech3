-- ModelDoc UI Configuration
-- UI layout and settings for ModelDoc mod

-- Window positions and sizes
ui.window.modeldoc = {
    position = {x = 100, y = 100},
    size = {width = 800, height = 600},
    title = "ModelDoc - Model Documentation System",
    flags = {"always_visible", "no_resize"}
}

-- Model Browser settings
ui.modelBrowser = {
    searchPath = "models/",
    showThumbnails = true,
    showValidation = true,
    showExport = true
}

-- Preview settings
ui.preview = {
    showWireframe = false,
    showBounds = false,
    showUVs = false,
    showNormals = false,
    showMaterials = true
}

-- Validation settings
ui.validation = {
    showPassing = true,
    showFailing = true,
    autoValidate = false,
    validationThresholds = {
        minTextureResolution = 256,
        maxPolygonCount = 100000,
        maxMaterialCount = 32
    }
}

-- Export settings
ui.export = {
    defaultFormat = "pdf",
    defaultPath = "modeldoc_exports/",
    includeImages = true,
    includeValidation = true
}

-- Keyboard shortcuts
ui.shortcuts = {
    toggleUI = "F1",
    toggleValidation = "F2",
    cyclePreviewMode = "F3",
    openBrowser = "Ctrl+O",
    export = "Ctrl+E",
    refreshBrowser = "Ctrl+R",
    validateSelected = "Ctrl+V"
}

-- Color scheme
ui.colors = {
    background = {0.1, 0.1, 0.1, 1.0},
    text = {0.9, 0.9, 0.9, 1.0},
    passing = {0.2, 0.8, 0.2, 1.0},
    failing = {0.8, 0.2, 0.2, 1.0},
    warning = {0.9, 0.7, 0.2, 1.0},
    selection = {0.2, 0.5, 0.9, 1.0}
}

-- Layout configuration
ui.layout = {
    splitVertical = 0.3,  -- 30% browser, 70% preview
    splitHorizontal = 0.4,  -- 40% properties, 60% validation
    showSidebar = true,
    showToolbar = true,
    showStatusbar = true
}