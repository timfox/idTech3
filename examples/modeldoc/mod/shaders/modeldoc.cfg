-- ModelDoc shaders
-- Custom shaders for model documentation and validation

-- Model preview shader
modeldoc/model_preview {
    qer_editor modeldoc_preview
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen identity
    }
    {
        map $whiteimage
        blendFunc GL_SRC_ALPHA GL_ONE_MINUS_SRC_ALPHA
        alphaGen vertex
    }
}

-- Model debug shader for validation visualization
modeldoc/model_debug {
    qer_editor modeldoc_debug
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen identity
        alphaGen vertex
    }
    {
        map $whiteimage
        blendFunc GL_SRC_ALPHA GL_ONE_MINUS_SRC_ALPHA
        colorGen vertex
        alphaGen vertex
    }
}

-- Wireframe shader for mesh inspection
modeldoc/wireframe {
    qer_editor modeldoc_wireframe
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen identity
        alphaGen vertex
    }
}

-- Bounds shader for collision visualization
modeldoc/bounds {
    qer_editor modeldoc_bounds
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen const (1 0 0)
        alphaGen vertex
    }
}

-- Normal visualization shader
modeldoc/normals {
    qer_editor modeldoc_normals
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen identity
        alphaGen vertex
    }
}

-- UV visualization shader
modeldoc/uv {
    qer_editor modeldoc_uv
    surfaceparm nomark
    {
        map $whiteimage
        rgbGen identity
        alphaGen vertex
    }
}