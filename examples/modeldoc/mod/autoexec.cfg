-- ModelDoc autoexec.cfg\n-- Executed when modeldoc mod is loaded\n\n-- Set the game to modeldoc\ncvar_set fs_game \"modeldoc\"\n\n-- Enable Lua scripting\nset com_scriptWatch 1\n\n-- Load ModelDoc\nscript_reload scripts/lua/modeldoc.lua\n\n-- Load UI configuration\nexec ui/modeldoc.cfg\n\n-- Set up default viewports\nset r_viewport \"modeldoc\"\n\n-- Enable Vulkan renderer\nset cl_renderer \"vulkan\"\n\n-- Enable PBR materials\nset r_pbr 1\nset r_pbrMetallic 1\nset r_pbrRoughness 1\n\n-- Enable RTX if available\nset r_rtx 1\nset r_rtxDemo 1\n\n-- Enable neural GI\nset r_ndgi 1\nset r_ndgi_cycle 1\n\n-- Enable TAA for smooth rendering\nset r_taa 1\n\n-- Enable FBO for advanced rendering\nset r_fbo 1\n\n-- Set up modeldoc-specific cvars\nset modeldoc_enabled 1\nset modeldoc_autoValidate 0\nset modeldoc_showThumbnails 1\nset modeldoc_showValidation 1\n\n-- Set up export paths\nset modeldoc_exportPath \"modeldoc_exports/\"\nset modeldoc_exportFormat \"pdf\"\n\n-- Load default shaders\nexec shaders/modeldoc/default.cfg\n\n-- Print startup message\nprint \"[ModelDoc] ModelDoc mod loaded successfully\"\nprint \"[ModelDoc] Press F1 to toggle ModelDoc UI\"\nprint \"[ModelDoc] Use modeldoc_validate <model> to validate models\"\nprint \"[ModelDoc] Use modeldoc_export <model> <output> <format> to export documentation\"\n"