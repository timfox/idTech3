// Surfel GI (GIBS) demo — needs RTX build + ray query + map with BSP geometry
seta r_fbo "1"
seta r_surfelGi "1"
seta r_rtxDemo "1"
seta r_renderMode "1"
seta r_deferredGBuffer "1"
seta r_deferredGBufferFill "1"
seta r_deferredLighting "1"
seta r_forwardPlus "1"
seta r_rtxEntities "1"
seta r_surfelGi_max "16384"
seta r_surfelGi_samples "4"
seta r_surfelGi_intensity "1.0"
seta r_surfelGi_strength "0.85"
seta r_surfelGi_spawn "1024"
echo "[demo] Surfel GI: exec demo_surfel_gi.cfg — vid_restart if toggling latched cvars"
echo "[demo] Surfel GI: surfel_gi_status ; set r_surfelGi_debug 1 to visualize irradiance"
