// OpenVDB Woodcock / delta-tracking volumetrics demo
// Requires Vulkan volumetric fog; sample grid ships in idtech3_demo.pk3 as vdb/fog_2cubed.nvdb
set r_volumetricFog 1
set r_vdbFog 1
set r_vdbFogBlend 0.5
set r_vdbMajorantBrick 8
vdb_load vdb/fog_2cubed.nvdb
vdb_upload 0
vdb_bind_fog 0
volumetric_integration 3
vdb_list
echo "[demo] VDB Woodcock: exec demo_vdb_woodcock.cfg — mode 3 + majorant bricks (r_vdbMajorantBrick)"
echo "[demo] VDB Woodcock: after changing brick size, majorants refresh automatically (or vdb_rebuild_majorant 0)"
echo "[demo] VDB Woodcock: see docs/VDB_WOODCOCK_VOLUMETRICS.md"
