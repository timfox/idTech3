// CBT terrain + splat control map demo.
set r_cbtTerrain 1
set r_cbtTerrainScale 256
set r_cbtTerrainGrid 32
set r_cbtTerrainSplat 1
cbt_load textures/demo/cbt_height.png
cbt_splat textures/demo/cbt_control.png textures/demo/dirt.png textures/demo/rock.png
cbt_status
echo "CBT splat demo: r_cbtTerrain 1 + height/control under textures/demo/"
