// Sponza material/lighting parity capture.
// One USDA scene and camera; only the lighting/material owner changes.

set cl_renderer vulkan
set r_fbo 1
set r_hdr 2
set r_tonemap 3
set r_filmGrain 0
set r_chromaticAberration 0
set r_filmLook 0
set r_taa 0
set r_taaMotionVectors 0
set r_gbufferCompact 0
set r_materialBlend 1
set r_district 1
set r_districtDraw 1
set r_districtCamera 1
set r_districtOnly 1
set r_districtCameraDistance 0.6
set r_districtLoadRadius 100000
set r_freeusd 1
set com_freeusd 1
set r_freeusdShaderMap 1
set r_freeusdImportAllMeshes 1
set r_freeusdMeshBudget 250000
set r_forwardPlus 1
set r_forwardPlusShade 1
set r_ambientVisibilityMode 2
set r_ssao 0
set r_ssr 0
set r_oit 0
set r_oitClassify 1
set r_oitForwardPlus 1
set r_rtx 0

map aggressor
wait 5
district_load world/sponza_fixture.usda
district_load_full 0
wait 8
screenshot sponza_material_parity_forward

set r_renderMode 1
set r_deferredLighting 1
vid_restart
wait 5
screenshot sponza_material_parity_deferred

set r_renderMode 3
set r_deferredLighting 0
set r_oit 1
vid_restart
wait 5
screenshot sponza_material_parity_wboit

set r_oit 0
set r_ssr 1
vid_restart
wait 5
screenshot sponza_material_parity_ssr

set r_ssr 0
set r_rtx 1
set r_rtxDemo 1
vid_restart
wait 5
screenshot sponza_material_parity_rtx
quit
