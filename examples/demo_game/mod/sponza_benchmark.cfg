// Deterministic Sponza benchmark and proof capture.
//
// The scene, camera, resolution, temporal state, and post-processing are
// fixed.  Each checkpoint prints ownership diagnostics before capturing the
// image, so screenshots can be compared alongside the renderer contract log.

set cl_renderer vulkan
set r_mode -1
set r_customWidth 1280
set r_customHeight 720
set r_renderScale 0
set r_fbo 1
set r_hdr 2
set r_tonemap 3
set r_exposure 1
set r_filmGrain 0
set r_chromaticAberration 0
set r_filmLook 0
set r_taa 0
set r_taaMotionVectors 0
set r_gbufferCompact 0
set r_materialBlend 1
set r_district 1
set r_districtDraw 1
set r_districtCamera 1
set r_districtOnly 1
set r_districtCameraDistance 0.6
set r_districtLoadRadius 100000
set r_freeusd 1
set com_freeusd 1
set r_freeusdShaderMap 1
set r_freeusdImportAllMeshes 1
set r_freeusdMeshBudget 250000
set r_forwardPlus 1
set r_forwardPlusShade 1
set r_forwardPlusDepthCull 1
set r_ambientVisibilityMode 2
set r_ssao 0
set r_oitClassify 1
set r_oitForwardPlus 1
set r_rtx 0

map aggressor
wait 5
district_load world/sponza_fixture.usda
district_load_full 0
wait 10

// Baseline: clustered Forward+ opaque plus transparent routing disabled.
set r_renderMode 2
set r_deferredLighting 0
set r_oit 0
renderer_status
renderer_capture_frame_contract
cluster_status
wait 2
screenshotJPEG sponza_benchmark_forwardplus

// Deferred proof: the same USDA material surfaces and camera, new lighting owner.
set r_renderMode 1
set r_deferredLighting 1
vid_restart
wait 5
renderer_status
renderer_capture_frame_contract
deferred_status
wait 2
screenshotJPEG sponza_benchmark_deferred

// Unified clustered proof: opaque deferred and transparent Forward+ share light ownership.
set r_renderMode 3
set r_deferredLighting 0
set r_oit 1
vid_restart
wait 5
renderer_status
renderer_capture_frame_contract
cluster_status
oit_status
wait 2
screenshotJPEG sponza_benchmark_wboit

// Leave the run with the portable raster baseline as the reference state.
set r_oit 0
set r_renderMode 2
set r_deferredLighting 0
vid_restart
wait 3
renderer_status
renderer_capture_frame_contract
wait 2
screenshotJPEG sponza_benchmark_final
quit
