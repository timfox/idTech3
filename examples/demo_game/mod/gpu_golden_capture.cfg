// Tier B GPU golden capture — run with GAME_BASE + display:
//   ./release/idtech3 +set fs_game idtech3_demo +exec gpu_golden_capture.cfg
// Or: ./scripts/gpu_golden_capture.sh --capture
// Pin grain/CA so capture noise does not poison goldens (HDR_GAPS §6.5b).

set cl_renderer vulkan
set r_fbo 1
set r_hdr 2
set r_tonemap 3
set r_filmGrain 0
set r_chromaticAberration 0
set r_filmLook 0
set r_taa 1
set r_taaMotionVectors 1
set r_temporalCpuSkinPrev 1
set r_temporalCustomShaderMotion 1
set r_temporalScopeReduce 1
set r_decalProps 1

wait
wait
wait
screenshotTGA
quit
