// CSS-style UI filter / backdrop-filter blur validation scene (JS UI compositor).
// Requires the Vulkan renderer with r_fbo 1 (default) and USE_DUKTAPE.
//
// Debug:  ui_filterDebug 1 (layer bounds) .. 6 (transient texture residency)
// Status: ui_blur_status
// Quality: ui_blurQuality 0 disabled / 1 quarter / 2 half / 3 adaptive

set ui_blurQuality 3
set ui_blurMaxRadius 64
set ui_blurDownsampleThreshold 12
set ui_blurCache 1
set cl_uiFilter 1

echo "^2[ui_blur]^7 loading validation scene: filter/backdrop-filter blur"
echo "^2[ui_blur]^7 debug: ui_filterDebug 1-6, status: ui_blur_status"
js_reload scripts/js/demo_ui_blur.js
