// id Tech 8–class look preset (chocolate / shipping path — no experimental neural flags)
// Requires a map + game data. Latched cvars need vid_restart.
// See docs/RENDERER_2026_ARCHITECTURE_PASS.md and docs/NEURAL_RENDERER_PHASES.md

// --- Lighting scalability (Forward+) ---
set r_renderMode 2
set r_forwardPlus 1
set r_forwardPlusShade 1

// --- Temporal robustness ---
set r_taa 1
set r_taaMotionVectors 1
set r_temporalCpuSkinPrev 1
set r_temporalScopeReduce 1
set r_temporalCustomShaderMotion 1

// --- Upscale (shipping path; FSR2 SDK not wired — r_upscale 2 falls back to spatial) ---
set r_upscale 0
// Quality/perf: set r_upscale 1; set r_renderScale 0.75; vid_restart

set r_decalProps 1
set r_spriteProps 1

// --- Chocolate VFX (always linked; default off) ---
// set r_mgs 2
// set r_wsp 1
// set r_squeezeme 1

// --- Chocolate RT tier (requires: ./scripts/compile_engine.sh vulkan rtx) ---
// set r_fbo 1
// set r_rtxDemo 1
// set r_hybrid1 1
// exec demo_hybrid1.cfg
// vid_restart

// --- Chocolate ocean (requires USE_ARC_BLANC / profile full) ---
// set r_arcBlanc 1
// exec demo_arc_blanc.cfg

echo "^2[idtech3]^7 id Tech 8 look: Forward+ + TAA + motion vectors (chocolate; see docs/NEURAL_RENDERER_PHASES.md)"
