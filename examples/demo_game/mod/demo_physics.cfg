// idtech3_demo — Bullet substrate + middleware layer (Gopex engine demo)
// Requires libbullet-dev build. Toggle with phys_enabled / cl_physicsEnabled.

set phys_enabled 1
set cl_physicsEnabled 1
set phys_events 1
set phys_motor 1
set phys_ragdoll_balance 1
set phys_ragdoll_muscles 1

// Wireframe collision shapes (Vulkan polys when phys_debugDraw 1)
set phys_debugDraw 0

echo "^2[idtech3_demo]^7 physics middleware: phys_status | phys_debugDraw 1"
