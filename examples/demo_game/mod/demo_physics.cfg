// idtech3_demo — Box3D Soft Step (default) + XPBD cloth + prop middleware
// Toggle with phys_enabled / cl_physicsEnabled. Backend shown by phys_status.

set phys_enabled 1
set cl_physicsEnabled 1
set phys_events 1
set phys_motor 1
set phys_ragdoll_balance 1
set phys_ragdoll_muscles 1
set phys_ragdoll_stiffness 0.8
set phys_ragdoll_damping 0.4
set phys_workers 0
set phys_sleep 1
set phys_ccd 1
set phys_pmove 0
set phys_stepHeight 18
set sv_physSpawn 1
set phys_bspGridStep 24
set phys_record 0

// Collision wireframe (also: phys_debug) — rigid + cloth edges
set phys_debugDraw 0

echo "^2[idtech3_demo]^7 Box3D: phys_spawn_sensor | phys_spawn_slider | phys_spawn_heightfield | phys_solvers"
echo "^2[idtech3_demo]^7 companions: cloth | rope | particles | softblob | fluid"
echo "^2[idtech3_demo]^7 rigid: phys_spawn_box | phys_spawn_sphere | phys_spawn_static | phys_spawn_compound | phys_spawn_shadow"
echo "^2[idtech3_demo]^7 helpers: phys_spawn_buoyancy | phys_impulse_sphere | phys_debug | phys_status"
echo "^2[idtech3_demo]^7 map: misc_phys_* (sv_physSpawn) | phys_pmove 1 for CastMover Pmove"
echo "^2[idtech3_demo]^7 try: phys_spawn_slider 0 0 64 ; phys_spawn_sensor 0 0 32 ; phys_debug"
