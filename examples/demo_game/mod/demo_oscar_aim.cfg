// idtech3 — OSCAR hybrid AIM client demo
// Requires a local Open OSCAR server (direct FLAP on 5190).
// Set IDTECH3_OSCAR_PASSWORD in the environment; do not archive passwords.
echo "^2[idtech3]^7 demo_oscar_aim.cfg — hybrid AIM (shared local oscar_account)"

set oscar_enable 1
set oscar_mode "direct"
set oscar_gateway "127.0.0.1"
set oscar_gatewayPort "5190"
set oscar_notify 1
set oscar_presence 1
set cl_oscarNotify 1
set cl_oscarUi 1
set r_imgui 1

// Set your local screen name (client shared account). Dedicated servers
// should use a service identity (e.g. legacy-server-42) instead.
// set oscar_account "YourSN"

echo "^3Hint:^7 set oscar_account, export IDTECH3_OSCAR_PASSWORD, then oscar_connect"
echo "^3UI:^7 ImGui Window -> OSCAR / AIM  |  cmds: oscar_status oscar_buddies oscar_im"
echo "^3Lua:^7 lua_run demo_oscar_poll()  /  demo_oscar_status()"

oscar_status
script_reload scripts/lua/demo_oscar_aim.lua
