// Open-world streaming + fog bioaerosol coastal gradient (Evans et al. 2019)
// Load a map, walk along +X from coast origin — marine influence falls off with distance.

exec demo_openworld.cfg
exec demo_fog_biology.cfg

set r_fogBiologyCoastAuto 1
set r_fogBiologyCoastOrigin 0
set r_fogBiologyCoastAxis 0
set r_fogBiologyCoastUnitsPerKm 512

echo "^2[idtech3_demo]^7 Open world + fog bio: openworld_start | fog_biology_poll | fog_biology_sweep"
echo "^2[idtech3_demo]^7 Walk +X — watch r_fogBiologySyncCoastKm / marine in ImGui Bioaerosol panel"

fog_biology_sweep
