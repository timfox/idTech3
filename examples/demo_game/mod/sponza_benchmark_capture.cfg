// Single-process Sponza benchmark capture.
// Select r_renderMode/r_deferredLighting/r_oit before startup.

set cl_renderer vulkan
set r_mode -1
set r_customWidth 1280
set r_customHeight 720
set r_renderScale 0
set r_picmip 5
set r_fbo 1
set r_hdr 2
set r_tonemap 3
set r_exposure 1
set r_filmGrain 0
set r_chromaticAberration 0
set r_filmLook 0
set r_taa 0
set r_taaMotionVectors 0
set r_gbufferCompact 0
set r_materialBlend 1
set r_district 1
set r_districtDraw 1
set r_districtCamera 1
set r_districtOnly 1
set r_districtAnchorView 0
set r_districtCameraDistance 0.6
set r_districtLoadRadius 100000
set r_freeusd 1
set com_freeusd 1
// Geometry/ownership benchmark: material parity is covered by the dedicated
// sponza_material_parity.cfg capture, which enables the authored texture map.
set r_freeusdShaderMap 0
set r_freeusdImportAllMeshes 0
set r_freeusdMeshBudget 100000
set r_forwardPlus 1
set r_forwardPlusShade 1
set r_forwardPlusDepthCull 1
set r_ambientVisibilityMode 2
set r_ssao 0
set r_oitClassify 1
set r_oitForwardPlus 1
set r_rtx 0

// Use the checked-in empty host BSP; districtOnly makes the USDA scene own visibility.
map open_void
wait 5
district_load world/sponza_fixture.usda
district_load_full 0
district_status 0
wait 10
renderer_draw_status
renderer_status
renderer_capture_frame_contract
cluster_status
deferred_status
oit_status
wait 2
screenshotJPEG sponza_benchmark_capture
wait 3
quit
