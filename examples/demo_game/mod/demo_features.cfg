// idtech3_demo - feature demo toggles (edit and rebuild demo_game_pk3)
// Requires a real map + assets from your base game. Many cvars are latched; restart client if needed.

// --- Renderer backend (user often sets on command line) ---
// +set cl_renderer vulkan   or   opengl

// --- PBR / materials (Vulkan path) ---
set r_pbr 1

// --- Volumetric fog (Vulkan; default cvar is 0) ---
set r_volumetricFog 1

// --- Screen-space reflection (toggle for demo; may affect perf) ---
set r_ssr 1

// --- Atmospheric scattering (toggle) ---
set r_atmosphere 1

// --- Vegetation wind (shader effect where used) ---
set r_vegWind 1

echo "^2[idtech3_demo]^7 demo_features.cfg applied - load a map (e.g. map q3dm1)"
