// idtech3_demo - feature demo toggles (edit and rebuild demo_game_pk3)
// Requires a real map + assets from your base game. Many cvars are latched; restart client if needed.

// --- UI + engine console/HUD: TrueType via FreeType (runtime glyph atlas; no pre-bake) ---
set r_font "fonts/Inter_28pt-Regular.ttf"
// cl_builtInTtf defaults to 1 — keep r_font non-empty and BUILD_FREETYPE on.
set r_fontDpi 96
set r_fontHint 1
// set r_fontMipmap 0   // default 1: mip chain on TrueType atlas pages for small text
// After changing r_fontDpi / r_fontHint / r_fontMipmap / r_font / r_fontSize: reloadTtf (or vid_restart keep_window)
set r_fontConsoleAlign 1
// set r_fontShadow 0        // 0 = skip TrueType drop shadow (default 2)
// set r_fontSubpixel 1      // optional +0.375px nudge after projection

// Optional SDF (pre-generated BMFont + distance atlas in pk3): set r_sdfEnable 1; set r_sdfFont "fonts/demo_console_sdf"; tune r_sdfSmoothing

// --- Renderer backend (user often sets on command line) ---
// +set cl_renderer vulkan   or   opengl

// --- PBR / materials (Vulkan path) ---
set r_pbr 1

// --- Volumetric fog (Vulkan; default cvar is 0) ---
set r_volumetricFog 1

// --- Screen-space reflection (toggle for demo; may affect perf) ---
set r_ssr 1

// --- Atmospheric scattering (toggle) ---
set r_atmosphere 1

// --- Vegetation wind (shader effect where used) ---
set r_vegWind 1

echo "^2[idtech3_demo]^7 demo_features.cfg applied - load a map from your base install (e.g. map yourmap)"
