// Variable-Rate Compute Shading demo (deferred lighting wrap)
// Requires: Vulkan FBO + deferred lighting (mode 1 or 3)

seta r_fbo 1
seta r_renderMode 3
seta r_deferredLighting 1
seta r_deferredUnlitBase 1
seta r_forwardPlus 1
seta r_vrcs 1
seta r_vrcs_quality 1
seta r_vrcs_extraHalf 1
seta r_vrcs_deblock 1
seta r_vrcs_debug 0

echo "^2[VRCS]^7 Variable-Rate Compute Shading armed — vid_restart, then vrcs_status"
