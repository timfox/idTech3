// Infinite open-world streaming (nav tiles + billboard scatter per sector)
set r_openWorld 1
set r_openWorldStream 1
set r_openWorldNav 1
set r_openWorldSprites 1
set cm_stream 1
set cm_streamMerge 1
set cm_openWorldCollision 1
set cl_engineSprites 1
set r_proc 1
set r_procScatterRegion 1
set r_bspStream 1
set cm_openWorldCollision 1

// Consistent submodular residency (optional; legacy disk when 0)
set r_openWorldResidency 0
set r_openWorldResidencyEpsilon 0.05
set r_openWorldMaxSectors 64
set r_openWorldMaxNavSectors 32
set r_openWorldMaxSpriteSectors 64
set r_openWorldResidencyMaxSwaps 4
set r_openWorldLoadRadius 12288
set r_openWorldUnloadRadius 14336

echo "^2[idtech3_demo]^7 Open world: openworld_start"
echo "^2[idtech3_demo]^7            openworld_sector 0 0"
echo "^2[idtech3_demo]^7            openworld_status"
echo "^2[idtech3_demo]^7            nav_bake_sector 0 0"
