// Arc Blanc ocean demo — Algis et al. 2025 (arXiv:2503.03326)
seta r_arcBlanc 1
seta r_arcBlancWind 20
seta r_arcBlancFetch 1000
seta r_arcBlancSwell 0.5
seta r_arcBlancDirectional 1
seta r_arcBlancSpread 0.4
seta r_arcBlancAmplitude 1.0
seta r_arcBlancHeightScale 1.0
seta r_arcBlancChoppiness 1.0
seta r_arcBlancWaveSpeed 1.0
seta r_arcBlancGustStrength 0.15
seta r_arcBlancUpdateHz 0
seta r_arcBlancGrid 128
seta r_arcBlancTile 256
seta r_arcBlancTileBreak 1
seta r_arcBlancFoam 1
// seta r_arcBlancGpu 1   // optional Vulkan FFT path (USE_ARC_BLANC build)
seta cl_physicsEnabled 1
seta phys_enabled 1
echo "Arc Blanc ocean enabled — arc_blanc_status / arc_blanc_sample <x> <z> / arc_blanc_preset storm"
