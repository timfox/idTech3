// Engine-native sprite props (no cgame code required).
// Toggle: r_spriteProps 1 (renderer), cl_engineSprites 1 (networked snapshot bridge),
// sv_engineSprites 1 + sv_engineSpritesSpawn 1 (server map ents in snapshots).

set r_spriteProps 1
set cl_engineSprites 1
set sv_engineSprites 1
set sv_engineSpritesSpawn 1

echo "^2[idtech3_demo]^7 Map props: misc_billboard / misc_flipbook / misc_imposter (r_spriteProps 1)"
echo "^2[idtech3_demo]^7 Server spawn: sv_engineSpritesSpawn 1 -> snapshots (r_spritePropsMapParse auto 0)"
echo "^2[idtech3_demo]^7 Networked: modelindex=CS sprite shader index, generic1=radius/4"
echo "^2[idtech3_demo]^7 Console test: sprite_spawn billboard sprites/demo_billboard"
echo "^2[idtech3_demo]^7 Networked spawn: sv_sprite_spawn billboard sprites/demo_billboard"
echo "^2[idtech3_demo]^7 Lua: Engine.Sprites.spawnLocal('billboard','sprites/demo_billboard',0,0,64,48)"
echo "^2[idtech3_demo]^7 Lua listen-server: Engine.Sprites.spawnServer('billboard','sprites/demo_billboard',2,2,8,0,0,64,48)"
echo "^2[idtech3_demo]^7 QVM trap: trap_EngineSpriteSpawn(type, shader, x,y,z, radius, rot, cols, rows, fps)"
