// Engine temporal / spatial upscale (no FSR2/DLSS SDK)
// Latched: needs vid_restart after changing r_upscale / r_renderScale / size.

set r_taa 1
set r_taaMotionVectors 1
set r_upscaleSharpness 0.25

// Spatial blit path (auto internal size ~75% window):
set r_upscale 1
// Temporal upsample (Halton jitter + TAA at internal res, then spatial blit):
// set r_upscale 2

// Optional manual internal size (skip auto when r_renderScale already > 0):
// set r_renderScale 3
// set r_renderWidth 1440
// set r_renderHeight 810

vid_restart
upscale_status
echo "^2[idtech3_demo]^7 Upscale: r_upscale 1 spatial / 2 temporal — upscale_status (docs/RENDERERS.md)"
