// Consistent submodular open-world residency (see docs/WORLD_RESIDENCY.md)
exec demo_openworld.cfg
set r_openWorldResidency 1
set r_openWorldResidencyEpsilon 0.05
set r_openWorldMaxSectors 64
set r_openWorldMaxNavSectors 32
set r_openWorldMaxSpriteSectors 64
set r_openWorldResidencyMaxSwaps 4
set r_openWorldLoadRadius 12288
set r_openWorldUnloadRadius 14336
set r_openWorldResidencyMatroid 0
set r_openWorldResidencyW_dist 1.0
set r_openWorldResidencyW_proc 0.25
set r_openWorldResidencyW_sticky 0.35
set cl_openWorldResidencyNavLocal 0
// Optional: set r_graphStreamReach 1 for k-hop sector-graph candidate filter
set r_graphStreamReach 0
world_residency_status
echo "^2[idtech3_demo]^7 World residency: exec demo_world_residency.cfg — then openworld_start"
echo "^2[idtech3_demo]^7                 world_residency_status / openworld_status"
echo "^2[idtech3_demo]^7                 set r_openWorldResidencyMatroid 1 with r_proc 1 for region budgets"
