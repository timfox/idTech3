// Evans et al. 2019 fog bioaerosol ecology demo (Maine coastal preset)
// Requires Vulkan volumetric fog for auto phase sync (r_fogBiologyAuto 1).
// Combine with demo_features.cfg (r_volumetricFog 1) or enable fog here.

set r_fogBiology 1
set r_fogBiologySite 0
set r_fogBiologyCoastKm 0.03
set r_fogBiologyWindMarine 0.85
set r_fogBiologyAuto 1
set r_volumetricFog 1

echo "^2[idtech3_demo]^7 Fog bioaerosol: fog_biology_paper | fog_biology_genera | fog_biology_poll"
echo "^2[idtech3_demo]^7 Namib preset: exec demo_fog_biology_namib.cfg"
echo "^2[idtech3_demo]^7 Lua: lua_run demo_fog_biology()  (after demo_lua.cfg / script_reload)"

fog_biology_paper

fog_biology_status
