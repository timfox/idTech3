// Box3D samples mirrored: Character / Mover / body casts / kinematic control.

exec demo_physics.cfg
set phys_pmove 1
set phys_stepHeight 18
set phys_debugDraw 1
phys_clear_props

echo "^2[box3d_examples]^7 character_mover: shadow body plus CastMover-style pmove correction"

phys_spawn_static 0 0 0
phys_spawn_heightfield 96 0 0
phys_spawn_compound -96 0 8
phys_spawn_sensor 0 96 32

phys_spawn_shadow 0 0 48
phys_shadow_pose 0 0 64 0 0 0

phys_spawn_box 64 64 48 20
phys_spawn_sphere 96 64 72 12

echo "^2[box3d_examples]^7 move through the scene with phys_pmove 1; use phys_shadow_pose x y z pitch yaw roll to script the mover."
phys_status
