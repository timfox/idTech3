// Box3D-adjacent engine examples: cloth, rope, particles, soft blob, and SPH fluid coupling.

exec demo_physics.cfg
set phys_debugDraw 1
phys_clear_props

echo "^2[box3d_examples]^7 softbody_fluid: engine soft-body companions colliding with Box3D world bodies"

phys_spawn_static 0 0 0
phys_spawn_compound -96 0 8
phys_spawn_heightfield 96 0 0
phys_spawn_buoyancy 0 96 24

phys_spawn_cloth -96 0 144
phys_spawn_rope 0 0 160 0 0 48
phys_spawn_softblob 64 0 96
phys_spawn_particles -32 96 96 64
phys_spawn_fluid 64 96 128 64

echo "^2[box3d_examples]^7 try: phys_solvers fluid off | phys_solvers softblob off | phys_solvers cloth off"
phys_status
