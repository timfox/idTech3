// Box3D samples mirrored: Joints / Distance Joint / Prismatic / Bridge / Ball and Chain.

exec demo_physics.cfg
set phys_debugDraw 1
set phys_motor 1
phys_clear_props

echo "^2[box3d_examples]^7 joints_bridge: distance rope, prismatic motor, and bridge-like chain"

phys_spawn_static 0 0 0
phys_spawn_rope -96 0 144 96 0 64
phys_spawn_rope -96 32 128 96 32 64
phys_spawn_slider 0 -64 32

// Bridge deck approximation: dynamic boxes over static supports.
phys_spawn_static -128 96 0
phys_spawn_static 128 96 0
phys_spawn_box -96 96 40 14
phys_spawn_box -64 96 44 14
phys_spawn_box -32 96 48 14
phys_spawn_box 0 96 52 14
phys_spawn_box 32 96 48 14
phys_spawn_box 64 96 44 14
phys_spawn_box 96 96 40 14

// Ball-and-chain style hanging mass.
phys_spawn_rope 0 160 160 0 160 64
phys_spawn_sphere 0 160 44 16

echo "^2[box3d_examples]^7 try: phys_impulse_sphere 0 96 70 160 600"
phys_status
