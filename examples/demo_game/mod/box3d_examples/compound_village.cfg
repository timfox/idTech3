// Box3D samples mirrored: Compound / Simple / Tile Floor / Mesh Tile / Village.

exec demo_physics.cfg
set phys_debugDraw 1
phys_clear_props

echo "^2[box3d_examples]^7 compound_village: static compound clusters as a tiny collision village"

phys_spawn_static 0 0 0
phys_spawn_compound -128 -64 8
phys_spawn_compound -64 -64 8
phys_spawn_compound 0 -64 8
phys_spawn_compound 64 -64 8
phys_spawn_compound 128 -64 8
phys_spawn_compound -96 48 8
phys_spawn_compound 0 48 8
phys_spawn_compound 96 48 8

phys_spawn_heightfield 0 128 0

phys_spawn_box -128 -64 96 20
phys_spawn_sphere -32 -64 112 12
phys_spawn_box 64 -64 128 20
phys_spawn_sphere 128 -64 144 12
phys_spawn_box 0 48 160 20

echo "^2[box3d_examples]^7 try: phys_impulse_sphere 0 0 96 256 1200"
phys_status
