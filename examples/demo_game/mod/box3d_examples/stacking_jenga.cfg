// Box3D samples mirrored: Stacking / Box Stack / Sphere Stack / Dominoes / Jenga.

exec demo_physics.cfg
set phys_sleep 1
set phys_ccd 1
set phys_debugDraw 1
phys_clear_props

echo "^2[box3d_examples]^7 stacking_jenga: platforms, columns, domino lane, and mixed falling bodies"

// Floor and back stops.
phys_spawn_static 0 0 0
phys_spawn_static 96 0 0
phys_spawn_static -96 0 0
phys_spawn_static 0 96 0

// Box stack.
phys_spawn_box -48 -32 32 20
phys_spawn_box -48 -32 56 20
phys_spawn_box -48 -32 80 20
phys_spawn_box -48 -32 104 20
phys_spawn_box -48 -32 128 20

// Sphere stack.
phys_spawn_sphere 16 -32 40 10
phys_spawn_sphere 16 -32 68 10
phys_spawn_sphere 16 -32 96 10
phys_spawn_sphere 16 -32 124 10

// Domino lane: slim boxes are represented by standard demo boxes for now.
phys_spawn_box -72 40 24 8
phys_spawn_box -48 40 24 8
phys_spawn_box -24 40 24 8
phys_spawn_box 0 40 24 8
phys_spawn_box 24 40 24 8
phys_spawn_box 48 40 24 8

// Jenga-like mixed stack.
phys_spawn_compound 96 16 8
phys_spawn_box 96 16 48 18
phys_spawn_box 112 16 72 18
phys_spawn_box 80 16 96 18
phys_spawn_box 96 16 120 18

echo "^2[box3d_examples]^7 try: phys_impulse_sphere 0 0 80 180 900"
phys_status
