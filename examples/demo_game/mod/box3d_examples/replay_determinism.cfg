// Box3D samples mirrored: Replay / Determinism / Falling Ragdolls.

exec demo_physics.cfg
set phys_debugDraw 1
set phys_record 1
set phys_sleep 1
phys_clear_props

echo "^2[box3d_examples]^7 replay_determinism: deterministic pile plus recording/replay commands"

phys_spawn_static 0 0 0
phys_spawn_box -32 0 96 20
phys_spawn_box 0 0 128 20
phys_spawn_box 32 0 160 20
phys_spawn_sphere -16 32 192 12
phys_spawn_sphere 16 32 224 12
phys_spawn_ragdoll 0 -64 128

phys_record_start
echo "^2[box3d_examples]^7 recording started. Let it run, then: phys_record_stop ; phys_replay_open ; phys_replay_step"
phys_status
