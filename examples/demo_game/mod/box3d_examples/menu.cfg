// idtech3_demo - Box3D sample family launcher
// Load any playable map, then exec one of these scenes.

exec demo_physics.cfg

echo "^2[box3d_examples]^7 sample-family scenes:"
echo "^5  exec box3d_examples/stacking_jenga.cfg^7      - stacking: box stack, dominoes, jenga"
echo "^5  exec box3d_examples/joints_bridge.cfg^7       - joints: distance rope, prismatic motor, bridge"
echo "^5  exec box3d_examples/events_sensors.cfg^7      - events: sensors, hit impulses, contact debug"
echo "^5  exec box3d_examples/continuous_bullets.cfg^7  - continuous: CCD / bullet-vs-stack stress"
echo "^5  exec box3d_examples/compound_village.cfg^7    - compound: static hull clusters and falling props"
echo "^5  exec box3d_examples/character_mover.cfg^7     - character: mover/shadow body and pmove correction"
echo "^5  exec box3d_examples/softbody_fluid.cfg^7      - companions: cloth, rope, particles, soft blob, fluid"
echo "^5  exec box3d_examples/replay_determinism.cfg^7  - replay/determinism recording path"
echo "^2[box3d_examples]^7 helper commands: phys_status | phys_debug | phys_clear_props | phys_dump"
