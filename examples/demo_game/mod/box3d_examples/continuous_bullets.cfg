// Box3D samples mirrored: Continuous / Thin Wall / Bullet vs Stack / Mesh Drop.

exec demo_physics.cfg
set phys_ccd 1
set phys_debugDraw 1
phys_clear_props

echo "^2[box3d_examples]^7 continuous_bullets: CCD stack with thin-wall and projectile-style impulses"

phys_spawn_static 0 0 0
phys_spawn_static 128 0 32
phys_spawn_heightfield -128 0 0

phys_spawn_box 96 0 48 16
phys_spawn_box 96 0 72 16
phys_spawn_box 96 0 96 16
phys_spawn_box 96 0 120 16
phys_spawn_box 96 0 144 16

phys_spawn_sphere -128 0 80 8
phys_spawn_sphere -160 0 96 8
phys_spawn_sphere -192 0 112 8

// Repeated impulses emulate the sample app's fast projectile stress path.
phys_impulse_sphere -160 0 96 96 1200
phys_set_continuous 1 1

echo "^2[box3d_examples]^7 try more shots: phys_impulse_sphere -160 0 96 140 1800"
phys_status
