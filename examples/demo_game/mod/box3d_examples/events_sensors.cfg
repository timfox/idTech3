// Box3D samples mirrored: Events / Sensor Visit / Hit / Move / Persistent Contact.

exec demo_physics.cfg
set phys_events 1
set phys_debugDraw 1
set phys_hitThreshold 1
phys_clear_props

echo "^2[box3d_examples]^7 events_sensors: trigger volume, hit events, and contact-rich falling props"

phys_spawn_static 0 0 0
phys_spawn_sensor 0 0 32
phys_spawn_buoyancy 96 0 24

phys_spawn_box -64 0 96 20
phys_spawn_box -32 0 128 20
phys_spawn_sphere 0 0 160 12
phys_spawn_sphere 32 0 192 12
phys_spawn_box 64 0 224 20

// Contact-persistence stack.
phys_spawn_box 0 96 32 25
phys_spawn_box 0 96 56 25
phys_spawn_box 0 96 80 25

echo "^2[box3d_examples]^7 try: phys_impulse_sphere 0 0 64 128 900 ; phys_dump"
phys_status
