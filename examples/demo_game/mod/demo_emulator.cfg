// In-engine OS sandbox demo (requires emulator build: ./scripts/compile_engine.sh vulkan emulator)
set cl_emulator 1
set r_emulatorScreen 1
set cl_emulator_drawHud 1
set cl_emulator_width 640
set cl_emulator_height 480

echo "Starting QEMU guest (test pattern until fork exports shm)..."
emulator_start
emulator_status

echo "Toggle keyboard capture: emulator_capture 1  (ESC releases)"
echo "Map authors: apply shader emulator_screen on monitor surfaces"
