// One material fixture, rendered through every production material owner.
// Tier B capture replaces the README slot in tests/data/golden/material_parity
// with the five named screenshots produced here.

set cl_renderer vulkan
set r_fbo 1
set r_hdr 2
set r_tonemap 3
set r_filmGrain 0
set r_chromaticAberration 0
set r_filmLook 0
set r_taa 0
set r_taaMotionVectors 0
set r_gbufferCompact 0
set r_materialBlend 1
set r_forwardPlus 1
set r_deferredLighting 0
set r_oit 0
set r_ssr 0
set r_rtx 0
map rtest_parity
wait 3
screenshot material_parity_forward

set r_renderMode 1
set r_deferredLighting 1
vid_restart
wait 3
screenshot material_parity_deferred

set r_renderMode 3
set r_deferredLighting 0
set r_oit 1
vid_restart
wait 3
screenshot material_parity_wboit

set r_oit 0
set r_ssr 1
vid_restart
wait 3
screenshot material_parity_ssr

set r_ssr 0
set r_rtx 1
set r_rtxDemo 1
vid_restart
wait 3
screenshot material_parity_rtx
quit
