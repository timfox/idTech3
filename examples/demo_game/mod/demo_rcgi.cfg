// Radiance Cache GI demo — spatial-hash cache + cascaded probes + Hybrid1 fusion.
// Requires: ./scripts/compile_engine.sh vulkan rtx
// Then: exec demo_rcgi.cfg ; vid_restart
// Console: rcgi_status

seta r_fbo 1
seta r_hdr 1
seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_rtxEntities 1

seta r_rcgi 1
seta r_rcgi_quality 1
seta r_rcgi_rays 32
seta r_rcgi_cellSize 0.25
seta r_rcgi_strength 0.85
seta r_rcgi_hybrid1Fusion 1
seta r_rcgi_debug 0

// Optional: Hybrid1 for shadow/spec + RcGI diffuse fusion
seta r_hybrid1 1
seta r_rtxDemo 1

echo "[RcGI] demo_rcgi.cfg applied — vid_restart to latch r_rcgi / r_hybrid1"
