// Evans et al. 2019 — Namib inland fog bioaerosol preset (50 km from coast)
// Compare with demo_fog_biology.cfg (Maine coastal) via fog_biology_compare

set r_fogBiology 1
set r_fogBiologySite 1
set r_fogBiologyCoastKm 50
set r_fogBiologyWindMarine 0.7
set r_fogBiologyAuto 1
set r_volumetricFog 1

echo "^2[idtech3_demo]^7 Fog bioaerosol (Namib inland): fog_biology_status | fog_biology_compare"

fog_biology_status
