// Optional Vulkan tuning for Quake III Arena / OpenArena-style .pk3 mods.
// Copy into your gamedir (e.g. baseq3/) or run: +exec q3_vulkan_compat
//
// Does not change gameplay; only renderer cvars for classic content on Vulkan.

seta cl_renderer "vulkan"
seta r_fbo "1"

// Conservative preset for Q3A / OpenArena QVM maps (disables heavy Vulkan features):
// seta r_classicMod "1"
// Or in console: classic_mod ; vid_restart

// Vanilla Q3A BSP lightmaps are usually linear (default 0).
// Mod maps built with q3map2 -gamma may need (applies on next frame; rebuilds pipelines):
// seta r_lightmap_srgb_decode "1"

// If the screen is black, solid color, or UI is wrong after vid_restart, try in order:
// seta r_exposure_auto "0"
// seta r_volumetricFog "0"
// seta r_fbo "0"
//
// HDR scene brightness (does not rescale dynamic lights when r_hdr is on):
// seta r_exposure_auto "1"
// seta r_exposure "1.0"

// Last resort parity check vs stock look:
// seta cl_renderer "opengl"
