// Classic Quake III / OpenArena Vulkan preset (no gameplay changes).
// Copy into your gamedir or run from repo: +exec q3_classic_mod
// Equivalent to: classic_mod ; vid_restart

seta r_classicMod "1"
seta cl_renderer "vulkan"
seta r_fbo "1"

seta r_volumetricFog "0"
seta r_ssao "0"
seta r_bloom "0"
seta r_ext_smaa "0"
seta r_ssr "0"
seta r_sharpen "0.0"
seta r_exposure_auto "0"
seta r_fogFluid "0"
seta r_forwardPlus "0"
seta r_rtx "0"
seta r_rtxDemo "0"
seta r_rtxEntities "0"
seta r_vdbFog "0"
seta r_vdb "0"
seta r_vegWind "0"

seta cl_flux_enable "0"
seta cl_trellis_enable "0"
seta cl_spec_energy_enable "0"
