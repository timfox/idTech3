// Conservative Vulkan post/FBO path for Quake III / OpenArena troubleshooting.
// Use after black screen or solid-color framebuffer issues (before r_fbo 0).
// Apply: +exec examples/q3_fbo_safe then vid_restart

seta r_exposure_auto 0
seta r_volumetricFog 0
seta r_ssao 0
seta r_bloom 0
seta r_ext_smaa 0
seta r_ssr 0
seta r_oit 0
seta r_fogFluid 0
seta r_fboCinematic 0

echo "q3_fbo_safe: conservative post path applied — run vid_restart"
