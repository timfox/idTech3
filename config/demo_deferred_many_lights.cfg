// Demo: deferred clustered lighting with many dynamic lights.
// Usage: load any map, then exec demo_deferred_many_lights.cfg.

// devmap/exec can arrive while the client is still completing map startup.
// Let that settle before applying the latched renderer profile.
wait 120

seta r_fbo 1
seta r_hdr 2
seta r_pbr 1
seta r_textureMode GL_LINEAR_MIPMAP_LINEAR
// OpenArena's compatibility profile restores classic lighting on map load;
// disable it so opaque surfaces can become deferred-owned.
seta r_classicLighting 0
seta cl_autoGraphicsProfile 0

seta r_renderMode 3
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusDepthCull 1
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1
seta r_forwardPlusMaxPerTile 8
seta r_forwardPlusOverflowShade 1

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_gbufferQuality 2
seta r_ext_multisample 0
seta r_deferredLighting 1
seta r_deferredArchitecture 2
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredLightmapMode 1

seta r_dynamiclight 1
seta r_dlightMode 1
seta r_dlightScale 1
seta r_dlightIntensity 1
seta r_dlightSaturation 1

seta r_deferredLightDemo 1
seta r_deferredLightDemoCount 64
seta r_deferredLightDemoRadius 420
seta r_deferredLightDemoDistance 520
seta r_deferredLightDemoEnergy 1.25
seta r_deferredLightDemoAnimate 1

// The OpenArena compatibility profile can restore legacy SSAO/AV ownership.
// Deferred lighting owns the material AO contract in this demo; leave one AO
// owner active so the G-buffer path is not soft-failed during restart.
seta r_ssao 0
seta r_ambientVisibilityMode 0

// Keep the default capture a clean lighting view. Opt into occupancy or
// z-slice proof with: set r_forwardPlusDebug 0.35 (or 2/6).
seta r_forwardPlusDebug 0
seta r_deferredGBufferDebug 0
seta r_taa 0
seta r_oit 0

echo "^2[deferred-many-lights]^7 64 renderer-owned moving dlights enabled. Run: deferred_many_lights_status; deferred_status; cluster_status"

// Apply the latched mode and allow the rebuilt renderer to render a few frames
// before status/capture commands are issued.
vid_restart keep_window
wait 12
// The QVM auto-profile runs during vid_restart; reassert deferred ownership
// after that profile has finished initializing.
set r_classicLighting 0
