// Dark weapon in a bright scene: exposure metering must not crush the weapon,
// and world bloom must not bleed into the weapon silhouette.
echo "^3[validation] dark weapon / bright scene: raised exposure, combined bloom"
set r_bloom 1
set r_weaponBloomMode 1
set r_exposure 1.6
set r_temporalDebug 0
echo "^3[validation] face bright sky/light; check weapon edges (r_temporalDebug 26 = weapon validity)"
