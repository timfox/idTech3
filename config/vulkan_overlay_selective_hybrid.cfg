// Spine 1.2 Tier B — Selective Hybrid (opt-in; does NOT change boot defaults).
// Rasterized clustered visibility/materials remain primary.
// Hybrid1 supplies exclusive RT signal owners (shadow/spec) with raster fallbacks.
// No frame generation. No intentional presentation latency.
// Requires USE_VULKAN_RTX build + RTX-capable GPU.
// Use: exec vulkan_overlay_selective_hybrid.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg
// See docs/RENDERER_SPINE_1.2.md

exec modern_clustered.cfg

seta r_renderMode 4

// Selective Hybrid1 channels — exclusive owners, not full PT overlay
seta r_hybrid1 1
seta r_rtx 1
seta r_rtxDemo 1
seta r_hybrid1Quality 2
seta r_hybrid1_shadow 1
seta r_hybrid1_spec 1
seta r_hybrid1_diffuse 0
seta r_selectiveRayTracing 1
seta r_selectiveShadowBudget 1
seta r_selectiveReflectionBudget 1
seta r_selectiveHeroObjectBudget 8
seta r_selectiveRaysPerPixelBudget 1
seta r_hybrid1_taa 0
seta r_pathtrace 0

// Keep certified AA/AO policy unless overlaying temporal separately
seta r_taa 0
seta r_aaMode 2
seta r_presentAdaptiveRecon 0

echo "[renderer] Spine 1.2 Tier B Selective Hybrid (r_renderMode 4 + Hybrid1 shadow/spec). Run vid_restart. Recovery: exec modern_vulkan.cfg"
