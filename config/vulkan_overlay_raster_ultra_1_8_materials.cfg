// Raster Ultra 1.8 — Material Authoring 2.0 + surface evolution (opt-in).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Classic Q3 shaders remain default ownership until r_materialIR / r_surfaceEvolution.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_8_materials.cfg; vid_restart
// Recovery: seta r_materialIR 0; seta r_materialGraph 0; seta r_materialInstance 0; seta r_surfaceEvolution 0; vid_restart
// See docs/RASTER_ULTRA_1.8.md

seta r_materialIR 1
seta r_materialGraph 1
seta r_materialInstance 1
seta r_materialCache 1
seta r_surfaceEvolution 1
seta r_surfaceWetness -1
seta r_surfaceSnow -1
seta r_surfaceDust 0
seta r_surfaceRust 0
seta r_surfaceSoot 0
seta r_surfaceMoss 0
seta r_surfaceDamage 0
seta r_surfaceDebug 0

// Keep existing PBR / height-blend / POM paths alive
seta r_materialBlend 1
seta r_pbr 1

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

echo "[renderer] Raster Ultra 1.8 materials: IR + controlled graph + instances + cache + surface evolution (RT=off FG=off)"
