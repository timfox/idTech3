// Vulkan overlay: production visibility-buffer foundation on Unified Clustered.
// Compact ID/bary buffer + material classify; kept as an explicit re-apply/debug overlay.
// Use: exec vulkan_overlay_visibility_2027.cfg; vid_restart
//
// See docs/RENDERER_2027.md. Shipping default modern_vulkan.cfg already enables this path.

exec vulkan_overlay_unified_clustered.cfg

seta r_visibilityBuffer 1
seta r_visibilityBufferFill 2
seta r_visibilityBufferDebug 0
seta r_materialClassify 1
seta r_deferredMaterialClassify 1

// Prefer non-MSAA so G-buffer + PrimID MRT export feeds classify/debug.
seta r_ext_multisample 0

echo "[renderer] production visibility foundation: mode 3 + PrimID MRT (fill=2) + classify + deferred consumer"
