// Vulkan overlay: 2027 visibility-buffer foundation on Unified Clustered.
// GPU-driven hybrid visibility Phase 1: compact ID/bary buffer + material classify.
// Use: exec vulkan_overlay_visibility_2027.cfg; vid_restart
//
// See docs/RENDERER_2027.md. Shipping default remains modern_vulkan.cfg (mode 2).

exec vulkan_overlay_unified_clustered.cfg

seta r_visibilityBuffer 1
seta r_visibilityBufferFill 1
seta r_visibilityBufferDebug 0
seta r_materialClassify 1

// Prefer non-MSAA so G-buffer material export feeds classify.
seta r_ext_multisample 0

echo "[renderer] 2027 visibility foundation: mode 3 + vis buffer + material classify"
