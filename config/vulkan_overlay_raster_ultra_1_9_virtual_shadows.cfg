// Raster Ultra 1.9 — Virtualized raster shadows (opt-in).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Certified CSM remains the default sun sample path (r_vshadowFallbackCsm 1).
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_9_virtual_shadows.cfg; vid_restart
// Recovery: seta r_vshadow 0; vid_restart
// See docs/RASTER_ULTRA_1.9.md

seta r_vshadow 1
seta r_vshadowPageSize 256
seta r_vshadowPoolPages 64
seta r_vshadowClipmapLevels 4
seta r_vshadowBasePageWorld 512
seta r_vshadowFallbackCsm 1
seta r_vshadowAlphaCasters 1
seta r_vshadowRenderBudget 8
seta r_shadowPageRequestBudget 64
seta r_shadowLocalLightBudget 8
seta r_shadowCasterDrawBudget 200000
seta r_vshadowDebug 0

// Keep certified sun CSM alive for sampling
seta r_pbrSunShadow 1
seta r_sunShadowCascades 4
seta r_sunShadowStable 1

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0

echo "[renderer] Raster Ultra 1.9 virtual shadows: page table + physical pool + clipmap demand; CSM fallback (RT=off FG=off)"
