// Modern Vulkan default: Unified Clustered (deferred opaque + Forward+ transparent).
// Same spine as modern_clustered.cfg. Recovery: renderer_clustered_safe / renderer_modern_safe.
// Latched cvars need vid_restart after first enable.

seta r_fbo 1
seta r_hdr 2
seta r_pbr 1
seta r_materialBlend 1

seta r_renderMode 3
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusMaxPerTile 8
seta r_forwardPlusLuminanceSort 1
seta r_forwardPlusDistanceSort 0
seta r_forwardPlusDepthCull 1
seta r_forwardPlusSpecularStrength 0.65
seta r_forwardPlusEnergyRenorm 0
seta r_forwardPlusOverflowShade 1
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1

// Direct G-buffer material/AO export requires MSAA off (MSAA uses depth fallback).
seta r_ext_multisample 0

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

// Material classify + deferred consumer (energy-calibrated; needs visibility buffer).
seta r_visibilityBuffer 1
seta r_visibilityBufferFill 2
seta r_materialClassify 1
seta r_deferredMaterialClassify 1

// Mode 3 + TAA: enable with motion vectors (HUD stays in UI overlay outside TAA history).
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalCpuSkinPrev 1

seta r_tonemap 3
seta r_post 1
seta r_grade_exposureBias 0
seta r_grade_temperature 0
seta r_grade_tint 0
seta r_grade_contrast 1
seta r_grade_saturation 1
seta r_grade_vibrance 0
seta r_grade_hue 0
seta r_post_contrast 1
seta r_post_saturation 1

seta r_ext_smaa 0
seta r_postAaAfterBloom 0
