// Modern Clustered profile: Unified Clustered Renderer (r_renderMode 3).
// Inherits modern_vulkan.cfg, then switches opaque to deferred + transparent Forward+.
// Use: exec modern_clustered.cfg; vid_restart
// Safer debugging: renderer_clustered_safe (disables TAA/SMAA/FXAA/OIT).
// See docs/UNIFIED_CLUSTERED_RENDERER.md.

exec modern_vulkan.cfg

seta r_renderMode 3
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusDepthCull 1
seta r_forwardPlusOverflowShade 1
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1

// Reassert RT-off (Raster Ultra / clustered must not inherit accidental RT from overlays)
seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredArchitecture 2
seta r_gbufferQuality 2
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

// Direct G-buffer MRT export (MSAA forces depth-derived fallback).
seta r_ext_multisample 0

// Mode 3 + SMAA baseline (inherits r_aaMode 2 from modern_vulkan.cfg).
seta r_aaMode 2
seta r_taa 0
seta r_taaMotionVectors 1
seta r_ext_smaa 1

// Production WBOIT for clustered transparent handoff (not MBOIT).
seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 0

echo "[renderer] modern_clustered.cfg: Unified Clustered (r_renderMode 3) + WBOIT (r_oit 1), SMAA baseline"
