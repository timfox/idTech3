// Weapon emissive presentation: emissive weapon surfaces must feed the single
// combined-HDR bloom exactly once (no double bloom, no missing weapon bloom).
echo "^3[validation] weapon emissive: combined-HDR bloom, r_weaponBloomMode 1"
set r_bloom 1
set r_weaponBloomMode 1
set r_exposure 1.0
set r_temporalDebug 0
echo "^3[validation] inspect weapon glow; then: r_temporalDebug 27 (coverage), r_dumpTemporalState"
