// Raster Ultra 1.6 — GPU-driven geometry overlay (opt-in).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_6_geometry.cfg; vid_restart
// Recovery: seta r_gpuScene 0; seta r_hiZ 0; seta r_meshlets 0; vid_restart
// See docs/RASTER_ULTRA_1.6.md

seta r_gpuScene 1
seta r_gpuSceneCull 1
seta r_gpuSceneIndirect 1
seta r_gpuSceneWorldType 0
seta r_gpuSceneHlod 0
seta r_gpuSceneLodHysteresis 1

seta r_hiZ 1
seta r_hiZMinVisibleFrames 2
seta r_hiZLargeObjectPx 256

seta r_meshlets 1
seta r_meshletsCompact 1
seta r_meshletsMdi 1
seta r_meshletsMdiDraw 1
seta r_meshletsLod 1
seta r_meshletsLodPixels 2

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

// Keep certified presentation unless user also execs adaptive recon overlay
// seta r_aaMode 2

echo "[renderer] Raster Ultra 1.6 geometry: gpuScene+HiZ+meshlets (classic BSP worldType=0). FG=off RT=off"
