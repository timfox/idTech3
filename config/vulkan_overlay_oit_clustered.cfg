// Overlay: Unified Clustered (mode 3) + production WBOIT + optional stochastic alpha.
// Opaque deferred + WBOIT lit accumulation/resolve after deferred composite.
// Use: exec vulkan_overlay_oit_clustered.cfg; vid_restart
//
// MBOIT: use vulkan_overlay_mboit.cfg / modern_vulkan_experimental.cfg (experimental).
// See docs/UNIFIED_CLUSTERED_RENDERER.md and docs/MOMENT_OIT_STOCHASTIC_ALPHA.md.

exec vulkan_overlay_unified_clustered.cfg

seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 0
seta r_ext_multisample 0

// Optional coverage for foliage / grates / hair cards (no vid_restart needed):
// seta r_stochasticAlpha 2
// seta r_taa 1

echo "[renderer] Unified Clustered + WBOIT (r_renderMode 3, r_oit 1) — glass/smoke/particles after deferred"
