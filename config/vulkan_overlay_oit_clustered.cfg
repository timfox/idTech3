// Overlay: Unified Clustered (mode 3) + Moment OIT + optional stochastic alpha.
// Opaque deferred + Forward+ transparent, with MBOIT resolve after deferred composite.
// Use: exec vulkan_overlay_oit_clustered.cfg; vid_restart
//
// Shipping default remains modern_vulkan.cfg (r_renderMode 2). See docs/UNIFIED_CLUSTERED_RENDERER.md
// and docs/MOMENT_OIT_STOCHASTIC_ALPHA.md.

exec vulkan_overlay_unified_clustered.cfg

seta r_fbo 1
seta r_oit 2
seta r_ext_multisample 0

// Optional coverage for foliage / grates / hair cards (no vid_restart needed):
// seta r_stochasticAlpha 2
// seta r_taa 1

echo "[renderer] Unified Clustered + MBOIT (r_renderMode 3, r_oit 2) — glass/smoke/particles after deferred"
