// Minimal recovery profile: Forward+ HDR/PBR, no post AA, no OIT, no GTAO extras.
// Use after a bad experiment: exec gfx_safe.cfg; vid_restart
// Then: input_status   (confirm mouse relative/grab)

seta r_fbo 1
seta r_hdr 2
seta r_pbr 1
seta r_renderMode 2
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusDepthCull 1
seta r_ext_multisample 0

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 0

seta r_ambientVisibilityMode 0
seta r_ssao 0

seta r_visibilityBuffer 0
seta r_materialClassify 0

seta r_aaMode 0
seta r_taa 0
seta r_taaMotionVectors 0
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0

seta r_oit 0
seta r_stochasticAlpha 0
seta r_bloom 0
seta r_ssr 0
seta r_volumetricFog 0
seta r_exposure_auto 0

seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_openWorld 0
seta r_district 0

seta in_mouse 1
seta in_nograb 0

echo "[renderer] gfx_safe.cfg: minimal Forward+ recovery (AA/OIT/bloom/RT off). Run input_status after vid_restart."
