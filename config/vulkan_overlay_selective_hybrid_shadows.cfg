// Selective Hybrid Shadows 1.0 — opt-in profile (does NOT change boot defaults).
// Target stack:
//   mode 3 Unified Clustered (via modern_clustered) + Selective Hybrid mode 4 latch
//   raster primary visibility + clustered direct lighting
//   RT sun-shadow visibility (exclusive owner)
//   raster local-light shadows
//   GTAO / lightmaps+SH/IBL / optional WBOIT / SMAA
//   weapon outside temporal histories / UI after tonemap
// Requires USE_VULKAN_RTX + rayQuery or Hybrid1 RT pipeline + TLAS.
// Use: exec vulkan_overlay_selective_hybrid_shadows.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg
// See docs/SELECTIVE_HYBRID_SHADOWS_1.0.md

exec modern_clustered.cfg

seta r_renderMode 4
seta r_selectiveHybridSunShadow 1
seta r_havenrpSunShadowOwner auto

// Hybrid1 supplies RT sun visibility only (no RT reflections / GI this milestone)
seta r_hybrid1 1
seta r_rtx 1
seta r_rtxDemo 1
seta r_hybrid1Quality 2
seta r_hybrid1_shadow 1
seta r_hybrid1_spec 0
seta r_hybrid1_diffuse 0
seta r_hybrid1_dlightShadows 0
seta r_hybrid1_taa 0
seta r_pathtrace 0

// Raster sun cascade must not co-own when RT is healthy (router also gates)
seta r_pbrSunShadow 1

// Certified presentation companions
seta r_taa 0
seta r_aaMode 2
seta r_gtao 1
seta r_oit 0
seta r_presentAdaptiveRecon 0

echo "[renderer] Selective Hybrid Shadows 1.0 (RT sun only + raster locals). Run vid_restart. Recovery: exec modern_vulkan.cfg"
echo "[renderer] Debug: r_shsDebug 1..11 | shs_status | havenrp_renderer_status"
