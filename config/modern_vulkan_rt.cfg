// RT / Hybrid1 quality tier. Requires RTX build + capable GPU.
// Use: exec modern_vulkan_rt.cfg; vid_restart
// Falls back gracefully when RTX features are unavailable.

exec modern_vulkan_quality.cfg

seta r_hybrid1 1
seta r_rtx 1
seta r_rtxDemo 1
seta r_surfelGi 1
seta r_surfelGiDensity 2
seta r_surfelGi_hybrid1Fusion 1
seta r_hybrid1Quality 2
seta r_hybrid1_taa 0
seta r_taa 0
seta r_aaMode 2

echo "[renderer] modern_vulkan_rt.cfg: quality + Hybrid1/RTX demo + default Surfel GI fusion (SMAA present; no world TAA)"
