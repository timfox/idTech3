// Performance Temporal Reconstruction: r_aaMode 4 + internal render scale.
// No post-recon SMAA. Pair with upscale/renderScale for cost savings.
// Use: exec vulkan_overlay_temporal_perf.cfg

seta r_aaMode 4
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalCpuSkinPrev 1
seta r_temporalHistoryWeight 0.75
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalSmaaCleanup 0
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0
seta r_renderScale 3
seta r_upscale 2
seta r_taa_feedbackStationary 0.85
seta r_taa_feedbackMotion 0.62
seta r_taa_sharpen 0.18

echo "[renderer] Temporal Reconstruction perf (r_aaMode 4) + r_renderScale 3 / r_upscale 2"
