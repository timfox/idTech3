// Installed as release/surf/autoexec.cfg. This bootstrap runs after archived
// config.cfg and before renderer creation, ensuring surf.cfg's resources exist
// during R_Init.
//
// Surf camera speeds routinely exceed 400–600 u/s. Temporal Reconstruction
// (r_aaMode 4 / r_taa 1) leaves residual shading and multi-silhouette echoes
// on world geometry (ramps, AZ decals) at those speeds. Default to SMAA.
// Opt-in: exec surf_temporal_quality.cfg (then verify r_temporalDebug 32).
seta r_fbo 1
seta r_aaMode 2
seta r_taa 0
seta r_tsr 0
seta r_taaMotionVectors 0
seta r_temporalSSR 0
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalWeaponAfterTaa 1
seta r_weaponTemporalMode 1
seta r_weaponSsrIsolation 1
seta r_weaponBloomMode 1
// Bloom is latched and must be enabled before renderer initialization.
seta r_bloom 1
seta r_bloom_threshold 1.0
seta r_bloom_intensity 0.5
seta r_bloomKnee 0.5
seta r_bloomThresholdEVRelative 1
seta cg_fov 90
seta r_firstPersonFovEnabled 1
seta r_firstPersonScaleEnabled 1
seta r_firstPersonFov 65
seta r_firstPersonScale 1.0
seta r_firstPersonZNear 4
seta com_nativeLibraryExtractPk3 0
