// Deterministic OIT corruption repro — NOT boot default.
// Recovery: exec modern_vulkan.cfg; vid_restart
//
// Must live under fs_game (release/openarena/ or release/base/) — not only repo config/.
// Launch (preferred):
//   ./scripts/repro_oit_corruption.sh
// Or in-console after map load:
//   exec repro_oit_corruption.cfg
//   vid_restart keep_window
//
// After map load: oit_status ; walk to water/glass with weapon visible.
// Isolation matrix (console; enable cheats first for debug views):
//   seta sv_cheats 1
//   1) seta r_oit 0
//   2) seta r_oit 1; seta r_oitForwardPlus 0; seta r_oitClassify 0
//   3) seta r_oitClassify 1
//   4) seta r_oitForwardPlus 1
//   5) seta r_oitDirectTest 1|2
//   6) cg_drawGun 0 / 1
//   7) oit_capture stages ; oit_status
//   8) r_oitDebug 14|15
//   9) seta r_distortion 0
// Odd extents: r_renderWidth/Height 1279 719 | 1365 767 | 1601 901 + vid_restart

// Avoid Unpure reconnect storms after vid_restart.
// sv_pure is LATCHED — in-console seta alone is not enough; launch with +set sv_pure 0
// (see scripts/repro_oit_corruption.sh) or: disconnect; seta sv_pure 0; map <map>
seta sv_pure 0
seta net_p2p 0

exec demo_oit_isolation.cfg

seta r_havenrpProfile "oit_corruption_repro"
seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
// r_oitDebug / r_oitDirectTest are CVAR_CHEAT — set after sv_cheats 1, not here.
seta r_refractiveExcludeOit 1
seta r_taa 0
seta r_aaMode 2
seta r_bloom 0
seta r_eyeAdapt 0
seta r_distortion 0
seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_spineValidate 1

echo "[renderer] repro_oit_corruption.cfg: WBOIT classify+Forward+ TAA=off bloom=off sv_pure=0. Run oit_status. NOT boot default."
