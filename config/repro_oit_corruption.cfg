// Deterministic OIT corruption repro — NOT boot default.
// Recovery: exec modern_vulkan.cfg; vid_restart
//
// Must live under fs_game (release/openarena/ or release/base/) — not only repo config/.
// Launch:
//   ./scripts/repro_oit_corruption.sh
//   or: exec repro_oit_corruption.cfg; vid_restart
//
// After map load: oit_status ; walk to water/glass with weapon visible.
// Optional camera bookmark (fill after capturing viewpos on a failing run):
//   // setviewpos <x> <y> <z> <yaw>
//
// Isolation matrix (console):
//   1) seta r_oit 0
//   2) seta r_oit 1; seta r_oitForwardPlus 0; seta r_oitClassify 0
//   3) seta r_oitClassify 1
//   4) seta r_oitForwardPlus 1
//   5) seta r_oitDirectTest 1   (clear+resolve only)
//   5b) seta r_oitDirectTest 2  (synthetic UV gradient composite)
//   6) cg_drawGun 0 / 1
//   7) oit_capture context | oit_status
//   8) r_oitDebug 14 (constant×coverage) | 15 (FragCoord UV)
//   9) seta r_distortion 0   (if bands remain after OIT-only)
// Odd extents: r_renderWidth/Height 1279 719 | 1365 767 | 1601 901 + vid_restart

exec demo_oit_isolation.cfg

seta r_havenrpProfile "oit_corruption_repro"
seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
seta r_oitDebug 0
seta r_oitDirectTest 0
seta r_refractiveExcludeOit 1
seta r_taa 0
seta r_aaMode 2
seta r_bloom 0
seta r_eyeAdapt 0
seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_spineValidate 1

echo "[renderer] repro_oit_corruption.cfg: WBOIT classify+Forward+ TAA=off bloom=off. Run oit_status. NOT boot default."
