// Direct-UDP P2P overlay (no Steam required)
set net_p2p 1
set net_p2pBackend direct_udp
set net_p2pIceChecks 1
set net_p2pIceDeferConnect 1
set net_p2pPunch 1
set net_p2pStun 1
set net_p2pStunAutoAdvertise 1
set net_p2pHostAdvertise 1
set cl_p2pAutoReconnect 1
set cl_p2pBackupHost 1
echo "^3[P2P]^7 direct_udp overlay: p2p_address / p2p_candidates / p2p_connect udp:host:port"
