// Canonical shipping profile copied to release/surf/surf.cfg by compile_engine.
// Keep the installed copy explicit: Surf must not depend on renderer defaults.

seta cl_builtInTtfConsole 1
seta cl_builtInTtf 1
seta r_sdfEnable 1
seta r_classicLighting 1
seta r_pbr 1
seta r_fbo 1

// Temporal Weapon Resolve — normal Surf path.
seta r_aaMode 4
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalWeaponAfterTaa 1
seta r_weaponTemporalMode 1
seta r_weaponSsrIsolation 1
seta r_weaponBloomMode 1
seta r_bloom 1

seta r_ssr 1
seta r_pbrSunShadow 1
seta r_forwardPlusOverflowShade 0
seta r_shWorldLighting 1
seta cg_fov 90
seta r_firstPersonFovEnabled 1
seta r_firstPersonScaleEnabled 1
seta r_firstPersonFov 65
seta r_firstPersonScale 1.0
seta r_firstPersonZNear 4

set cl_physicsEnabled 0
set cl_engineSprites 0
set r_spriteProps 0
set cl_navEnabled 0
set cl_particlesEnabled 0
set g_ecsMotion 0
set r_openWorld 0
set cl_openWorldSync 0
set r_bspStream 0
set cm_stream 0
set cm_streamMerge 0
set cm_openWorldCollision 0
set r_volumetricFog 0
set r_district 0
seta sv_engineSprites 0
seta sv_engineSpritesSpawn 0
seta sv_engineDecals 0
seta sv_engineDecalsSpawn 0
seta sv_openWorld 0
seta r_imgui 0
seta r_studio_tools 0
seta cl_freelook 1

seta g_surfEnable 1
seta sv_accelerate 5
seta sv_airaccelerate 300
seta sv_airmove 1
seta g_surfAirWishSpeedCap 30
seta g_surfAutoBunnyHop 0
seta g_speed 320
seta sv_gravity 800
seta mp_roundtime 999
seta pmove_fixed 1
seta pmove_msec 10
seta pmove_float 1
seta phys_enabled 0
seta phys_character 0
seta dmflags 8
seta fraglimit 0
seta timelimit 0
seta g_doWarmup 0
seta cg_drawSpeed 2

seta cg_surfHud 1
seta cg_surfHudScale 1.0
seta cg_surfHudOpacity 1.0
seta cg_surfHudInput 1
seta cg_surfHudChat 1
seta cg_surfHudProgress 1
seta cg_surfHudSync 1
seta cg_surfHudSafeArea 0.95
seta cg_surfHudDebug 0
seta r_font fonts/Inter-Surf.ttf
seta r_fontAtlasSize 1024
seta r_fontMipmap 1
seta r_fontKerning 1
seta r_fontShadow 1
reloadTtf
js_reload ui/surf/hud.js
