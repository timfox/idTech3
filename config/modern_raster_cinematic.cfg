// Raster Ultra 2.1 — Spatial-First Cinematic candidate (Slice A).
// NOT the boot default. Recovery: exec modern_vulkan.cfg; vid_restart
// Use: exec modern_raster_cinematic.cfg; vid_restart
// See docs/RASTER_ULTRA_2.1.md
//
// Slice A ownership: current-frame spatial AA (frequency-aware + adaptive SS + SMAA).
// TAA off. RT off. No frame generation. Mode 3 deferred opaque preserved via clustered base.

exec modern_raster_ultra_2.cfg

seta r_havenrpProfile "raster_cinematic"
seta r_rasterUltra 1
seta r_spatialAa 1
seta r_spatialAaTier 3
seta r_spatialAaClassify 1
seta r_spatialAaAdaptiveSS 1
seta r_spatialAaSelectiveMsaa 0
seta r_spatialAaRisk 0.18
seta r_spatialAaBudget 0.85
seta r_spatialAaSharpen 0.35
seta r_spatialAaDebug 0

// --- Frequency-aware moiré foundation (highest no-TAA defect) ---
seta r_frequencyAware 1
seta r_frequencyTier 3
seta r_frequencySpecularAA 1
seta r_frequencyAlphaCoverage 1
seta r_frequencyProceduralCutoff 1
seta r_frequencyWaterCutoff 1
seta r_frequencyShadowDecorrelate 1
seta r_frequencySelectiveSS 1
seta r_frequencyStochastic 0
seta r_frequencyMipBiasFloor 0.0
seta r_materialAnisotropyMax 16
seta r_normalMapAnisotropy 1
seta r_ext_texture_filter_anisotropic 1
seta r_ext_max_anisotropy 16
seta r_mipLodBias 0
seta r_pbr_specularAA 1
seta r_pbr_specularAAStrength 1.0

// --- AA contract: SMAA residual + adaptive SS; never aaMode 3–5 ---
seta r_aaMode 2
seta r_taa 0
seta r_smaa_preset 3
seta r_ext_multisample 0
seta r_msaa_sample_shading 0

// --- Explicit temporal / RT lock ---
seta r_havenrpTemporalOwner "none"
seta r_havenrpAaOwner "spatial_aa"
seta r_hybrid1 0
seta r_hybrid1_taa 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_grtx 0
seta r_wpt 0
seta r_fsa 0

// Spine validation for candidate soak
seta r_spineValidate 1

echo "[renderer] modern_raster_cinematic.cfg: Raster Ultra 2.1 Slice A CANDIDATE (spatial AA, freq-aware, SMAA, TAA=0, RT=0). Not boot default. vid_restart required."
