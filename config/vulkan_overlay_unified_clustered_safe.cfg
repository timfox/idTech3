// Vulkan overlay: Unified Clustered Renderer safe baseline.
// Use: exec vulkan_overlay_unified_clustered_safe.cfg; vid_restart
//
// Purpose: mode 3 deferred-opaque + Forward+-transparent with the risky
// temporal/post-AA stack disabled so clustered lighting and composition can be
// debugged in isolation.

exec vulkan_overlay_unified_clustered.cfg

seta r_ext_multisample 0
seta r_oit 0
seta r_taa 0
seta r_taaMotionVectors 0
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0

echo "[renderer] Unified Clustered safe baseline: mode 3 + deferred opaque + Forward+ transparent (temporal/post AA/OIT off)"
