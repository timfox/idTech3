// Raster Ultra 2.0 — internal candidate (production hardening).
// NOT the boot default. Recovery: exec modern_vulkan.cfg; vid_restart
// Use: exec modern_raster_ultra_2.cfg; vid_restart
// See docs/RASTER_ULTRA_2.0.md
//
// Contains only systems with explicit ownership + RT locked off.
// Excludes: MBOIT, TAA/adaptive recon, SSR (until waterfall cert), terrain/veg,
// materials IR overlay, virtual shadows, atmosphere overlays, neural/RT GI.

exec modern_clustered.cfg

seta r_havenrpProfile "raster_ultra_2"
seta r_rasterUltra 1

// --- Spine / contract validation (dev-friendly; cheap when 0 consumers) ---
seta r_spineValidate 1
seta r_spineCert 0

// --- Opaque / transparent ownership ---
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1
seta r_forwardPlusOverflowShade 1
seta r_forwardPlusEnergyRenorm 0

seta r_pbr_specularAA 1
seta r_pbr_specularAAStrength 0.5

// --- Ambient visibility (single owner) ---
seta r_ambientVisibilityMode 2
seta r_ambientVisibilityStrength 1
seta r_gtaoSlices 4
seta r_gtaoSteps 6
seta r_gtaoThickness 2
seta r_ssao 0

// --- Raster shadows ---
seta r_pbrSunShadow 1
seta r_pbrSunShadowStrength 1
seta r_fogShadowSnap 1
seta r_sunShadowCascades 4
seta r_sunShadowDistance 4096
seta r_sunShadowSplitLambda 0.75
seta r_sunShadowCascadeBlend 0.08
seta r_sunShadowStable 1
seta r_fogShadowMapSize 1024

// --- Diffuse GI (lightmaps + one dynamic raster owner) ---
seta r_probeGi 1
seta r_probeGiStrength 1
seta r_probeGiSpacing 256
seta r_probeGiMax 2048
seta r_probeGiBudget 64
seta r_probeGiMode 0
seta r_probeGiStaticScale 0
seta r_probeGiDynamicScale 1
seta r_probeGiMinVis 0.02
seta r_probeGiAuto 1
seta r_probeGiCache 1
seta r_ssgi 1
seta r_ssgiStrength 0.65
seta r_ssgiSteps 12
seta r_ssgiThickness 24
seta r_ssgiDistance 192
seta r_ssgiNearScale 1
seta r_ssgiEdgeFade 32
seta r_rasterGiAoStrength 1
seta r_rasterGiLightmapDelta 1
seta r_havenrpDiffuseGiOwner "raster_gi"
seta r_radianceCache 1
seta r_radianceCacheLevels 3
seta r_radianceCacheGrid 24
seta r_radianceCacheCellSize 96
seta r_radianceCacheBudget 512
seta r_radianceCachePropIters 1
seta r_radianceCacheStrength 1
seta r_radianceCacheInjectScale 0.35
seta r_radianceCacheEmissive 1
seta r_radianceCacheEmissiveScale 0.5
seta r_radianceCacheSkyScale 0.02
seta r_radianceCacheDecay 0.92
seta r_radianceCacheQuality 3
seta r_radianceCacheDebug 0
seta r_rasterGiDebug 0

// --- Transparency (WBOIT only) ---
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
seta r_oitDebug 0
seta r_refractiveExcludeOit 1
seta r_transparencyDebug 0
seta r_gpuParticles 1
seta r_gpuParticlesDemo 0
seta r_gpuParticlesSoftScale 1
seta r_deferredDecals 1
seta r_distortion 1
seta r_distortionMaxPx 24

// --- AA: SMAA zero-history certified ---
seta r_ssr 0
seta r_aaMode 2
seta r_taa 0
seta r_bloom 1
seta r_tonemap 3

// --- Explicit ownership declarations ---
seta r_havenrpAoOwner "ambient_visibility"
seta r_havenrpReflectionOwner "ibl_probe"
seta r_havenrpTemporalOwner "none"

// === RT LOCK (mandatory) ===
seta r_hybrid1 0
seta r_hybrid1_taa 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_grtx 0
seta r_wpt 0
seta r_fsa 0
seta r_niv 0
seta r_ndgi 0
seta r_nvc 0
seta r_vfgi 0

// Forbidden in this candidate (keep commented):
// seta r_oit 2
// seta r_taa 1
// seta r_aaMode 3
// seta r_ssr 1
// seta r_cbtTerrain 1
// seta r_vegGpu 1

echo "[renderer] modern_raster_ultra_2.cfg: Raster Ultra 2.0 INTERNAL CANDIDATE (SMAA, WBOIT, GTAO, probe+cache GI, RT=0). Not boot default. vid_restart required."
