// Neutral SceneHDR reference for gray-veil bisect.
// Keep lighting/sky/shadows; disable haze owners and auto exposure for baseline.
set r_exposure_auto 0
set r_exposure 1.0
set r_localExposure 0
set r_bloom 0
set r_volumetricFog 0
set r_motionBlur 0
set r_dof 0
set r_taa 0
set r_sharpen 0
set r_grade_lutIntensity 0
set r_tonemap 3
echo "[gray_veil] neutral SceneHDR reference (fixed EV, no local lift/fog/bloom)"
