// Raster-only reference / material-debug profile (no temporal, no RT, fixed exposure).
// Use: exec modern_raster_reference.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg

exec modern_clustered.cfg

seta r_havenrpProfile "raster_reference"
seta r_rasterUltra 0

seta r_taa 0
seta r_aaMode 0
seta r_oit 0
seta r_ssr 0
seta r_bloom 0
seta r_ambientVisibilityMode 0
seta r_exposure_auto 0
seta r_pbr_specularAA 1
seta r_forwardPlusDebug 0

seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0

echo "[renderer] modern_raster_reference.cfg: mode 3 material/lighting reference (AO/bloom/AA off; RT=0)"
