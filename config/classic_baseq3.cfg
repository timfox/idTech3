// Auto-loaded for retail baseq3 + cgame.qvm (cl_autoGraphicsProfile 1).
// Preserves stock Quake III look and disables open-world / modern engine overlays.

seta cl_builtInTtfConsole 0
seta cl_builtInTtf 0
seta r_sdfEnable 0
// Slightly richer than strict retail: keep PBR/sun-shadow features off, but allow
// a mild SH world tint so stock maps do not read as completely flat in Vulkan.
seta r_classicLighting 0
seta r_pbr 0
seta r_fbo 0
seta r_taa 0
seta r_ssr 0
seta r_pbrSunShadow 0
seta r_forwardPlusOverflowShade 0
seta r_shWorldLighting 1
seta r_shWorldStrength 0.5
set cl_physicsEnabled 0
set cl_engineSprites 0
set r_spriteProps 0
set cl_navEnabled 0
set cl_particlesEnabled 0
set g_ecsMotion 0
set r_openWorld 0
set cl_openWorldSync 0
set r_bspStream 0
set cm_stream 0
set cm_streamMerge 0
set cm_openWorldCollision 0
set r_volumetricFog 0
set r_district 0
seta sv_engineSprites 0
seta sv_engineSpritesSpawn 0
seta sv_engineDecals 0
seta sv_engineDecalsSpawn 0
seta sv_openWorld 0
seta r_imgui 0
seta r_studio_tools 0
seta r_firstPersonFovEnabled 0
seta r_firstPersonScaleEnabled 0
