// Experimental Vulkan deferred lighting profile.
// Uses the G-buffer fill path plus mode-1 deferred dynamic lighting.
// Latched cvars need vid_restart after first enable.

seta r_fbo 1
seta r_hdr 2
seta r_pbr 1
seta r_materialBlend 1

seta r_renderMode 1
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusMaxPerTile 8
seta r_forwardPlusLuminanceSort 1
seta r_forwardPlusDistanceSort 0
seta r_forwardPlusDepthCull 1

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

seta r_taa 0
seta r_taaMotionVectors 0
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0
