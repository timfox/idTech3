// High-Throughput Raster Engine 1.0 — Slice A candidate.
// NOT the boot default. Recovery: exec modern_vulkan.cfg; vid_restart
// Use: exec modern_high_throughput.cfg; vid_restart
// See docs/HIGH_THROUGHPUT_RASTER_1.0.md
//
// Builds on Raster Ultra + 1.6 geometry + clustered Forward+.
// Slice A: global resource indices, GPU scene cull/indirect, draw merge,
// decal binning on shared cluster grid, ht_status. RT/TAA not required.

exec modern_raster_ultra.cfg
exec vulkan_overlay_raster_ultra_1_6_geometry.cfg

seta r_havenrpProfile "high_throughput"
seta r_htThroughput 1
seta r_htDecalBin 1
seta r_htMergeDraws 1
seta r_htResValidate 1

// Forward+ / clustered lights remain the light-bin owner
seta r_forwardPlus 1
seta r_forwardPlusZSlices 8

// Explicit locks
seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_gpuSceneWorldType 0

echo "[renderer] modern_high_throughput.cfg: HT Raster 1.0 SLICE A CANDIDATE (gpuScene+meshlets+decalBin+merge+resIndices). Classic BSP worldType=0. RT=0. Not boot default. vid_restart required."
