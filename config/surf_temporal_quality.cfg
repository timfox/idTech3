// Opt-in Temporal Reconstruction for Surf (NOT the default).
// High air speed (400+ u/s) can still ghost if motion vectors mis-scale.
// Verify with: set r_temporalDebug 32  (green ≈ 1×; yellow 2×; red 4×)
seta r_fbo 1
seta r_aaMode 4
seta r_taa 1
seta r_tsr 1
seta r_taaMotionVectors 1
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalSSR 0
seta r_temporalWeaponAfterTaa 1
seta r_weaponTemporalMode 1
seta r_weaponSsrIsolation 1
seta r_weaponBloomMode 1
seta r_bloom 0
echo "^3[surf] Temporal Reconstruction ON — expect possible echoes above ~400 u/s"
echo "^3[surf] r_temporalDebug 32 | temporal_motion_status | exec ghost_safe.cfg to kill"
