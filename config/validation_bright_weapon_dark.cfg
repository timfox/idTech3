// Bright weapon in a dark scene: weapon highlights must bloom through the one
// combined pass without ghost trails against the dark background.
echo "^3[validation] bright weapon / dark scene: lowered exposure, combined bloom"
set r_bloom 1
set r_weaponBloomMode 1
set r_exposure 0.6
set r_temporalDebug 0
echo "^3[validation] face a dark area and swing the view; trails >2 frames = FAIL (see r_temporalDebug 33)"
