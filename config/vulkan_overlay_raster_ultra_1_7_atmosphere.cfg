// Raster Ultra 1.7 — Physical atmosphere + weather + volumetric clouds (opt-in).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Classic maps stay on skybox unless r_skyOwner is set to physical.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_7_atmosphere.cfg; vid_restart
// Recovery: seta r_skyOwner 0; seta r_atmosphere 0; seta r_weather 0; seta r_volumetricClouds 0; vid_restart
// See docs/RASTER_ULTRA_1.7.md

seta r_skyOwner 1
seta r_atmosphere 1
seta r_atmosphere_scale 4
seta r_atmosphere_sunIntensity 22

seta r_volumetricFog 1
seta r_fog_shadows 1
seta r_volumetricFogQuality 2
seta r_volumetricFogTemporal 1

seta r_weather 1
seta r_weatherPreset 0
seta r_weatherTransition 8
seta r_weatherIndoor 0

seta r_volumetricClouds 1
seta r_cloudShadows 1
seta r_cloudShadowStrength 0.65
seta r_cloudHistory 1

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

echo "[renderer] Raster Ultra 1.7 atmosphere: exclusive physical sky, froxel+shadows, weather, clouds (RT=off FG=off)"
