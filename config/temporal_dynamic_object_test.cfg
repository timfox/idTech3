// Deterministic dynamic-object temporal validation (helmet / pickups).
// Usage (OpenArena example):
//   +set fs_game openarena +set sv_pure 0 +exec temporal_dynamic_object_test.cfg
// Then enable reconstruction if your profile defaults to SMAA-only:
//   \r_aaMode 4 ; vid_restart
// Bisect first offending pass:
//   \r_taa 0          // or r_aaMode 2
//   \r_tsr 0
//   \r_temporalAO 0
//   \r_temporalSSR 0
//   \r_temporalFog 0
//   \r_motionBlur 0
//   \r_bloom 0
//   \r_sharpen 0

seta r_taa 1
seta r_taaMotionVectors 1
seta r_aaMode 4
seta r_tsr 1
seta r_temporalHistoryWeight 0.72
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalCpuSkinPrev 1

seta r_dynamicObjectHistoryMax 0.48
seta r_dynamicObjectDepthThreshold 0.012
seta r_dynamicObjectReactiveScale 1.0
seta r_dynamicObjectRejectDilation 1.5
seta r_dynamicObjectVelocityLimit 48

seta r_temporalObjectDebug 0
seta r_temporalDebug 0
seta r_post_debug 0

echo "temporal_dynamic_object_test: reconstruction ON, object debug OFF"
echo "  r_temporalObjectDebug 1=velocity 2=prevValid 8=depthReject 9=histWeight 12=disocclusion"
echo "  Confirm tint is not debug: r_temporalDebug 0 and r_temporalObjectDebug 0"
