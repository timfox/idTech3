// Raster Ultra 1.5 — Present-Time Adaptive Reconstruction (opt-in overlay).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_present_adaptive_recon.cfg; vid_restart
// Recovery: seta r_aaMode 2; seta r_taa 0; vid_restart
// See docs/RASTER_ULTRA_1.5.md

seta r_aaMode 3
seta r_taa 1
seta r_taaMotionVectors 1
seta r_presentAdaptiveRecon 1
seta r_presentAdaptiveBudget 0.15
seta r_presentAdaptiveSpatial 1
seta r_presentAdaptiveHistoryCap 0.42
seta r_temporalHistoryWeight 0.42
seta r_taa_feedbackStationary 0.55
seta r_taa_feedbackMotion 0.28
seta r_taa_sharpen 0.10
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalWeaponAfterTaa 1
seta r_temporalSmaaCleanup 0
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0
seta r_hybrid1 0
seta r_rtx 0

echo "[renderer] Present-Time Adaptive Reconstruction (r_aaMode 3): current-frame-first, FG=off, weapon-after, SMAA remains certified at aaMode 2"
