// Selective Hybrid Reflections 1.0 — opt-in profile (does NOT change boot defaults).
// Target stack:
//   mode 3 Unified Clustered (via modern_clustered) + Selective Hybrid mode 4 latch
//   raster primary visibility + clustered direct lighting
//   RT reflections where healthy (Hybrid1 specular) with exclusive ownership
//   SSR as demoted fallback when RT unhealthy
//   probe/sky as terminal fallback (Hybrid1 miss / rough skip / gen_frag when probe owner)
//   GTAO / lightmaps+SH/IBL / optional WBOIT / SMAA
//   weapon outside world temporal histories / UI after tonemap
// Out of scope: diffuse RT GI, path-traced primary, frame gen, new AA.
// Use: exec vulkan_overlay_selective_hybrid_reflections.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg
// See docs/SELECTIVE_HYBRID_REFLECTIONS_1.0.md

exec modern_clustered.cfg

seta r_renderMode 4
seta r_selectiveHybridReflection 1
seta r_havenrpReflectionOwner auto

// Hybrid1 supplies RT specular only (no diffuse GI this milestone)
seta r_hybrid1 1
seta r_rtx 1
seta r_rtxDemo 1
seta r_hybrid1Quality 2
seta r_hybrid1_shadow 0
seta r_hybrid1_spec 1
seta r_hybrid1_diffuse 0
seta r_hybrid1_dlightShadows 0
seta r_hybrid1_taa 0
seta r_pathtrace 0

// SSR remains available for demotion (disabled while RT owns — exclusive waterfall)
seta r_ssr 1

// Certified presentation companions
seta r_taa 0
seta r_aaMode 2
seta r_gtao 1
seta r_oit 0
seta r_presentAdaptiveRecon 0

echo "[renderer] Selective Hybrid Reflections 1.0 (RT→SSR→probe). Run vid_restart. Recovery: exec modern_vulkan.cfg"
echo "[renderer] Debug: r_shrDebug 1..15 | shr_status | havenrp_renderer_status"
