// Steam Deck default configuration
// Auto-loaded when Steam Deck is detected (in_steamDeck 1).
// Copied to release/base/ during build; exec search finds it as steamdeck.cfg.
//
// Desktop / non-Deck testing:
//   seta in_joystick 1; exec steamdeck.cfg; in_restart
//

// ---------------------------------------------------------------------------
// Device / display
// ---------------------------------------------------------------------------
seta in_joystick "1"
seta in_joystickUseAnalog "1"
seta in_gamepadEvents "1"
seta joy_threshold "0.18"
seta in_gamepadRumble "1"

seta r_fullscreen "1"
seta com_maxfps "60"
seta r_renderer "vulkan"

// Freelook + always-run (hold LB / left-stick click to walk)
seta cl_freelook "1"
seta cl_run "1"
seta cl_independentCrouch "1"
seta cl_jsEscapeMenu "1"

// Dual-stick look/move scale (axes are -127..127 after SDL normalize)
seta j_yaw "-0.022"
seta j_pitch "0.022"
seta j_forward "-1"
seta j_side "1"
seta j_up "0"
seta j_yaw_axis "2"
seta j_pitch_axis "3"
seta j_forward_axis "1"
seta j_side_axis "0"
seta j_up_axis "4"

// ---------------------------------------------------------------------------
// Face / shoulder / trigger buttons
//   A = jump   B = crouch   X = scores   Y = screenshot
//   RT/RB = attack   LB = walk   LT = crouch (alt)
//   START / BACK open the JS pause menu (engine maps them like ESC)
// ---------------------------------------------------------------------------
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+scores"
bind PAD0_Y "screenshot"
bind PAD0_LEFTSHOULDER "+speed"
bind PAD0_RIGHTSHOULDER "+attack"
bind PAD0_LEFTTRIGGER "+movedown"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTSTICK_CLICK "+speed"

// Stick→axis translation requires these binds even with in_joystickUseAnalog 1
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"

// D-pad is left unbound for JS menu navigation (input_key while ui_rpMenu /
// map select / leaderboard are open). Do not bind it to movement.
