// Steam Deck default configuration
// Auto-loaded when Steam Deck is detected (in_steamDeck 1)
// Copied to release/base/ during build; place in base/ or baseq3/ for exec to find

// Enable gamepad/joystick for Steam Deck controls
seta in_joystick "1"

// Fullscreen for handheld display
seta r_fullscreen "1"

// Cap FPS for battery life (Deck display is 60Hz)
seta com_maxfps "60"

// Vulkan renderer preferred on Deck
seta r_renderer "vulkan"
