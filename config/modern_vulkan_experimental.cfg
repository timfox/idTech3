// Experimental kitchen-sink profile (not shipping). Mode 3 + vis buffer +
// optional temporal / MBOIT / neural / open-world. Prefer after Spine is green.
// Use: exec modern_vulkan_experimental.cfg; vid_restart

exec modern_vulkan.cfg

seta r_renderMode 3
seta r_deferredLighting 1
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1

seta r_visibilityBuffer 1
seta r_visibilityBufferFill 2
seta r_materialClassify 1
seta r_deferredMaterialClassify 1

seta r_oit 2
seta r_oitForwardPlus 1
seta r_stochasticAlpha 0

seta r_aaMode 2
seta r_taa 0
seta r_taaMotionVectors 1

seta r_ssr 1
seta r_volumetricFog 1
seta r_district 1
seta r_openWorld 0

echo "[renderer] modern_vulkan_experimental.cfg: mode 3 + vis/MBOIT (experimental; not Spine 1.1 certified)"
