// Vulkan overlay: RTX demo pass on top of the modern base.
// Requires USE_VULKAN_RTX build + ray tracing capable GPU.
// Use: exec vulkan_overlay_rtx.cfg; vid_restart

exec modern_vulkan.cfg

seta r_rtx 1
seta r_rtxDemo 1
seta r_rtxComposite 0.35
seta r_rtxSamples 1
seta r_rtxEntities 1
seta r_rtxTlasUpdate 1
seta r_surfelGi 1
seta r_surfelGiDensity 2
seta r_surfelGi_hybrid1Fusion 1

echo "[renderer] Vulkan overlay: RTX demo + default Surfel GI enabled over modern base"
