// Renderer Spine stable boot profile (DEFAULT via modern_vulkan.cfg).
// Raster-only Unified Clustered: deferred opaque + clustered transparent/OIT.
// PBR + HDR + SMAA + bloom + SH/IBL + GTAO.
// No temporal reconstruction, stochastic alpha, Hybrid1, RcGI,
// visibility-buffer late shade, open-world streaming, RTAO, or legacy SSAO.
// Surfel GI is the default indirect RT request; non-RTX builds/devices keep it inert.
// Latched cvars need: vid_restart
// Recovery: exec gfx_safe.cfg; vid_restart
// See docs/RENDERER_SPINE_1.0.md

seta r_fbo 1
seta r_hdr 2
seta r_pbr 1
seta r_materialBlend 1

// Unified Clustered primary (mode 3) — default opaque/transparent light path
seta r_renderMode 3
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusMaxPerTile 8
seta r_forwardPlusLuminanceSort 1
seta r_forwardPlusDistanceSort 0
seta r_forwardPlusDepthCull 1
seta r_forwardPlusSpecularStrength 0.65
seta r_forwardPlusEnergyRenorm 0
seta r_forwardPlusOverflowShade 1
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1

seta r_ext_multisample 0

// Opaque deferred lighting shares the clustered light lists with transparent/OIT.
seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredArchitecture 2
seta r_gbufferQuality 2
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

// Ambient: GTAO only
seta r_ambientVisibilityMode 2
seta r_ambientVisibilityStrength 1
seta r_gtaoSlices 4
seta r_gtaoSteps 6
seta r_gtaoThickness 2
seta r_gtaoHalfRes 0
seta r_ssao 0
seta r_rtaoTemporal 0
seta r_rtaoSpatialFilter 0
seta r_rtaoDebug 0

// Production visibility-buffer + material-class path.
// Fill=2 uses PrimID/drawId MRT when available and falls back to depth-proxy compute.
// Late shade remains off until graph-owned opaque pass execution is promoted.
seta r_visibilityBuffer 1
seta r_visibilityBufferFill 2
seta r_visibilityBufferDebug 0
seta r_visibilityBufferLateShade 0
seta r_materialClassify 1
seta r_deferredMaterialClassify 1

// Presentation AA: SMAA only (no TAA)
seta r_aaMode 2
seta r_taa 0
seta r_taaMotionVectors 1
seta r_temporalCpuSkinPrev 1
seta r_temporalReactiveMask 0
seta r_ext_smaa 1
seta r_smaa_preset 3
seta r_postAaAfterBloom 1
seta r_ext_fxaa 0

// Production WBOIT (r_oit 1). MBOIT (r_oit 2) stays experimental-only.
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 0
seta r_oitDebug 0
seta r_stochasticAlpha 0

// Post: bloom + tonemap; SSR off until validated on this profile
seta r_bloom 1
seta r_tonemap 3
seta r_post 1
seta r_ssr 0
seta r_ssrTemporal 0
seta r_temporalSSR 0
seta r_allowExperimentalTemporalSSR 0
seta r_atmosphere 0
seta r_exposure_auto 0

seta r_grade_exposureBias 0
seta r_grade_temperature 0
seta r_grade_tint 0
seta r_grade_contrast 1
seta r_grade_saturation 1
seta r_grade_vibrance 0
seta r_grade_hue 0
seta r_post_contrast 1
seta r_post_saturation 1

// SH / IBL + raster shadows
seta r_shWorldLighting 1
seta r_shWorldStrength 1
seta r_pbrSunShadow 1
seta r_pbrSunShadowStrength 1
seta r_fogShadowSnap 1

// Disable experimental / streaming / heavyweight RT stacks.
// Surfel GI remains requested by default and fails open when RTX/ray-query is unavailable.
seta r_hybrid1 0
seta r_hybrid1_taa 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_surfelGi 1
seta r_surfelGiDensity 2
seta r_surfelGi_hybrid1Fusion 1
seta r_surfelGi_hash 1
seta r_surfelGi_adaptiveSpawn 1
seta r_rcgi 0
seta r_ndgi 0
seta r_niv 0
seta r_nvc 0
seta r_vfgi 0
seta r_fsa 0
seta r_wpt 0
seta r_grtx 0
seta r_mgs 0
seta r_vksplat 0
seta r_openWorld 0
seta r_district 0
seta r_bspStream 0
seta r_volumetricFog 0
seta r_vdbFog 0

echo "[renderer] modern_vulkan_stable.cfg: Unified Clustered + visibility/classify + Surfel GI default (fails open without RTX/ray-query)"
