// Raster Ultra 1.12 — Frequency-Aware Rendering + Moiré Suppression (opt-in).
// Prefer after modern_raster_ultra.cfg or modern_raster_reference.cfg.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_frequency_aware.cfg; vid_restart keep_window
// Recovery: seta r_frequencyAware 0; exec modern_vulkan.cfg; vid_restart keep_window
// On Wayland prefer keep_window — plain vid_restart destroys the window (libdecor crash risk).
// See docs/RASTER_ULTRA_1.12.md
// Does NOT force TAA, global blur, FXAA spam, or RT.

seta r_frequencyAware 1
seta r_frequencyTier 2
seta r_frequencyDebug 0
seta r_frequencySpecularAA 1
seta r_frequencyAlphaCoverage 1
seta r_frequencyProceduralCutoff 1
seta r_frequencyWaterCutoff 1
seta r_frequencyShadowDecorrelate 1
seta r_frequencySelectiveSS 0
seta r_frequencyStochastic 0
seta r_frequencyMipBiasFloor -0.25
seta r_materialAnisotropyMax 16
seta r_normalMapAnisotropy 1

// Certified filtering defaults (no temporal required)
seta r_ext_texture_filter_anisotropic 1
seta r_ext_max_anisotropy 16
seta r_mipLodBias -0.25
seta r_pbr_specularAA 1
seta r_pbr_specularAAStrength 0.85
seta r_aaMode 2
seta r_taa 0

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

echo "[renderer] Raster Ultra 1.12 Frequency-Aware: mip/aniso/Toksvig/alpha-coverage (RT=off TAA=off; selective SS/stochastic off)"
