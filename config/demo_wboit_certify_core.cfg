# Phase 2.6C — live WBOIT production certification
# Prerequisites: map loaded, GPU client, r_oit 1, r_fbo 1
#
# Launch example:
#   ./release/idtech3 +set r_oit 1 +set r_fbo 1 +set sv_cheats 1 +devmap <map> +exec demo_wboit_certify_core.cfg
#
# Or in-console after map load:
#   exec demo_wboit_certify_core.cfg

// devmap may still be completing FS/cgame startup when the cfg is queued.
// Delay the latched changes until the map has a stable renderer owner.
wait 10
seta r_oit 1
seta r_fbo 1
seta r_taa 0
seta r_oitCertIsolate 1
seta r_oitLabFreeze 1
seta r_oitCertContinueOnFail 0
# Formal shipping claim: set to 30. Automated triage default: 1.
seta r_oitCertSoakMinutes 1
seta r_oitCertMaxRetries 16

echo "[WBOIT] Phase 2.6C: oit_certify_core — deferred GPU snapshots + soak chain"
// These renderer options are latched. Own the restart here, then wait for the
// recreated Vulkan DSO to register its lab commands before invoking one.
vid_restart keep_window
wait
wait
oit_certify_core
