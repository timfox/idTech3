// Spine 1.2 Tier C — Full Path-Traced Reference (opt-in; NOT gameplay default).
// Path tracer is the exclusive primary lighting owner (full replace, not overlay).
// Intended for material validation, lighting reference, screenshots, cinematic capture.
// No frame generation. No intentional presentation latency.
// Requires USE_VULKAN_RTX build + RTX-capable GPU.
// Use: exec vulkan_overlay_pt_reference.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg
// See docs/RENDERER_SPINE_1.2.md

exec modern_clustered.cfg

seta r_renderMode 5

seta r_rtx 1
seta r_rtxDemo 1
seta r_pathtrace 1
seta r_pathtrace_composite 1
seta r_hybrid1 0

// Avoid world TAA long trails against PT accumulation
seta r_taa 0
seta r_aaMode 0
seta r_presentAdaptiveRecon 0

echo "[renderer] Spine 1.2 Tier C Path-Traced Reference (r_renderMode 5 + exclusive PT). Run vid_restart. Recovery: exec modern_vulkan.cfg"
