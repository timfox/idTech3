// Clean opaque reference: real lighting on, temporal/image histories off, fixed EV.
// Use for ghost vs fullbright separation (see docs/GHOST_FULLBRIGHT.md).

set r_taa 0
set r_tsr 0
set r_taaMotionVectors 0
set r_temporalSSR 0
set r_ssr 0
set r_ssao 0
set r_ambientVisibilityMode 0
set r_volumetricFog 0
set r_temporalFog 0
set r_bloom 0
set r_motionBlur 0
set r_dof 0
set r_sharpen 0
set r_weaponTemporalMode 0
set r_exposure_auto 0
set r_exposure 1.0
set r_fullbright 0
set r_lightmap 0
set r_historyQuarantine 8

echo "ghost_fullbright_ref: fixed EV, histories off, lighting on"
ghost_lighting_status
fullbright_status
