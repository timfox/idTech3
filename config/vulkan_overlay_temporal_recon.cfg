// Modern native: Temporal Reconstruction + light SMAA cleanup (r_aaMode 5).
// Conservative history weight to limit ghosting. Prefer after modern_vulkan.cfg.
// Use: exec vulkan_overlay_temporal_recon.cfg; vid_restart if SMAA latch changed.

seta r_aaMode 5
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalCpuSkinPrev 1
seta r_temporalHistoryWeight 0.80
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalSmaaCleanup 1
seta r_ext_smaa 1
seta r_ext_fxaa 0
seta r_smaa_preset 2
seta r_postAaAfterBloom 0
seta r_taa_feedbackStationary 0.88
seta r_taa_feedbackMotion 0.68
seta r_taa_sharpen 0.14

echo "[renderer] Temporal Reconstruction + SMAA cleanup (r_aaMode 5), historyWeight 0.80"
