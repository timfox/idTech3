// Modern native: Temporal Reconstruction without post-TAA SMAA cleanup.
// Cleanup SMAA after TAA causes white silhouette / echoing halos on dark skylines.
// Prefer after modern_vulkan.cfg / stable. Use: exec vulkan_overlay_temporal_recon.cfg
// then vid_restart if latch changed (r_aaMode / SMAA).

seta r_aaMode 4
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalCpuSkinPrev 1
seta r_temporalHistoryWeight 0.68
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalReactiveMask 1
seta r_temporalSmaaCleanup 0
seta r_temporalWeaponAfterTaa 1
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0
seta r_taa_feedbackStationary 0.78
seta r_taa_feedbackMotion 0.55
seta r_taa_sharpen 0.08

echo "[renderer] Temporal Reconstruction (r_aaMode 4), historyWeight 0.68, weapon-after-TAA, no SMAA cleanup halo"
