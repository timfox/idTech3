// Vulkan overlay: experimental mode-1 deferred lighting on top of the modern base.
// Use: exec vulkan_overlay_deferred.cfg; vid_restart

exec modern_vulkan.cfg

seta r_renderMode 1
seta r_forwardPlus 1
seta r_forwardPlusShade 1

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredArchitecture 1
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

// Temporal Reconstruction stays off by default so lighting bugs are not masked.
// If you enable TAA for deferred (r_taa 1), pin anti-ghosting:
//   r_taaMotionVectors 1, r_temporalReactiveMask 1, r_temporalVarianceClip 1,
//   r_temporalDisocclusion 1, r_temporalWeaponAfterTaa 1
seta r_taa 0
seta r_taaMotionVectors 0
seta r_temporalReactiveMask 0
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1
seta r_temporalWeaponAfterTaa 1
seta r_ext_smaa 0
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0

echo "[renderer] Vulkan overlay: deferred lighting enabled over modern base (temporal off; anti-ghost pins ready if r_taa 1)"
