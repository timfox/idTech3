// Competitive / sharp presentation AA: SMAA 1x, no temporal.
// Use: exec vulkan_overlay_aa_sharp.cfg
// Latched SMAA needs vid_restart if switching from FXAA/off.

seta r_aaMode 2
seta r_taa 0
seta r_ext_smaa 1
seta r_ext_fxaa 0
seta r_smaa_preset 3
seta r_postAaAfterBloom 1
seta r_ext_supersample 0
seta r_temporalSmaaCleanup 0

echo "[renderer] AA sharp: r_aaMode 2 (SMAA 1x), r_taa 0"
