// OIT isolation matrix — Raster Ultra / Frequency-Aware repro helpers.
// Prefer after modern_raster_ultra.cfg (+ optional vulkan_overlay_frequency_aware.cfg).
// One-command launch (OpenArena):
//   ./scripts/repro_oit_corruption.sh
//
// Isolation steps (run in console after map load):
//   1) Baseline:     seta r_oit 0; vid_restart keep_window
//   2) WBOIT raw:    seta r_oit 1; seta r_oitForwardPlus 0; seta r_taa 0; vid_restart keep_window
//   3) WBOIT lit:    seta r_oitForwardPlus 1
//   4) Weapon hide:  cg_drawGun 0   (or equivalent game cvar)
//   5) Weapon show:  cg_drawGun 1
//   6) Debug views:  seta r_oitDebug 1..13 ; oit_status
//
// Does NOT change modern_vulkan.cfg boot defaults.

seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
seta r_oitDebug 0
seta r_refractiveExcludeOit 1
seta r_transparencyDebug 0
seta r_taa 0
seta r_aaMode 2
seta r_spineValidate 1

echo "[renderer] OIT isolation: r_oit=1 ForwardPlus=1 TAA=off SMAA; run oit_status after map load"
echo "[renderer] Matrix: r_oit 0 | ForwardPlus 0 | ForwardPlus 1 | cg_drawGun 0/1 | r_oitDebug N"
