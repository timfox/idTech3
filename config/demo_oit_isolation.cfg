// OIT isolation matrix — Raster Ultra / Frequency-Aware repro helpers.
// Prefer after modern_raster_ultra.cfg (+ optional vulkan_overlay_frequency_aware.cfg).
// One-command launch (OpenArena):
//   ./scripts/repro_oit_corruption.sh
//   or: exec repro_oit_corruption.cfg
//
// Isolation steps (run in console after map load):
//   1) Baseline:     seta r_oit 0; vid_restart keep_window
//   2) WBOIT raw:    seta r_oit 1; seta r_oitForwardPlus 0; seta r_oitClassify 0; seta r_taa 0; vid_restart keep_window
//   3) Classify:     seta r_oitClassify 1
//   4) WBOIT lit:    seta r_oitForwardPlus 1
//   5) Direct test:  seta r_oitDirectTest 1  (clear+resolve only)
//   6) Weapon hide:  cg_drawGun 0
//   7) Weapon show:  cg_drawGun 1
//   8) Capture:      oit_capture stages ; oit_status ; seta r_oitDebug 1..13
//
// Does NOT change modern_vulkan.cfg boot defaults.

seta sv_pure 0
seta r_fbo 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
// r_oitDebug is CVAR_CHEAT — set after sv_cheats 1
seta r_refractiveExcludeOit 1
seta r_transparencyDebug 0
seta r_taa 0
seta r_aaMode 2
seta r_spineValidate 1

echo "[renderer] OIT isolation: r_oit=1 ForwardPlus=1 TAA=off SMAA sv_pure=0; run oit_status after map load"
echo "[renderer] Matrix: r_oit 0 | ForwardPlus 0 | ForwardPlus 1 | cg_drawGun 0/1 | (sv_cheats 1) r_oitDebug N"
