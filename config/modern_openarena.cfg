// Modern OpenArena graphics profile — stock OA middleware OFF, modern Vulkan lighting ON.
// Used when cl_preferModernGraphics 1, or when selective hybrid / r_fbo+r_pbr was already requested
// before cgame auto-profile (so classic_openarena_native.cfg does not wipe the stack).
// Latched cvars need vid_restart (queued by cl_autoGraphicsProfile).
// Does NOT change modern_vulkan.cfg boot defaults for non-OA games.
// Recovery to classic OA look: exec classic_openarena_native.cfg; vid_restart

exec modern_clustered.cfg

seta r_classicLighting 0
seta r_pbr 1
seta r_fbo 1
seta r_hdr 2
seta r_pbrSunShadow 1
seta r_pbrSunShadowStrength 1
seta r_forwardPlusOverflowShade 0.5
seta r_shWorldLighting 1
seta r_shWorldStrength 0.85
seta r_ssr 1
seta r_oit 1
seta r_oitForwardPlus 1
seta r_aaMode 2
seta r_taa 0
seta r_gtao 1
seta r_ambientVisibilityMode 2
seta r_ambientVisibilityStrength 0.65
seta r_ambientVisibilityFloor 0.32
seta r_bloom 1
seta r_tonemap 3
seta r_grade_whitePoint 4.0
seta r_grade_blackClip 0.0
seta r_grade_shadowLift 0.04
seta r_exposure_auto 0
seta r_picmip 0
seta r_ext_texture_filter_anisotropic 1
seta r_ext_max_anisotropy 16
seta r_textureMode GL_LINEAR_MIPMAP_LINEAR
seta r_smaa_preset 3

// Keep OpenArena presentation middleware off (sprites/nav/open-world/etc.)
seta cl_physicsEnabled 0
seta r_openWorld 0
seta cl_openWorldSync 0
seta r_bspStream 0
seta cm_stream 0
seta cm_streamMerge 0
seta r_district 0
seta r_volumetricFog 0
seta r_imgui 0
seta r_studio_tools 0

echo "[renderer] modern_openarena.cfg: clustered PBR + GTAO floor + SSR/WBOIT; OA middleware off"
