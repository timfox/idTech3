// Raster Ultra 1.13 — Dynamic Radiance Cache GI + Emissive Transport (opt-in overlay).
// RT stays locked OFF. Does not change modern_vulkan.cfg boot defaults.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_13_radiance_cache.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg; vid_restart
// See docs/RASTER_ULTRA_1.13.md

seta r_radianceCache 1
seta r_radianceCacheLevels 3
seta r_radianceCacheGrid 24
seta r_radianceCacheCellSize 96
seta r_radianceCacheBudget 512
seta r_radianceCachePropIters 1
seta r_radianceCacheStrength 1
seta r_radianceCacheInjectScale 0.35
seta r_radianceCacheEmissive 1
seta r_radianceCacheEmissiveScale 0.5
seta r_radianceCacheSkyScale 0.02
seta r_radianceCacheDecay 0.92
seta r_radianceCacheQuality 3
seta r_radianceCacheDebug 0

// Keep 1.3 ownership: lightmap baseline, probes as gap-fill, SSGI near-field.
seta r_probeGiStaticScale 0
seta r_rasterGiLightmapDelta 1
seta r_havenrpDiffuseGiOwner "auto"

// RT LOCK
seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_ndgi 0
seta r_niv 0
seta r_vfgi 0
seta r_taa 0

echo "[renderer] vulkan_overlay_raster_ultra_1_13_radiance_cache.cfg: clipmap GI on (experimental; RT=0). vid_restart required."
