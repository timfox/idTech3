// Vulkan overlay: Unified Clustered Renderer (Hybrid Clustered Deferred).
// Technical: deferred lighting for opaque + Forward+ shade for transparent,
// sharing the same 16x16 Forward+ tile light lists.
// Use: exec vulkan_overlay_unified_clustered.cfg; vid_restart
//
// Branding: Unified Clustered Renderer — hybrid deferred and Forward+ shading.
// Shipping default is modern_vulkan.cfg (r_renderMode 3 tiled hybrid).

exec modern_vulkan.cfg

seta r_renderMode 3
seta r_forwardPlus 1
seta r_forwardPlusShade 1
seta r_forwardPlusDepthCull 1

seta r_deferredGBuffer 1
seta r_deferredGBufferFill 1
seta r_deferredLighting 1
seta r_deferredUnlitBase 1
seta r_deferredLightingStrength 1
seta r_deferredSpecular 1
seta r_deferredSpecularStrength 1
seta r_deferredAOCoupling 0.65
seta r_deferredDefaultMetalness 0
seta r_deferredDefaultRoughness 0.55
seta r_deferredNormalEdgeThreshold 0.08
seta r_deferredGBufferDebug 0

// Direct G-buffer MRT export (MSAA forces depth-derived fallback).
seta r_ext_multisample 0

echo "[renderer] Unified Clustered Renderer (r_renderMode 3): deferred opaque + Forward+ transparent"
