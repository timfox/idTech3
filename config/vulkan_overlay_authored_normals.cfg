// Experimental authored / hard-edge mesh normals (does NOT change certified boot).
// Target: preserve DCC split normals on glTF/GLB; optional crease-angle generation.
// MD3/BSP certified paths remain legacy (policy 0 behavior for those formats).
// Use: exec vulkan_overlay_authored_normals.cfg; vid_restart
// Then reload models (map change / model reload). Latched cvars require vid_restart.
// Recovery: exec modern_vulkan.cfg
// See docs/AUTHORED_MESH_NORMALS.md

// Keep presentation stack; only mesh normal import policy changes.
exec modern_vulkan.cfg

seta r_meshNormalPolicy 1
seta r_preserveCustomNormals 1
seta r_hardEdgeAngle 60
seta r_splitTangentsAtHardEdges 1
seta r_meshNormalDebug 1

// Optional: force crease-angle splits when authored normals are absent
// seta r_meshNormalPolicy 2

echo "Authored mesh normals overlay: r_meshNormalPolicy=1 (experimental). vid_restart + reload models."
