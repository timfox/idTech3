// Low-latency raster: mode 2 Forward+ spine, SMAA, minimal temporal, no RT.
// Use: exec modern_low_latency.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg

exec modern_vulkan.cfg

seta r_havenrpProfile "low_latency"
seta r_rasterUltra 0

seta r_renderMode 2
seta r_forwardPlusZSlices 1
seta r_taa 0
seta r_aaMode 2
seta r_oit 0
seta r_ssr 0
seta r_bloom 1
seta r_presentAdaptiveRecon 0

seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0

echo "[renderer] modern_low_latency.cfg: mode 2 + SMAA, no TAA/OIT/RT"
