// High-Throughput Raster Engine 1.1 — Slice A (skeletal throughput) candidate.
// NOT the boot default. Recovery: exec modern_vulkan.cfg; vid_restart
// Use: exec modern_high_throughput_animation.cfg; vid_restart
// See docs/HIGH_THROUGHPUT_RASTER_1.1.md
//
// Builds on HT 1.0 throughput + Raster Ultra. RT locked off.
// Slice A: canonical anim records, clip compression, IQM VS GPU skin,
// previous-frame bone palettes, animation LOD. Geom-cache / compact tangents
// remain Slice B–C (not enabled here).

exec modern_high_throughput.cfg

seta r_havenrpProfile "high_throughput_animation"
seta r_htAnimation 1
seta r_iqmGpu 1
seta r_gltfGpu 1
seta r_animLod 1
seta r_animLodStart 600
seta r_animLodEnd 2400
seta r_animLodHysteresis 8
seta r_animCompress 1

// Explicit locks (inherit HT 1.0; restate for clarity)
seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_gpuSceneWorldType 0

echo "[renderer] modern_high_throughput_animation.cfg: HT Raster 1.1 SLICE A CANDIDATE (records+compress+IQM GPU skin+animLOD). Geom-cache NOT enabled. RT=0. Not boot default. vid_restart required."
