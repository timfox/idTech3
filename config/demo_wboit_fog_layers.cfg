// Demo: WBOIT fog-through-layers (mode 3 clustered + per-fragment lit fog in accum).
// See docs/WBOIT_FOG_LAYERS.md and docs/WBOIT_GPU_CERTIFICATION.md
//
// Usage:
//   exec demo_wboit_fog_layers.cfg
//   vid_restart
//   oit_fog_status
//   oit_certify_wboit begin   // B6a covers bloom/fog/volumetrics

exec vulkan_overlay_oit_clustered.cfg

seta r_oitFogMode 1
seta r_oitFogDensity 0.002

echo "========================================"
echo "[WBOIT fog layers] r_oitFogMode 1 — lit radiance fogged once in accum"
echo "[WBOIT fog layers] Opaque background already fogged; resolve must NOT fog again"
echo ""
echo "Test: place layered glass/smoke in front of fogged world geometry."
echo "  oit_fog_status          — pass order + doubleFogPrevention"
echo "  seta r_oitFogDebug 2    — view transmittance T (sv_cheats 1)"
echo "  seta r_oitFogDebug 6    — magenta = double-fog misconfig"
echo "  toggle r_volumetricFog  — B6a: no bands on transparent result"
echo ""
echo "Cert: oit_certify_wboit begin → pass B6a → export"
echo "========================================"
