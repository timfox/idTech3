// Clustered Hybrid M2 lab checklist (manual GPU capture).
// Requires Vulkan + Forward+; prefer r_renderMode 3.
set r_renderMode 3
set r_deferredLighting 1
set r_deferredGBuffer 1
set r_deferredGBufferFill 1
set r_forwardPlus 1
set r_forwardPlusZSlices 8
set r_forwardPlusZSliceMode 1
set r_clusterCompactLists 1
set r_clusterZFar 4096
set r_clusterMaxLightsPerCluster 32
set r_clusterOverflowPolicy 2
set r_clusterDebug 0
echo "cluster lab: cluster_z_test / cluster_status / r_hybridCompare 1..8 / r_clusterDebug 6"
