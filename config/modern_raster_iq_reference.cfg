// Renderer IQ reference profile — modern_raster_iq_reference
// Native resolution, no TAA, full-fidelity G-buffer, production WBOIT, bloom with firefly clamp.
// Baseline for P1 image comparisons. Latched cvars need: vid_restart
// Commands: renderer_iq_profile_status / renderer_iq_profile_validate / renderer_p1_status
// See docs/RENDERER_IQ_REFERENCE_PROFILE.md

exec modern_vulkan_stable.cfg

seta r_oit 1
seta r_oitFogMode 1
seta r_oitAllowExperimentalMboit 0

seta r_taa 0
seta r_ssrTemporal 0
seta r_temporalSSR 0
seta r_allowExperimentalTemporalSSR 0
seta r_taaMotionVectors 0
seta r_motionBlur 0
seta r_dof 0

seta r_bloom 1
seta r_bloomTemporalOrder 1
seta r_bloomFireflyClamp 1
seta r_bloomFireflyRatio 4.0
seta r_bloomFireflyAbsolute 0.25
seta r_bloomFireflyNeighborhood 1
seta r_weaponBloomMode 1
seta r_temporalWeaponAfterTaa 1

seta r_gbufferCompact 0
seta r_gbufferQuality 2

seta r_aaMode 2
seta r_ext_smaa 1
seta r_ext_fxaa 0
seta r_postAaAfterBloom 0

seta r_renderScale 1.0
seta r_sharpen 0
seta r_ext_multisample 0

seta r_pbr_specularAA 1
seta r_specularAA 1

// Optional: apply via console
// renderer_iq_profile_apply
// vid_restart
