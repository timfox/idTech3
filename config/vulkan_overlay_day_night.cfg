// Real-time day/night world lighting.
// Uses local wall-clock time by default; set r_dayNightUseRealTime 0 and
// r_dayNightCycleMinutes 2 for a fast 24-hour lighting validation pass.

seta r_dayNight 1
seta r_dayNightUseRealTime 1
seta r_dayNightCycleMinutes 0
seta r_dayNightLatitude 35
seta r_dayNightNorthYaw 0
seta r_dayNightSunScale 1
seta r_dayNightMoonScale 0.035
seta r_dayNightAmbientScale 0.18
seta r_dayNightShadowFade 1
seta r_dayNightMoonShadow 0.18
seta r_weatherSunDim 1
seta r_weatherShadowDim 1

// Physical sky makes the changing sun easiest to inspect; classic skyboxes
// still work and keep their authored textures.
seta r_skyOwner 1
seta r_atmosphere 1

echo "[renderer] Day/night world lighting enabled. Inspect with daynight_status."
