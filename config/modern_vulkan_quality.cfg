// Quality overlay on the stable Unified Clustered spine.
// Reasserts WBOIT and adds SSR + light volumetrics. Still no TAA, Hybrid1, or streaming.
// Use: exec modern_vulkan_quality.cfg; vid_restart

exec modern_vulkan_stable.cfg

seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 0
seta r_stochasticAlpha 0

seta r_ssr 1
seta r_atmosphere 1
seta r_volumetricFog 1
seta r_vdb 0
seta r_vdbFog 0

seta r_taa 0
seta r_aaMode 2
seta r_exposure_auto 0

echo "[renderer] modern_vulkan_quality.cfg: stable + WBOIT + SSR + froxel fog (no TAA/RT)"
