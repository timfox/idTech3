// Cinematic Engine Platform 1.0 — Environment Vertical Slice candidate.
// NOT the boot default. Recovery: exec modern_vulkan.cfg; vid_restart
// Use: exec modern_cinematic_raster.cfg; vid_restart
// See docs/CINEMATIC_ENGINE_PLATFORM_1.0.md
//
// Builds on Raster Ultra 2.1 spatial AA + Ultra 2.0 ownership.
// Adds: scene platform, photometric contract, materials/HDR overlays,
// cinematic camera, deterministic capture. Character/destruction deferred.

exec modern_raster_cinematic.cfg

seta r_havenrpProfile "cinematic_raster"
seta r_scenePlatform 1
seta r_sceneLiveEdit 1
seta r_sceneInvalidateDebug 0

seta r_photometricLights 1
seta r_photometricLegacyScale 0.001
seta r_photometricKelvin 6500

// Material authoring + surface evolution (1.8)
exec vulkan_overlay_raster_ultra_1_8_materials.cfg

// HDR presentation + cinematic camera + capture honesty (1.10)
exec vulkan_overlay_raster_ultra_1_10_hdr_presentation.cfg
seta r_cinematicCamera 1
seta r_cineGameplayMode 1
seta r_cineDof 0
seta r_cineMotionBlur 0
seta r_cineLowLatency 1
seta r_cineExcludeWeapon 1
seta r_captureDeterministic 1
seta r_captureBlockHdrToSdr 1
seta r_captureColorSpace 0

// Volumetrics remain available but not forced to ultra quality here
// seta r_volumetricFog 1

// Explicit locks (reinforcement after overlays)
seta r_aaMode 2
seta r_taa 0
seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0
seta r_spineValidate 1

echo "[renderer] modern_cinematic_raster.cfg: Cinematic Engine Platform 1.0 ENVIRONMENT SLICE CANDIDATE (scene+photometric+spatial AA+materials+camera). TAA=0 RT=0. Not boot default. vid_restart required."
