// Vulkan overlay: Hybrid1 ray/raster path on top of the modern base.
// Requires USE_VULKAN_RTX build + ray tracing capable GPU.
// Inherits Unified Clustered (r_renderMode 3) from modern_vulkan.cfg.
// Use: exec vulkan_overlay_hybrid1.cfg; vid_restart

exec modern_vulkan.cfg

seta r_hybrid1 1
seta r_rtxDemo 1
seta r_hybrid1Quality 3
seta r_rtxEntities 1
seta r_rtxEntityTriCap 65536
seta r_rtxTlasUpdate 1

// Reuse the Hybrid1 TLAS for adaptive RTAO/GTAO ambient visibility.
seta r_ambientVisibilityMode 4
seta r_rtaoRaysPerPixel 1
seta r_rtaoRadius 96
seta r_rtaoMinRadius 12
seta r_rtaoResolutionScale 0.5
seta r_rtaoContactVisibility 1

// P3 bindless hit sampling (latched)
seta r_rtxBindless 1
seta r_rtxBindlessMode 1

// Quality preset 3 enables r_hybrid1_restir; pin explicitly for honesty.
seta r_hybrid1_restir 1

echo "[renderer] Vulkan overlay: Hybrid1 quality 3 + bindless + ReSTIR scaffold over mode-3 clustered base"
