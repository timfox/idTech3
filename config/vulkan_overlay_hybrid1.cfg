// Vulkan overlay: Hybrid1 ray/raster path on top of the modern base.
// Requires USE_VULKAN_RTX build + ray tracing capable GPU.
// Use: exec vulkan_overlay_hybrid1.cfg; vid_restart

exec modern_vulkan.cfg

seta r_hybrid1 1
seta r_rtxDemo 1
seta r_rtxEntities 1
seta r_rtxEntityTriCap 65536
seta r_rtxTlasUpdate 1

seta r_hybrid1_shadow 1
seta r_hybrid1_spec 1
seta r_hybrid1_diffuse 1
seta r_hybrid1_ibl 1
seta r_hybrid1_motion 1
seta r_hybrid1_taa 1
seta r_hybrid1_historyClamp 1
seta r_hybrid1_adaptiveBlur 1
seta r_hybrid1_separableBlur 1
seta r_hybrid1_reinhard 1
seta r_hybrid1_atrousIters 4
seta r_hybrid1_sunRadius 0.5
seta r_hybrid1_contactHarden 1
seta r_hybrid1_ggx 1
seta r_hybrid1_iblMode 2
seta r_hybrid1_diffuseDirect 1
seta r_hybrid1_dlightShadows 2

echo "[renderer] Vulkan overlay: Hybrid1 enabled over modern base"
