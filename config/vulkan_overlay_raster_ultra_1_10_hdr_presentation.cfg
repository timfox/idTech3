// Raster Ultra 1.10 — HDR presentation + cinematic camera + color pipeline (opt-in).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Does not force cinematic DOF/MB or HDR WSI on maps that do not need them.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_10_hdr_presentation.cfg; vid_restart
// Recovery: seta r_presentColor 0; seta r_exposureHistogram 0; seta r_cinematicCamera 0; seta r_exposure_auto 0; vid_restart
// See docs/RASTER_ULTRA_1.10.md

// Scene-linear + display (0 = certified SDR; set 2 only on HDR10 displays)
seta r_presentColor 0
seta r_presentPaperWhite 203
seta r_presentPeakNits 1000
seta r_presentUiWhite 203
seta r_presentTonemapPreference 4

// Histogram exposure (pairs with existing luminance.comp)
seta r_exposureHistogram 1
seta r_exposure_auto 1
seta r_exposureMeter 1
seta r_exposureComp 0
seta r_exposureFixed 0
seta r_exposureMinEV -3
seta r_exposureMaxEV 3
seta r_pre_exposure_scale 1

// Grade ownership (existing r_grade_* / LUT)
seta r_colorGrade 1
seta r_post 1

// Bloom energy-controlled (already Ultra default)
seta r_bloom 1
seta r_bloomKnee 0.5

// Cinematic camera model — DOF/MB remain off unless explicitly enabled
seta r_cinematicCamera 1
seta r_cineGameplayMode 1
seta r_cineDof 0
seta r_cineMotionBlur 0
seta r_cineLowLatency 1
seta r_cineExcludeWeapon 1

// Capture honesty
seta r_captureColorSpace 0
seta r_captureBlockHdrToSdr 1
seta r_captureDeterministic 0

// Keep local exposure off until certified
seta r_localExposure 0

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

echo "[renderer] Raster Ultra 1.10 presentation: scene-linear contract, histogram exposure, AgX pref, capture guards (RT=off FG=off)"
