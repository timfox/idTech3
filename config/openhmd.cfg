// OpenHMD VR defaults — exec after libopenhmd0 is installed:
//   exec openhmd.cfg
//
// Probe devices: ohmd_list
// Status:       ohmd_status
// Recenter:     ohmd_recenter

seta vr_openhmd "1"
seta vr_openhmdDevice "0"
seta vr_openhmdStereo "1"
seta vr_openhmdMouse "0"
seta vr_openhmdIpd "0"
seta vr_openhmdWorldScale "32"
seta vr_openhmdRoll "1"
seta vr_openhmdFov "0"

// Prefer a comfortable desktop mirror while developing without an HMD
// (null devices still provide orientation for testing when available).
seta cl_freelook "1"
