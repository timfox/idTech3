// Deterministic visual reproduction for oa_rpg3dm2 (OpenArena industrial pool room).
// Preserves selective hybrid work while keeping OA middleware off.
// Use:
//   cd release
//   ./idtech3 +set fs_game openarena +set cl_preferModernGraphics 1 \
//     +exec vulkan_overlay_oa_rpg3dm2_visual.cfg +map oa_rpg3dm2
// Recovery: exec classic_openarena_native.cfg; vid_restart

seta cl_preferModernGraphics 1
seta cl_autoGraphicsProfile 1

exec modern_openarena.cfg
exec vulkan_overlay_selective_hybrid.cfg

seta r_selectiveHybridSunShadow 1
seta r_havenrpSunShadowOwner auto
seta r_selectiveHybridReflection 1
seta r_havenrpReflectionOwner auto
seta r_hybrid1_shadow 1
seta r_hybrid1_spec 1
seta r_hybrid1_diffuse 0
seta r_hybrid1Quality 2
seta r_pathtrace 0
seta r_presentAdaptiveRecon 0

seta r_fullscreen 1
seta com_maxfps 0
seta r_picmip 0

echo "[renderer] oa_rpg3dm2 visual repro: modern OA + selective hybrid. Then: map oa_rpg3dm2; vid_restart"
echo "[renderer] Debug: r_pbrDebug 9..16 | r_avDebug | shr_status | shs_status | havenrp_renderer_status"
