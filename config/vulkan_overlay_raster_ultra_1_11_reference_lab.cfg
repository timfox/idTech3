// Raster Ultra 1.11 — Rendering Reference Lab (opt-in). NO new rendering techniques.
// Prefer after modern_raster_reference.cfg or modern_raster_ultra.cfg.
// Use: exec modern_raster_reference.cfg; exec vulkan_overlay_raster_ultra_1_11_reference_lab.cfg; vid_restart
// Recovery: seta r_referenceLab 0; exec modern_vulkan.cfg; vid_restart
// See docs/RASTER_ULTRA_1.11.md

seta r_referenceLab 1
seta r_referenceLabScene 0
seta r_referenceLabSeed 1
seta r_referenceLabDecomp 0
seta r_referenceLabMode 4
seta r_referenceLabSupersample 1
seta r_referenceLabFreezeAnim 1

// Deterministic capture pins
seta r_filmGrain 0
seta r_chromaticAberration 0
seta r_filmLook 0
seta r_exposure_auto 0
seta r_exposureFixed 1
seta r_captureDeterministic 1
seta r_captureColorSpace 0
seta r_captureBlockHdrToSdr 1
seta r_bloom 0
seta r_taa 0
seta r_aaMode 0

seta r_hybrid1 0
seta r_rtx 0
seta r_pathtrace 0

echo "[renderer] Raster Ultra 1.11 Reference Lab: deterministic validation, material reference mode (RT=off FG=off; no new techniques)"
