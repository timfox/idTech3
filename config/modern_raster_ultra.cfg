// Raster Ultra 1.0 — high-end raster foundation (RT locked OFF).
// Does NOT change modern_vulkan.cfg / certified Spine 1.0 boot.
// Sprint target: mode 3 + Z clusters + GTAO + specular AA + raster sun shadow + SMAA.
// Use: exec modern_raster_ultra.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg; vid_restart
// See docs/RASTER_ULTRA_1.0.md

exec modern_clustered.cfg

seta r_havenrpProfile "raster_ultra"
seta r_rasterUltra 1

// Depth-partitioned clusters (already set by modern_clustered; reassert)
seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1
seta r_forwardPlusOverflowShade 1

// Specular AA (Forward+ + deferred compute parity)
seta r_pbr_specularAA 1
seta r_pbr_specularAAStrength 0.5

// GTAO directional ambient visibility (raster only)
seta r_ambientVisibilityMode 2
seta r_ambientVisibilityStrength 1
seta r_gtaoSlices 4
seta r_gtaoSteps 6
seta r_gtaoThickness 2
seta r_ssao 0

// Raster shadows (single-cascade sun; local atlas scaffold)
seta r_pbrSunShadow 1
seta r_pbrSunShadowStrength 1
seta r_fogShadowSnap 1

// SSR probe fallback path available; keep off until foundation soak is green
seta r_ssr 0

// Presentation: SMAA, no TAA, no OIT in foundation sprint
seta r_aaMode 2
seta r_taa 0
seta r_oit 0
seta r_bloom 1
seta r_tonemap 3

// Authored normals opt-in for DCC props (legacy MD3/BSP unchanged at policy 0 default)
// seta r_meshNormalPolicy 1

// === RT LOCK (Raster Ultra contract) ===
seta r_hybrid1 0
seta r_hybrid1_taa 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_grtx 0
seta r_wpt 0
seta r_fsa 0
seta r_ndgi 0
seta r_niv 0
seta r_nvc 0

echo "[renderer] modern_raster_ultra.cfg: Raster Ultra foundation (mode 3, GTAO, specularAA, sun shadow; RT=0). vid_restart required."
