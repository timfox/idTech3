// Raster Ultra 1.7+ base — RT locked OFF. SMAA remains certified default (r_aaMode 2).
// Reference Lab / visual certification is opt-in:
//   exec modern_raster_reference.cfg; exec vulkan_overlay_raster_ultra_1_11_reference_lab.cfg
// Frequency-aware moiré suppression is opt-in:
//   exec vulkan_overlay_frequency_aware.cfg
// HDR presentation / cinematic camera / pro color are opt-in:
//   exec vulkan_overlay_raster_ultra_1_10_hdr_presentation.cfg
// Virtualized raster shadows are opt-in:
//   exec vulkan_overlay_raster_ultra_1_9_virtual_shadows.cfg
// Material Authoring 2.0 / surface evolution is opt-in:
//   exec vulkan_overlay_raster_ultra_1_8_materials.cfg
// Physical atmosphere / weather / clouds are opt-in:
//   exec vulkan_overlay_raster_ultra_1_7_atmosphere.cfg
// GPU-driven geometry is opt-in:
//   exec vulkan_overlay_raster_ultra_1_6_geometry.cfg
// Terrain + biomes + GPU vegetation are opt-in:
//   exec vulkan_overlay_raster_ultra_1_14_terrain.cfg
// Present-Time Adaptive Reconstruction is opt-in:
//   exec vulkan_overlay_present_adaptive_recon.cfg
// Use: exec modern_raster_ultra.cfg; vid_restart
// Recovery: exec modern_vulkan.cfg; vid_restart
// See docs/RASTER_ULTRA_1.6.md .. docs/RASTER_ULTRA_1.14.md

exec modern_clustered.cfg

seta r_havenrpProfile "raster_ultra"
seta r_rasterUltra 1

seta r_forwardPlusZSlices 8
seta r_forwardPlusZSliceMode 1
seta r_forwardPlusOverflowShade 1

seta r_pbr_specularAA 1
seta r_pbr_specularAAStrength 0.5

seta r_ambientVisibilityMode 2
seta r_ambientVisibilityStrength 1
seta r_gtaoSlices 4
seta r_gtaoSteps 6
seta r_gtaoThickness 2
seta r_ssao 0

// Cascaded sun shadows (Raster Ultra 1.1)
seta r_pbrSunShadow 1
seta r_pbrSunShadowStrength 1
seta r_fogShadowSnap 1
seta r_sunShadowCascades 4
seta r_sunShadowDistance 4096
seta r_sunShadowSplitLambda 0.75
seta r_sunShadowCascadeBlend 0.08
seta r_sunShadowStable 1
seta r_fogShadowMapSize 1024

// === Raster Ultra 1.3 — diffuse GI (latched) ===
seta r_probeGi 1
seta r_probeGiStrength 1
seta r_probeGiSpacing 256
seta r_probeGiMax 2048
seta r_probeGiBudget 64
seta r_probeGiMode 0
seta r_probeGiStaticScale 0
seta r_probeGiDynamicScale 1
seta r_probeGiMinVis 0.02
seta r_probeGiAuto 1
seta r_probeGiCache 1
seta r_ssgi 1
seta r_ssgiStrength 0.65
seta r_ssgiSteps 12
seta r_ssgiThickness 24
seta r_ssgiDistance 192
seta r_ssgiNearScale 1
seta r_ssgiEdgeFade 32
seta r_rasterGiAoStrength 1
seta r_rasterGiLightmapDelta 1
seta r_havenrpDiffuseGiOwner "auto"
seta r_rasterGiDebug 0

// === Raster Ultra 1.13 — clipmapped radiance cache (latched) ===
seta r_radianceCache 1
seta r_radianceCacheLevels 3
seta r_radianceCacheGrid 24
seta r_radianceCacheCellSize 96
seta r_radianceCacheBudget 512
seta r_radianceCachePropIters 1
seta r_radianceCacheStrength 1
seta r_radianceCacheInjectScale 0.35
seta r_radianceCacheEmissive 1
seta r_radianceCacheEmissiveScale 0.5
seta r_radianceCacheSkyScale 0.02
seta r_radianceCacheDecay 0.92
seta r_radianceCacheQuality 3
seta r_radianceCacheDebug 0

// === Raster Ultra 1.4 — transparency / effects ===
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 1
seta r_oitDebug 0
seta r_refractiveExcludeOit 1
seta r_transparencyDebug 0
seta r_gpuParticles 1
seta r_gpuParticlesDemo 0
seta r_gpuParticlesSoftScale 1
seta r_deferredDecals 1
seta r_distortion 1
seta r_distortionMaxPx 24
seta r_reactiveMaskForce 1
seta r_temporalReactiveMask 1

seta r_ssr 0
seta r_aaMode 2
seta r_taa 0
seta r_bloom 1
seta r_tonemap 3

// MBOIT remains optional (not Ultra-certified)
// seta r_oit 2

// === RT LOCK ===
seta r_hybrid1 0
seta r_hybrid1_taa 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_selectiveHybridSunShadow 0
seta r_selectiveHybridReflection 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_grtx 0
seta r_wpt 0
seta r_fsa 0
seta r_niv 0
seta r_ndgi 0
seta r_nvc 0
seta r_vfgi 0

echo "[renderer] modern_raster_ultra.cfg: Raster Ultra 1.14 base (probe+cache GI/FX; terrain via 1.14 overlay; RT=0). vid_restart required."
