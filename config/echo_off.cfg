// Instant kill for residual shading / multi-silhouette echoes (no vid_restart).
// Note: r_aaMode is LATCH — print may show 2 while the previous mode is still
// active until vid_restart. r_taa 0 + r_tsr 0 stops history immediately.
set r_taa 0
set r_tsr 0
set r_upscale 0
set r_aaMode 2
set r_taaMotionVectors 0
set r_ssr 0
set r_temporalSSR 0
set r_ssao 0
set r_temporalAO 0
set r_bloom 0
set r_motionBlur 0
set r_temporalFog 0
set r_temporalTransparency 0
set r_temporalDebug 0
echo "^2[surf] echo kill: taa=0 tsr=0 ssr=0 upscale=0 (vid_restart to latch aaMode 2 / SMAA)"
