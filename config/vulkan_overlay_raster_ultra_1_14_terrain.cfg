// Raster Ultra 1.14 — Terrain + Vegetation + Biomes (opt-in overlay).
// Prefer after modern_raster_ultra.cfg. Does NOT change certified SMAA boot.
// Use: exec modern_raster_ultra.cfg; exec vulkan_overlay_raster_ultra_1_14_terrain.cfg; vid_restart
// Then: cbt_load <heightmap>; cbt_splat <control> [layers...]
// Recovery: seta r_cbtTerrain 0; seta r_biome 0; seta r_vegGpu 0; seta r_gpuSceneWorldType 0; vid_restart
// See docs/RASTER_ULTRA_1.14.md

// World routing — classic remains safe default; set 1 only with terrain metadata
seta r_gpuSceneWorldType 0

// Terrain (tiled heightfield / CBT)
seta r_cbtTerrain 1
seta r_cbtTerrainScale 256
seta r_cbtTerrainGrid 32
seta r_cbtTerrainSplat 1
seta r_cbtTerrainLodHysteresis 1
seta r_cbtTerrainQuality 2
seta r_cbtTerrainDeform 0
seta r_cbtTerrainDebug 0

// Biomes (deterministic)
seta r_biome 1
seta r_biomeSeed 1
seta r_biomeSeason 0
seta r_biomeWetness 0
seta r_biomeDebug 0

// GPU vegetation
seta r_vegGpu 1
seta r_vegGpuDensity 0.45
seta r_vegGpuMaxInstances 16384
seta r_vegGpuDraw 1
seta r_vegGpuInteraction 1
seta r_vegGpuShadowLod 1
seta r_vegGpuAlphaCoverage 1
seta r_vegGpuDebug 0

// Wind companion (existing SURF_VEGETATION path)
seta r_vegWind 1

// Presentation contract — SMAA, no required TAA, no RT
seta r_aaMode 2
seta r_taa 0
seta r_hybrid1 0
seta r_rtx 0
seta r_rtxDemo 0
seta r_pathtrace 0
seta r_surfelGi 0
seta r_rcgi 0
seta r_grtx 0
seta r_wpt 0
seta r_fsa 0

echo "[renderer] Raster Ultra 1.14 terrain/biome/veg overlay (RT=0 SMAA; load heightmap via cbt_load). vid_restart required."
