// Spine 1.1 certification overlay (opt-in; does NOT change boot defaults).
// Target: Unified Clustered (mode 3) + WBOIT + Temporal Reconstruction + weapon-after
//         + bloom + eye adapt + UI-after-tonemap ownership asserts.
// Boot / Spine 1.0 shipping remains modern_vulkan.cfg → stable (mode 2 + SMAA).
// Use: exec vulkan_overlay_spine_1_1_cert.cfg; vid_restart
// Or:  renderer_spine_1_1_cert
// See docs/RENDERER_SPINE_1.1.md

exec modern_clustered.cfg
exec vulkan_overlay_temporal_recon.cfg

// WBOIT (not MBOIT) — Spine 1.1 cert target
seta r_oit 1
seta r_oitForwardPlus 1
seta r_oitClassify 0
seta r_stochasticAlpha 0

seta r_bloom 1
seta r_exposure_auto 1
seta r_hdr 2
seta r_fbo 1
seta r_ext_multisample 0

// Strict ownership / black-frame / descriptor generation asserts
seta r_spineValidate 2
seta r_spineCert 1

echo "[renderer] Spine 1.1 CERT: mode3 + WBOIT + Temporal Reconstruction + weapon-after + bloom/eyeAdapt (r_spineCert 1). Run vid_restart. Recovery: exec modern_vulkan.cfg"
