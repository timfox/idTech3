// Controlled temporal-reprojection validation (Phase 10).
// Use against a checkerboard wall + one rigid mesh (helmet / cube).
// Static gate: ./scripts/temporal_reprojection_check.sh
//
// Recommended:
//   +set r_fbo 1 +set r_taa 1 +set r_taaMotionVectors 1
//   +exec demo_temporal_reprojection.cfg
// Then cycle r_temporalDebug 28–35 while strafing / yawing.

seta r_fbo 1
seta r_taa 1
seta r_taaMotionVectors 1
seta r_temporalVarianceClip 1
seta r_temporalDisocclusion 1

// Instrumentation (does not change resolve weights)
seta r_temporalResolutionDebug 1
seta r_temporalVelocityProbe 1
seta r_temporalDebug 32

echo "Temporal reprojection demo:"
echo "  r_temporalDebug 28 raw velocity | 30 pixels/64 | 32 scale ratio | 35 correspondence"
echo "  temporal_resolution_status / temporal_motion_status for extents + entity ages"
echo "  Acceptance: mode 32 green under steady motion; no multi-silhouette echoes"

temporal_resolution_status
