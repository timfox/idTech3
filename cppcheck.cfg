# Cppcheck configuration for id Tech 3
# This file contains cppcheck settings and suppressions

# Enable all checks except those that are too noisy or inappropriate for game engine code
enable=all
# Disable some checks that are not relevant or too noisy for C game code
disable=missingIncludeSystem
disable=unusedFunction  # Many functions are used by QVM
disable=unmatchedSuppression
disable=unknownMacro  # Engine has many platform-specific macros
disable=unusedStructMember  # Structs often have reserved/unused members
disable=constParameter  # Many parameters can't be const due to C API requirements
disable=constVariable  # Some variables need to be non-const for compatibility
disable=variableScope  # Engine coding style uses different scoping patterns

# Platform-specific suppressions
suppress=unusedFunction:*linux*  # Platform-specific functions
suppress=unusedFunction:*win32*
suppress=unusedFunction:*macos*
suppress=unusedFunction:*sdl*

# QVM-related suppressions (QVM bytecode functions may appear unused)
suppress=unusedFunction:qvm_*  # QVM bridge functions
suppress=unusedFunction:vmCvar*  # QVM cvar functions
suppress=unusedFunction:vmMain  # QVM entry point

# SDL-related suppressions (SDL functions may be called via function pointers)
suppress=unusedFunction:*SDL*
suppress=unusedFunction:*SDL_*

# Network-related suppressions (some network functions may appear unused)
suppress=unusedFunction:*NET_*
suppress=unusedFunction:*net*  # Lowercase versions

# Memory management suppressions (engine allocators)
suppress=unusedFunction:*Z_*
suppress=unusedFunction:*Hunk_*

# File system suppressions
suppress=unusedFunction:*FS_*
suppress=unusedFunction:*fs_*

# Renderer suppressions (many renderer functions are called via tables)
suppress=unusedFunction:*RB_*
suppress=unusedFunction:*rb_*
suppress=unusedFunction:*vk_*
suppress=unusedFunction:*VK_*

# Third-party library suppressions
suppress=unusedFunction:*png*  # PNG library functions
suppress=unusedFunction:*jpeg*  # JPEG library functions
suppress=unusedFunction:*zlib*  # ZLib functions
suppress=unusedFunction:*curl*  # CURL functions

# Build system suppressions (CMake-generated files)
suppress=unusedFunction:*_autogen*
suppress=unusedFunction:*moc_*

# Template suppressions for specific files
suppress=unusedFunction:src/qcommon/q_shared.c  # Shared utility functions
suppress=unusedFunction:src/qcommon/common.c    # Common engine functions

# Library-specific suppressions
suppress=unusedFunction:*entt*  # EnTT ECS library
suppress=unusedFunction:*lua*   # Lua scripting
suppress=unusedFunction:*enet*  # ENet networking

# Performance-critical suppressions (some functions are intentionally simple)
suppress=performanceMoveConstArg
suppress=performanceUnnecessaryValueParam

# Allow some platform-specific patterns
suppress=invalidscanf  # scanf usage is controlled and safe in this codebase

# Maximum number of configurations to check (reduce analysis time)
max-configs=12

# Include paths for better analysis
include-path=src/
include-path=src/qcommon/
include-path=src/client/
include-path=src/server/
include-path=src/renderercommon/
include-path=src/renderervk/
include-path=src/renderer/
include-path=libs/

# Define common macros to improve analysis
define=WIN32
define=_WIN32
define=__linux__
define=__APPLE__
define=Q3_VM
define=USE_VULKAN
define=USE_OPENGL
define=USE_SDL

# Force language standard
std=c99
std=c++17