// Textlab font configuration (minimal, single atlas)
// Keep fonts simple and deterministic for crispness tests.

// Primary text font
font "fonts/Roboto-Regular.ttf" 32

// Small and big variants reuse the same atlas to avoid extra uploads
smallFont "fonts/Roboto-Regular.ttf" 24
bigFont "fonts/Roboto-Bold.ttf" 48

// Optional fallback chain example (commented)
// fontFallback "fonts/Roboto-Regular.ttf" 32 "fonts/Roboto-Bold.ttf"
