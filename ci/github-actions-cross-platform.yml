# GitHub Actions CI/CD Pipeline with Cross-Platform Compatibility Testing
# This demonstrates automated testing across multiple platforms and architectures

name: Cross-Platform Compatibility Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run cross-platform tests weekly
    - cron: '0 2 * * 1'

jobs:
  # Test on multiple Linux distributions
  linux-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]
        compiler: [gcc, clang]
        exclude:
          # Exclude some combinations to reduce test matrix
          - os: ubuntu-20.04
            compiler: clang

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libvulkan-dev libopenal-dev libcurl4-openssl-dev sqlite3 libsqlite3-dev

        # Install specific compiler versions
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi

    - name: Configure build
      run: |
        mkdir build && cd build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          export CC=clang CXX=clang++
        fi
        cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CROSS_PLATFORM_TESTS=ON

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Run cross-platform compatibility tests
      run: |
        cd build
        # Run basic compatibility detection
        ./idtech3_vulkan_x86_64 +set crosstest detect

        # Generate platform-specific test suite
        ./idtech3_vulkan_x86_64 +set crosstest generate platform

        # Run the generated test suite
        ./idtech3_vulkan_x86_64 +set crosstest suite run generated_suite

        # Validate platform compatibility
        ./idtech3_vulkan_x86_64 +set crosstest validate

    - name: Export compatibility results
      if: always()
      run: |
        mkdir -p cross_platform_results
        cd build
        ./idtech3_vulkan_x86_64 +set crosstest export ../cross_platform_results

    - name: Upload compatibility results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cross-platform-results-${{ matrix.os }}-${{ matrix.compiler }}
        path: cross_platform_results/
        retention-days: 30

  # Test on Windows
  windows-compatibility:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
        config: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up MSVC
      uses: microsoft/setup-msvc@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Configure build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DENABLE_CROSS_PLATFORM_TESTS=ON -A ${{ matrix.arch == 'x64' && 'x64' || 'Win32' }}

    - name: Build project
      run: |
        cd build
        cmake --build . --config ${{ matrix.config }} --parallel

    - name: Run cross-platform compatibility tests
      run: |
        cd build/${{ matrix.config }}
        # Run basic compatibility detection
        ./idtech3_vulkan_x86_64.exe +set crosstest detect

        # Generate platform-specific test suite
        ./idtech3_vulkan_x86_64.exe +set crosstest generate platform

        # Run the generated test suite
        ./idtech3_vulkan_x86_64.exe +set crosstest suite run generated_suite

        # Validate platform compatibility
        ./idtech3_vulkan_x86_64.exe +set crosstest validate

    - name: Export compatibility results
      if: always()
      run: |
        mkdir cross_platform_results
        cd build/${{ matrix.config }}
        ./idtech3_vulkan_x86_64.exe +set crosstest export ../../cross_platform_results

    - name: Upload compatibility results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cross-platform-results-windows-${{ matrix.arch }}-${{ matrix.config }}
        path: cross_platform_results/
        retention-days: 30

  # Test on macOS
  macos-compatibility:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up dependencies
      run: |
        brew install cmake sdl2 vulkan-headers openal-soft curl sqlite

    - name: Configure build
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CROSS_PLATFORM_TESTS=ON

    - name: Build project
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Run cross-platform compatibility tests
      run: |
        cd build
        # Run basic compatibility detection
        ./idtech3_vulkan_x86_64 +set crosstest detect

        # Generate platform-specific test suite
        ./idtech3_vulkan_x86_64 +set crosstest generate platform

        # Run the generated test suite
        ./idtech3_vulkan_x86_64 +set crosstest suite run generated_suite

        # Validate platform compatibility
        ./idtech3_vulkan_x86_64 +set crosstest validate

    - name: Export compatibility results
      if: always()
      run: |
        mkdir cross_platform_results
        cd build
        ./idtech3_vulkan_x86_64 +set crosstest export ../cross_platform_results

    - name: Upload compatibility results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cross-platform-results-macos
        path: cross_platform_results/
        retention-days: 30

  # Cross-platform compatibility analysis
  compatibility-analysis:
    needs: [linux-compatibility, windows-compatibility, macos-compatibility]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Download all compatibility results
      uses: actions/download-artifact@v3
      with:
        name: cross-platform-results-ubuntu-22.04-gcc
        path: results/ubuntu/

    - name: Download Windows results
      uses: actions/download-artifact@v3
      with:
        name: cross-platform-results-windows-x64-Release
        path: results/windows/

    - name: Download macOS results
      uses: actions/download-artifact@v3
      with:
        name: cross-platform-results-macos
        path: results/macos/

    - name: Analyze cross-platform compatibility
      run: |
        echo "=== Cross-Platform Compatibility Analysis ==="
        echo "Analyzing results from multiple platforms..."

        # Count total results files
        find results/ -name "*.json" -o -name "*.xml" | wc -l | xargs echo "Total result files:"

        # Check for compatibility issues
        if find results/ -name "*.json" -exec grep -l "FAIL" {} \;; then
          echo "❌ Compatibility issues detected!"
          find results/ -name "*.json" -exec grep -l "FAIL" {} \;
          exit 1
        else
          echo "✅ All platforms passed compatibility tests"
        fi

    - name: Generate compatibility report
      run: |
        echo "# Cross-Platform Compatibility Report" > compatibility_report.md
        echo "" >> compatibility_report.md
        echo "## Test Results Summary" >> compatibility_report.md
        echo "" >> compatibility_report.md

        # Generate summary from results
        echo "| Platform | Status | Details |" >> compatibility_report.md
        echo "|----------|--------|---------|" >> compatibility_report.md

        # Add platform results (simplified)
        if [ -d "results/ubuntu" ]; then
          echo "| Ubuntu 22.04 (GCC) | $([ -f results/ubuntu/* ] && echo '✅ Passed' || echo '❌ Failed') | Cross-platform tests executed |" >> compatibility_report.md
        fi

        if [ -d "results/windows" ]; then
          echo "| Windows x64 | $([ -f results/windows/* ] && echo '✅ Passed' || echo '❌ Failed') | Cross-platform tests executed |" >> compatibility_report.md
        fi

        if [ -d "results/macos" ]; then
          echo "| macOS | $([ -f results/macos/* ] && echo '✅ Passed' || echo '❌ Failed') | Cross-platform tests executed |" >> compatibility_report.md
        fi

        echo "" >> compatibility_report.md
        echo "## Recommendations" >> compatibility_report.md
        echo "" >> compatibility_report.md
        echo "- Ensure consistent behavior across all supported platforms" >> compatibility_report.md
        echo "- Regularly update platform-specific dependencies" >> compatibility_report.md
        echo "- Monitor for platform-specific regressions" >> compatibility_report.md

    - name: Upload compatibility report
      uses: actions/upload-artifact@v3
      with:
        name: cross-platform-compatibility-report
        path: compatibility_report.md
        retention-days: 90

    - name: Comment compatibility results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          let reportContent = '';
          try {
            reportContent = fs.readFileSync('compatibility_report.md', 'utf8');
          } catch (e) {
            reportContent = 'Compatibility report not available';
          }

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `
              ## Cross-Platform Compatibility Test Results

              ### Summary
              Automated compatibility tests have been executed across multiple platforms.

              ### Detailed Results
              ${reportContent.replace(/#/g, '###')}

              ### CI Status
              - ✅ Linux compatibility tests completed
              - ✅ Windows compatibility tests completed
              - ✅ macOS compatibility tests completed

              *Full compatibility reports are available in the workflow artifacts.*
            `
          })

  # Architecture-specific testing (x86/x64)
  architecture-testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: i386
          - os: windows-latest
            arch: x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up architecture-specific build
      run: |
        if [ "${{ matrix.arch }}" = "i386" ]; then
          # Install 32-bit development tools
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          export CFLAGS="-m32"
          export CXXFLAGS="-m32"
        fi

    - name: Configure build
      run: |
        mkdir build && cd build
        if [ "${{ matrix.arch }}" = "i386" ]; then
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CROSS_PLATFORM_TESTS=ON -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32"
        else
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CROSS_PLATFORM_TESTS=ON
        fi

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Run architecture-specific tests
      run: |
        cd build
        # Run architecture detection
        ./idtech3_vulkan_x86_64 +set crosstest detect

        # Run architecture-specific tests
        ./idtech3_vulkan_x86_64 +set crosstest generate arch
        ./idtech3_vulkan_x86_64 +set crosstest suite run generated_suite

    - name: Upload architecture test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: arch-test-results-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          **/test_results*.json
          **/arch_*.log
        retention-days: 30

  # Compiler compatibility testing
  compiler-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc-9, gcc-10, gcc-11, clang-11, clang-12, clang-13]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up compiler
      run: |
        if [[ "${{ matrix.compiler }}" == gcc-* ]]; then
          sudo apt-get install -y ${{ matrix.compiler }} g++-${{ matrix.compiler#gcc-}}
          echo "CC=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ matrix.compiler#gcc-}}" >> $GITHUB_ENV
        elif [[ "${{ matrix.compiler }}" == clang-* ]]; then
          sudo apt-get install -y clang-${{ matrix.compiler#clang-}}
          echo "CC=clang-${{ matrix.compiler#clang-}}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.compiler#clang-}}" >> $GITHUB_ENV
        fi

    - name: Configure build
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CROSS_PLATFORM_TESTS=ON

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Run compiler compatibility tests
      run: |
        cd build
        # Run compiler detection
        ./idtech3_vulkan_x86_64 +set crosstest detect

        # Run compiler-specific tests
        ./idtech3_vulkan_x86_64 +set crosstest generate compiler
        ./idtech3_vulkan_x86_64 +set crosstest suite run generated_suite

    - name: Upload compiler test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: compiler-test-results-${{ matrix.compiler }}
        path: |
          **/test_results*.json
          **/compiler_*.log
        retention-days: 30

  # Final compatibility assessment
  compatibility-assessment:
    needs: [compatibility-analysis, architecture-testing, compiler-testing]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        pattern: "*-test-results-*"
        path: all_test_results/

    - name: Assess overall compatibility
      run: |
        echo "=== Final Cross-Platform Compatibility Assessment ==="

        # Count successful vs failed tests across all platforms
        total_tests=$(find all_test_results/ -name "*.json" -o -name "*.xml" | wc -l)
        failed_tests=$(find all_test_results/ -name "*.json" -o -name "*.xml" -exec grep -l "FAIL\|ERROR\|CRASH" {} \; | wc -l)

        echo "Total test runs: $total_tests"
        echo "Failed test runs: $failed_tests"

        if [ "$failed_tests" -gt "0" ]; then
          echo "❌ Cross-platform compatibility issues detected"
          echo "Failed platforms/tests:"
          find all_test_results/ -name "*.json" -o -name "*.xml" -exec grep -l "FAIL\|ERROR\|CRASH" {} \; | head -10
          exit 1
        else
          echo "✅ All cross-platform compatibility tests passed"
        fi

    - name: Create compatibility badge
      run: |
        if [ "$failed_tests" -eq "0" ]; then
          echo "cross-platform-compatible=true" >> $GITHUB_OUTPUT
          echo "✅ Cross-platform compatible" > compatibility_status.txt
        else
          echo "cross-platform-compatible=false" >> $GITHUB_OUTPUT
          echo "❌ Compatibility issues detected" > compatibility_status.txt
        fi

    - name: Upload compatibility status
      uses: actions/upload-artifact@v3
      with:
        name: compatibility-status
        path: compatibility_status.txt
        retention-days: 1
