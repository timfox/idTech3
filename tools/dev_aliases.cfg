// Developer/QA convenience aliases (use via: vstr <name>)
// Not auto-executed; run "exec tools/dev_aliases.cfg" to load.

seta prof_gpu "r_speeds 1; com_drawFPS 1; r_picmip 0; r_lodbias 0; r_vsync 0"
seta safe_render "r_picmip 2; r_lodbias 1; r_fullscreen 0; r_hdr 0; r_multiSamples 0; r_vsync 1"
seta replay_on "g_recordReplay 1"
seta replay_off "g_recordReplay 0"
seta net_debug "cl_shownet 2; cg_lagometer 1; net_log 1"
seta net_reset "cl_shownet 0; cg_lagometer 0; net_log 0"
seta capture_error "r_logFile 2; logfile 2"

echo "Loaded tools/dev_aliases.cfg (use vstr <alias> to run)"

